<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FJK Sistema</title>
<meta name="theme-color" content="#2f5d1e">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--verde:#2f5d1e;--verde2:#4c8a2b;--lima:#a7c232;--fundo:#f3f5f0;--borda:#dde3d6;--texto:#1f2a1a;--cinza:#6b7565;--vermelho:#b3261e}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--fundo);color:var(--texto);font-size:15px}
header{background:var(--verde);color:#fff;padding:10px 14px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:1000}
.logo{width:38px;height:38px;border-radius:9px;background:#fff;color:var(--verde);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;letter-spacing:-.5px;flex:none}
header h1{font-size:16px;margin:0;font-weight:700;line-height:1.1}
header small{opacity:.8;font-size:12px}
header .esp{flex:1}
header select{background:var(--verde2);color:#fff;border:0;border-radius:8px;padding:7px 8px;font-size:14px;max-width:170px}
.btn{border:0;border-radius:9px;padding:10px 14px;font-size:15px;font-weight:600;cursor:pointer;background:var(--verde2);color:#fff}
.btn.sec{background:#fff;color:var(--verde);border:1px solid var(--borda)}
.btn.perigo{background:var(--vermelho)}
.btn.peq{padding:6px 10px;font-size:13px}
.btn:disabled{opacity:.5}
main{padding:14px;max-width:1100px;margin:0 auto}
.grade{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.quad{background:#fff;border:1px solid var(--borda);border-radius:14px;padding:18px 12px;text-align:center;cursor:pointer;min-height:110px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.quad:active{transform:scale(.98)}
.quad .ic{font-size:30px}
.quad b{font-size:15px}
.quad span{font-size:12px;color:var(--cinza)}
.secao{font-size:13px;font-weight:700;color:var(--cinza);text-transform:uppercase;letter-spacing:.5px;margin:18px 2px 8px}
.topo{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.topo h2{margin:0;font-size:20px;flex:1}
.voltar{background:none;border:0;font-size:22px;cursor:pointer;color:var(--verde);padding:4px 8px}
.filtros{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.filtros input,.filtros select{flex:1;min-width:140px}
input,select,textarea{font:inherit;padding:10px;border:1px solid var(--borda);border-radius:9px;background:#fff;width:100%}
label{font-size:13px;color:var(--cinza);display:block;margin:10px 0 4px}
.tabela{background:#fff;border:1px solid var(--borda);border-radius:12px;overflow:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th{background:#eef2e8;text-align:left;padding:9px 10px;font-size:12px;color:var(--cinza);white-space:nowrap;position:sticky;top:0}
td{padding:9px 10px;border-top:1px solid var(--borda);white-space:nowrap}
tr.clic{cursor:pointer}
tr.clic:hover td{background:#f7faf3}
.num{text-align:right}
.rodape{font-size:13px;color:var(--cinza);margin:8px 2px}
.vazio{padding:30px;text-align:center;color:var(--cinza)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:flex-end;justify-content:center;z-index:2000}
.caixa{background:#fff;border-radius:16px 16px 0 0;padding:16px;width:100%;max-width:560px;max-height:92vh;overflow:auto}
@media(min-width:700px){.modal{align-items:center}.caixa{border-radius:16px}}
.caixa h3{margin:0 0 6px}
.acoes{display:flex;gap:8px;margin-top:16px}
.acoes .btn{flex:1}
.login{max-width:380px;margin:50px auto;background:#fff;border:1px solid var(--borda);border-radius:16px;padding:22px}
.login .logo{width:64px;height:64px;font-size:22px;margin:0 auto 10px;background:var(--verde);color:#fff}
.login h2{text-align:center;margin:0 0 4px}
.login p{text-align:center;color:var(--cinza);margin:0 0 14px;font-size:14px}
.link{background:none;border:0;color:var(--verde2);font-weight:600;cursor:pointer;padding:8px;width:100%}
.msg{padding:10px;border-radius:9px;margin-top:10px;font-size:14px}
.msg.erro{background:#fde8e6;color:var(--vermelho)}
.msg.ok{background:#e7f3df;color:var(--verde)}
#mapa{height:calc(100vh - 150px);min-height:380px;border-radius:12px;border:1px solid var(--borda)}
.rotulo{background:none;border:0;box-shadow:none;color:#fff;font-weight:700;font-size:11px;text-shadow:0 0 3px #000,0 0 3px #000}
.pill{display:inline-block;padding:2px 8px;border-radius:20px;background:#eef2e8;font-size:12px}
.cor{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:middle;margin-right:6px}
.chk{display:flex;align-items:center;gap:8px;padding:6px 0;font-size:14px}
.chk input{width:auto}
.lista-areas{max-height:240px;overflow:auto;border:1px solid var(--borda);border-radius:9px;padding:4px 10px}
#aviso{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#1f2a1a;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;z-index:3000;display:none}
</style>
</head>
<body>
<div id="app"></div>
<div id="aviso"></div>
<script>
const SUPABASE_URL = 'https://jmdjoofjetjcwhpfgyiv.supabase.co';
const SUPABASE_KEY = 'sb_publishable_KuP1vwLUWIAqNDpDdgatxQ_fSkBxhZ1';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const E = {usuario:null, perfil:null, fazendas:[], fazenda:null, papel:null, tela:'inicio'};
const $ = s => document.querySelector(s);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtNum = (v, d=2) => v == null || v === '' ? '' : Number(v).toLocaleString('pt-BR', {minimumFractionDigits:d, maximumFractionDigits:d});
const fmtData = v => { if(!v) return ''; const d = new Date(v); return isNaN(d) ? '' : d.toLocaleDateString('pt-BR', {day:'2-digit',month:'2-digit',year:'numeric'}); };
function aviso(t){ const a=$('#aviso'); a.textContent=t; a.style.display='block'; clearTimeout(a._t); a._t=setTimeout(()=>a.style.display='none',2600); }
const podeEditar = () => E.perfil?.admin || ['admin','gerente','operador'].includes(E.papel);
const ehAdmin = () => E.perfil?.admin || E.papel === 'admin';

// ---------- Login ----------
function telaLogin(modo='entrar', msg=''){
  const titulos = {entrar:'Entrar', criar:'Criar conta', esqueci:'Recuperar senha'};
  $('#app').innerHTML = `
  <div class="login">
    <div class="logo">FJK</div>
    <h2>FJK Agropecuária</h2>
    <p>${titulos[modo]}</p>
    ${modo==='criar' ? '<label>Seu nome</label><input id="lnome" autocomplete="name">' : ''}
    <label>Email</label><input id="lemail" type="email" autocomplete="email">
    ${modo!=='esqueci' ? `<label>Senha</label><input id="lsenha" type="password" autocomplete="${modo==='criar'?'new-password':'current-password'}">` : ''}
    <div class="acoes"><button class="btn" id="lbtn">${titulos[modo]}</button></div>
    ${msg}
    ${modo==='entrar' ? '<button class="link" data-m="criar">Criar conta</button><button class="link" data-m="esqueci">Esqueci a senha</button>' : '<button class="link" data-m="entrar">Voltar para entrar</button>'}
  </div>`;
  document.querySelectorAll('.link').forEach(b => b.onclick = () => telaLogin(b.dataset.m));
  $('#lbtn').onclick = async () => {
    const email = $('#lemail').value.trim(), senha = $('#lsenha')?.value || '';
    $('#lbtn').disabled = true;
    let r;
    if (modo==='entrar') r = await sb.auth.signInWithPassword({email, password:senha});
    else if (modo==='criar') r = await sb.auth.signUp({email, password:senha, options:{data:{nome:$('#lnome').value.trim()}, emailRedirectTo: location.href.split('#')[0]}});
    else r = await sb.auth.resetPasswordForEmail(email, {redirectTo: location.href.split('#')[0]});
    if (r.error) return telaLogin(modo, `<div class="msg erro">${esc(traduzErro(r.error.message))}</div>`);
    if (modo==='criar' && !r.data.session) return telaLogin('entrar', '<div class="msg ok">Conta criada. Abra o email de confirmação e depois entre aqui.</div>');
    if (modo==='esqueci') return telaLogin('entrar', '<div class="msg ok">Enviamos um link para o seu email.</div>');
  };
}
function traduzErro(m){
  if (/Invalid login/i.test(m)) return 'Email ou senha incorretos.';
  if (/Email not confirmed/i.test(m)) return 'Confirme o email antes de entrar (veja sua caixa de entrada).';
  if (/at least 6/i.test(m)) return 'A senha precisa ter pelo menos 6 caracteres.';
  if (/already registered/i.test(m)) return 'Esse email já tem conta. Use "Entrar".';
  return m;
}

// ---------- Início ----------
async function carregarUsuario(){
  const {data:{user}} = await sb.auth.getUser();
  E.usuario = user;
  if (!user) return telaLogin();
  const {data:perfil} = await sb.from('perfis').select('*').eq('id', user.id).single();
  E.perfil = perfil;
  const {data:faz} = await sb.from('fazendas').select('*').eq('ativo', true).order('nome');
  E.fazendas = faz || [];
  const salva = localStorage.getItem('fjk_fazenda');
  E.fazenda = E.fazendas.find(f => f.id === salva) || E.fazendas[0] || null;
  await carregarPapel();
  render();
}
async function carregarPapel(){
  E.papel = null;
  if (!E.fazenda) return;
  const {data} = await sb.from('fazenda_usuarios').select('papel').eq('fazenda_id', E.fazenda.id).eq('usuario_id', E.usuario.id).maybeSingle();
  E.papel = data?.papel || (E.perfil?.admin ? 'admin' : null);
}

function cabecalho(){
  return `<header>
    <div class="logo">FJK</div>
    <div><h1>FJK Agropecuária</h1><small>${esc(E.perfil?.nome || '')}</small></div>
    <div class="esp"></div>
    <select id="selFaz">${E.fazendas.map(f => `<option value="${f.id}" ${f.id===E.fazenda?.id?'selected':''}>${esc(f.nome)}</option>`).join('')}</select>
  </header>`;
}

function render(){
  if (!E.usuario) return telaLogin();
  const telas = {inicio:telaInicio, mapa:telaMapa, areas:()=>telaCadastro('areas'), modulos:telaModulos, retiros:()=>telaCadastro('retiros'),
    categorias:()=>telaCadastro('categorias'), produtos:()=>telaCadastro('produtos'), fazendas:()=>telaCadastro('fazendas'), usuarios:telaUsuarios,
    lancar:()=>{ telaInicio(); formOperacao({}); }, estoque:telaEstoque, historico:telaHistorico,
    animais:telaAnimais, pesagem:telaPesagemSeq, histind:telaHistIndividual,
    finpagar:()=>telaContasFin('Pagar'), finreceber:()=>telaContasFin('Receber'), finsaldos:telaSaldos, finextrato:telaExtrato, finfluxo:telaFluxo,
    fincontas:()=>telaCadastro('fincontas'), estinsumos:telaEstoqueIns, matrizes:telaMatrizes, histrep:telaHistRep, lancrep:()=>{ telaInicio(); formReprodutivo({}); }, estmov:telaMovEst, locais:()=>telaCadastro('locais'), fincentros:()=>telaCadastro('fincentros'), finplano:()=>telaCadastro('finplano')};
  $('#app').innerHTML = cabecalho() + '<main id="corpo"></main>';
  $('#selFaz').onchange = async e => { E.fazenda = E.fazendas.find(f => f.id === e.target.value); localStorage.setItem('fjk_fazenda', E.fazenda.id); await carregarPapel(); render(); };
  if (!E.fazenda && E.tela !== 'fazendas') { $('#corpo').innerHTML = '<div class="vazio">Você ainda não tem acesso a nenhuma fazenda. Peça para o administrador liberar o seu email.</div>'; return; }
  (telas[E.tela] || telaInicio)();
}
function ir(t){ E.tela = t; render(); window.scrollTo(0,0); }

async function telaInicio(){
  const fid = E.fazenda.id;
  const cont = async t => (await sb.from(t).select('*', {count:'exact', head:true}).eq('fazenda_id', fid)).count ?? 0;
  const {data:ha} = await sb.from('areas').select('hectares').eq('fazenda_id', fid);
  const totHa = (ha||[]).reduce((s,a) => s + Number(a.hectares||0), 0);
  const [na, nm, nc, np, nr] = await Promise.all(['areas','modulos','categorias_manejo','produtos','retiros'].map(cont));
  const {data:lts} = await sb.from('lotes').select('quantidade').eq('fazenda_id', fid);
  const totCab = (lts||[]).reduce((s,l) => s + l.quantidade, 0);
  const nAni = (await sb.from('animais').select('*', {count:'exact', head:true}).eq('fazenda_id', fid).eq('ativo', true)).count ?? 0;
  const venc = async t => (await sb.from('lancamentos_financeiros').select('*', {count:'exact', head:true}).eq('fazenda_id', finFaz()).eq('tipo', t).eq('status', 'Em aberto').lt('vencimento', hojeISO())).count ?? 0;
  const [venP, venR] = await Promise.all([venc('Pagar'), venc('Receber')]);
  const q = (id, ic, nome, sub) => `<div class="quad" data-t="${id}"><div class="ic">${ic}</div><b>${nome}</b><span>${sub}</span></div>`;
  $('#corpo').innerHTML = `
    <div class="secao">Manejo do rebanho</div>
    <div class="grade">${q('mapa','🗺️','Mapa de manejo', fmtNum(totCab,0)+' cab · '+fmtNum(totHa)+' ha')}
      ${q('lancar','➕','Lançar operação','Movimentação, morte, nascimento...')}
      ${q('estoque','🐄','Estoque do rebanho', fmtNum(totCab,0)+' cabeças')}
      ${q('historico','📋','Histórico de operações','Tudo que foi lançado')}</div>
    <div class="secao">Controle individual</div>
    <div class="grade">
      ${q('animais','🏷️','Animais', fmtNum(nAni,0)+' ativos')}
      ${q('pesagem','⚖️','Pesagem no curral','Brinco ou chip + peso')}
      ${q('histind','🗂️','Histórico individual','Pesagens, mortes, vendas...')}
    </div>
    <div class="secao">Reprodução</div>
    <div class="grade">
      ${q('matrizes','🐮','Matrizes','Situação, partos, crias')}
      ${q('lancrep','💉','Lançar reprodutivo','Inseminação, diagnóstico, parição')}
      ${q('histrep','📊','Histórico reprodutivo','Taxa de prenhez e partos')}
    </div>
    <div class="secao">Estoque de insumos</div>
    <div class="grade">
      ${q('estinsumos','🧪','Estoque atual','Saldo por produto e local')}
      ${q('estmov','🔁','Movimentações','Compras, consumo, transferências')}
      ${q('locais','🏚️','Locais de armazenamento','Depósitos, tanques, fábrica')}
    </div>
    <div class="secao">Financeiro</div>
    <div class="grade">
      ${q('finpagar','💸','Contas a pagar', venP ? `<span style="color:var(--vermelho)">${venP} vencidas</span>` : 'Em aberto e pagas')}
      ${q('finreceber','💰','Contas a receber', venR ? `<span style="color:var(--vermelho)">${venR} vencidas</span>` : 'Em aberto e recebidas')}
      ${q('finsaldos','🏦','Contas e saldos','Saldos, extrato e transferências')}
      ${q('finfluxo','📈','Fluxo de caixa','Entradas e saídas por mês')}
      ${q('finplano','🧾','Plano de contas','Contas de receita e despesa')}
      ${q('fincentros','🎯','Centros de custo','Pecuária, administrativo...')}
    </div>
    <div class="secao">Cadastros</div>
    <div class="grade">
      ${q('areas','▦','Áreas', na+' áreas')}
      ${q('modulos','◫','Módulos', nm+' módulos')}
      ${q('retiros','⌂','Retiros', nr+' retiros')}
      ${q('categorias','🐂','Categorias de manejo', nc+' categorias')}
      ${q('produtos','📦','Produtos', np+' produtos')}
    </div>
    <div class="secao">Gestão</div>
    <div class="grade">
      ${q('fazendas','🏠','Fazendas', E.fazendas.length+' fazendas')}
      ${ehAdmin() ? q('usuarios','👥','Usuários e acessos','Quem usa o sistema') : ''}
      <div class="quad" id="sair"><div class="ic">⎋</div><b>Sair</b><span>${esc(E.usuario.email)}</span></div>
    </div>`;
  document.querySelectorAll('.quad[data-t]').forEach(d => d.onclick = () => ir(d.dataset.t));
  $('#sair').onclick = async () => { await sb.auth.signOut(); E.usuario = null; telaLogin(); };
}

// ---------- Cadastros genéricos ----------
const CAD = {
  areas: {tabela:'areas', titulo:'Áreas', ordem:'codigo', porFazenda:true,
    colunas:[['codigo','Código'],['nome','Nome'],['hectares','Área (ha)','n'],['tipo_uso','Uso'],['cultura','Culturas']],
    campos:[['codigo','Código',{obr:1}],['nome','Nome',{obr:1}],['hectares','Área (ha)',{tipo:'number'}],

    colunas:[['codigo','Código'],['nome','Nome'],['categoria_oficial','Categoria oficial'],['sexo','Sexo'],['especie','Espécie']],
    campos:[['codigo','Código',{obr:1}],['nome','Nome',{obr:1}],
      ['categoria_oficial','Categoria oficial',{obr:1,op:['Fêmeas de 0-12M','Fêmeas de 13-24M','Fêmeas de 25-36M','Fêmeas acima 36M','Machos de 0-12M','Machos de 13-24M','Machos de 25-36M','Machos acima 36M']}],
      ['sexo','Sexo',{op:['','M','F']}],['especie','Espécie',{op:['Bovinos','Bubalinos','Equinos','Ovinos','Caprinos']}]],
    busca:['codigo','nome'], filtro:['categoria_oficial','Categoria oficial']},
  produtos: {tabela:'produtos', titulo:'Produtos', ordem:'nome', porFazenda:true,
    colunas:[['nome','Nome'],['unidade','Unidade'],['tipo_uso','Tipo de uso'],['ativo','Situação','b']],
    campos:[['nome','Nome',{obr:1}],['codigo','Código'],['unidade','Unidade de medida',{op:['kg','L','un','t','g','mL','dose','sc']}],
      ['tipo_uso','Tipo de uso',{op:['Suplementos e Rações','Medicamentos e Vacinas','Combustíveis e Lubrificantes','Adubos e Fertilizantes','Defensivos','Sementes','Peças e Manutenção','Insumo','Outros']}],
      ['ativo','Ativo',{tipo:'bool'}]],
    busca:['nome','codigo'], filtro:['tipo_uso','Tipo de uso']},
  fazendas: {tabela:'fazendas', titulo:'Fazendas', ordem:'nome', porFazenda:false,
    colunas:[['nome','Nome'],['municipio','Município'],['estado','UF'],['proprietario','Proprietário']],
    campos:[['nome','Nome',{obr:1}],['municipio','Município'],['estado','UF'],['proprietario','Proprietário']], busca:['nome','municipio']},
  locais: {tabela:'locais_estoque', titulo:'Locais de armazenamento', ordem:'nome', porFazenda:true,
    colunas:[['nome','Nome'],['ativo','Situação','b']], campos:[['nome','Nome',{obr:1}],['ativo','Ativo',{tipo:'bool'}]], busca:['nome']},
  fincontas: {tabela:'contas_bancarias', titulo:'Contas bancárias e caixas', ordem:'nome', porFazenda:true, fin:true,
    colunas:[['nome','Nome'],['tipo','Tipo'],['banco','Banco'],['saldo_inicial','Saldo inicial','n'],['data_saldo_inicial','Data do saldo inicial','d'],['ativo','Situação','b']],
    campos:[['nome','Nome',{obr:1}],['tipo','Tipo',{op:['Corrente','Poupança','Caixa','Cartão de crédito','Investimento']}],['banco','Banco'],['agencia','Agência'],['numero','Número da conta'],
      ['saldo_inicial','Saldo inicial (R$)',{tipo:'number'}],['data_saldo_inicial','Data do saldo inicial',{tipo:'date'}],['ativo','Ativa',{tipo:'bool'}]],
    busca:['nome','banco'], filtro:['tipo','Tipo']},
  fincentros: {tabela:'centros_custo', titulo:'Centros de custo', ordem:'nome', porFazenda:true, fin:true,
    colunas:[['nome','Nome'],['ativo','Situação','b']], campos:[['nome','Nome',{obr:1}],['ativo','Ativo',{tipo:'bool'}]], busca:['nome']},
  finplano: {tabela:'plano_contas', titulo:'Plano de contas', ordem:'codigo', porFazenda:true, fin:true,
    colunas:[['codigo','Código'],['nome','Nome'],['grupo','Grupo'],['natureza','Natureza'],['ativo','Situação','b']],
    campos:[['codigo','Código',{obr:1}],['nome','Nome',{obr:1}],['grupo','Grupo (ex.: 200 - Salários e encargos)'],['natureza','Natureza',{op:['Despesa','Receita']}],['ativo','Ativo',{tipo:'bool'}]],
    busca:['codigo','nome','grupo'], filtro:['grupo','Grupo']}
};
const fazCad = C => C.fin ? finFaz() : E.fazenda.id;
const refCache = {};
async function carregarRef(t){
  const {data} = await sb.from(t).select('id,nome').eq('fazenda_id', E.fazenda.id).order('nome');
  refCache[t] = data || []; return refCache[t];
}

async function telaCadastro(chave){
  const C = CAD[chave];
  let q = sb.from(C.tabela).select('*').order(C.ordem);
  if (C.porFazenda) q = q.eq('fazenda_id', fazCad(C));
  const {data, error} = await q;
  if (error) { $('#corpo').innerHTML = `<div class="msg erro">${esc(error.message)}</div>`; return; }
  const linhas = data || [];
  for (const [, , o={}] of C.campos) if (o.ref) await carregarRef(o.ref);
  const podeNovo = chave === 'fazendas' ? E.perfil?.admin : podeEditar();
  const opsFiltro = C.filtro ? [...new Set(linhas.map(l => l[C.filtro[0]]).filter(Boolean))].sort() : [];
  $('#corpo').innerHTML = `
    <div class="topo"><button class="voltar" id="volta">←</button><h2>${C.titulo}</h2>
      ${podeNovo ? '<button class="btn" id="novo">+ Novo</button>' : ''}
      <button class="btn sec" id="csv">Exportar planilha</button></div>
    <div class="filtros"><input id="busca" placeholder="Pesquisar">
      ${C.filtro ? `<select id="filtro"><option value="">${C.filtro[1]}: todos</option>${opsFiltro.map(o => `<option>${esc(o)}</option>`).join('')}</select>` : ''}</div>
    <div class="tabela"><table><thead><tr>${C.colunas.map(c => `<th class="${c[2]==='n'?'num':''}">${c[1]}</th>`).join('')}</tr></thead><tbody id="tb"></tbody></table></div>
    <div class="rodape" id="rod"></div>`;
  $('#volta').onclick = () => ir('inicio');
  if (podeNovo) $('#novo').onclick = () => formCadastro(chave, null);
  const filtrar = () => {
    const b = $('#busca').value.toLowerCase(), f = $('#filtro')?.value || '';
    return linhas.filter(l => (!b || C.busca.some(k => String(l[k]||'').toLowerCase().includes(b))) && (!f || l[C.filtro[0]] === f));
  };
  const celula = (l, c) => c[2]==='n' ? fmtNum(l[c[0]]) : c[2]==='d' ? fD(l[c[0]]) : c[2]==='b' ? (l[c[0]] ? 'Ativo' : 'Inativo') : esc(l[c[0]]);
  const desenhar = () => {
    const ls = filtrar();
    $('#tb').innerHTML = ls.length ? ls.map(l => `<tr class="clic" data-id="${l.id}">${C.colunas.map(c => `<td class="${c[2]==='n'?'num':''}">${celula(l,c)}</td>`).join('')}</tr>`).join('')
      : `<tr><td colspan="${C.colunas.length}" class="vazio">Nada encontrado</td></tr>`;
    let rod = `${ls.length} de ${linhas.length} registros`;
    if (chave==='areas') rod += ` · ${fmtNum(ls.reduce((s,a)=>s+Number(a.hectares||0),0))} ha`;
    $('#rod').textContent = rod;
    document.querySelectorAll('#tb tr.clic').forEach(tr => tr.onclick = () => formCadastro(chave, linhas.find(l => l.id === tr.dataset.id)));
  };
  $('#busca').oninput = desenhar; if ($('#filtro')) $('#filtro').onchange = desenhar;
  $('#csv').onclick = () => baixarCSV(C.titulo, C.colunas.map(c => c[1]), filtrar().map(l => C.colunas.map(c => c[2]==='n' ? fmtNum(l[c[0]]) : c[2]==='b' ? (l[c[0]]?'Ativo':'Inativo') : (l[c[0]] ?? ''))));
  desenhar();
}

function campoHTML([k, rot, o={}], v){
  const val = v ?? '';
  if (o.tipo === 'bool') return `<label class="chk"><input type="checkbox" id="f_${k}" ${v!==false?'checked':''}> ${rot}</label>`;
  if (o.ref) return `<label>${rot}</label><select id="f_${k}"><option value="">—</option>${(refCache[o.ref]||[]).map(r => `<option value="${r.id}" ${r.id===v?'selected':''}>${esc(r.nome)}</option>`).join('')}</select>`;
  if (o.op) { const ops = o.op.includes(val) || val==='' ? o.op : [...o.op, val];
    return `<label>${rot}${o.obr?' *':''}</label><select id="f_${k}">${ops.map(x => `<option ${x===val?'selected':''}>${esc(x)}</option>`).join('')}</select>`; }
  return `<label>${rot}${o.obr?' *':''}</label><input id="f_${k}" type="${o.tipo||'text'}" ${o.tipo==='number'?'step="0.01" inputmode="decimal"':''} value="${esc(val)}">`;
}

function formCadastro(chave, reg){
  const C = CAD[chave];
  const pode = chave === 'fazendas' ? ehAdmin() : podeEditar();
  const m = document.createElement('div'); m.className = 'modal';
  m.innerHTML = `<div class="caixa"><h3>${reg ? 'Editar' : 'Novo'} – ${C.titulo}</h3>
    ${C.campos.map(c => campoHTML(c, reg?.[c[0]])).join('')}
    ${reg?.criado_em ? `<div class="rodape">Cadastrado em ${fmtData(reg.criado_em)}${reg.id_origem ? ' · importado do sistema anterior' : ''}</div>` : ''}
    <div class="msg erro" id="ferro" style="display:none"></div>
    <div class="acoes"><button class="btn sec" id="fcan">Cancelar</button>${pode ? '<button class="btn" id="fsal">Salvar</button>' : ''}</div>
    ${reg && ehAdmin() && chave !== 'fazendas' ? '<div class="acoes"><button class="btn perigo" id="fexc">Excluir</button></div>' : ''}</div>`;
  document.body.appendChild(m);
  if (!pode) m.querySelectorAll('input,select').forEach(i => i.disabled = true);
  m.querySelector('#fcan').onclick = () => m.remove();
  m.onclick = e => { if (e.target === m) m.remove(); };
  const erro = t => { const d = m.querySelector('#ferro'); d.textContent = t; d.style.display = 'block'; };
  if (pode) m.querySelector('#fsal').onclick = async () => {
    const obj = {};
    for (const [k, rot, o={}] of C.campos) {
      const el = m.querySelector('#f_'+k);
      let v = o.tipo === 'bool' ? el.checked : el.value.trim();
      if (o.tipo === 'number') v = v === '' ? 0 : Number(v.replace(',', '.'));
      if (o.ref || o.tipo === 'date' || (o.op && v === '')) v = v || null;
      if (o.obr && !v) return erro(`Preencha: ${rot}`);
      obj[k] = v;
    }
    if (C.porFazenda) obj.fazenda_id = fazCad(C);
    if (C.fin) FIN = null;
    const r = reg ? await sb.from(C.tabela).update(obj).eq('id', reg.id) : await sb.from(C.tabela).insert(obj);
    if (r.error) return erro(/duplicate/.test(r.error.message) ? 'Já existe um cadastro com esse código/nome.' : r.error.message);
    m.remove(); aviso('Salvo');
    if (chave === 'fazendas') { const {data} = await sb.from('fazendas').select('*').eq('ativo',true).order('nome'); E.fazendas = data||[]; if(!E.fazenda) E.fazenda = E.fazendas[0]; await carregarPapel(); }
    render();
  };
  const exc = m.querySelector('#fexc');
  if (exc) exc.onclick = async () => {
    if (!confirm('Excluir este cadastro? Não dá para desfazer.')) return;
    const r = await sb.from(C.tabela).delete().eq('id', reg.id);
    if (r.error) return erro(/foreign key/.test(r.error.message) ? 'Não dá para excluir: este cadastro está sendo usado.' : r.error.message);
    m.remove(); aviso('Excluído'); render();
  };
}

function baixarCSV(nome, cab, linhas){
  const cel = v => { const s = String(v ?? ''); return /[;"\n]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s; };
  const txt = '\ufeff' + [cab, ...linhas].map(l => l.map(cel).join(';')).join('\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([txt], {type:'text/csv;charset=utf-8'}));
  a.download = `${nome} - ${E.fazenda?.nome || ''} - ${fmtData(new Date()).replace(/\//g,'-')}.csv`;
  a.click();
}

        <td style="white-space:normal">${as.map(a => esc(a.codigo)).join(', ')}</td><td class="num">${fmtNum(as.reduce((s,a)=>s+Number(a.hectares||0),0))}</td></tr>`; }).join('')
      || '<tr><td colspan="3" class="vazio">Nenhum módulo</td></tr>';

  function formModulo(mod){
    const sel = new Set(mod ? areasDe(mod.id).map(a => a.id) : []);

    m.innerHTML = `<div class="caixa"><h3>${mod ? 'Editar' : 'Novo'} módulo</h3>
      <label>Nome *</label><input id="mnome" value="${esc(mod?.nome||'')}">
      <label>Cor</label><input id="mcor" type="color" value="${esc(mod?.cor||'#4c8a2b')}" style="height:44px">
      <label>Áreas do módulo</label><input id="mbusca" placeholder="Filtrar áreas" style="margin-bottom:6px">
      <div class="lista-areas">${(areas||[]).map(a => `<label class="chk" data-c="${esc(a.codigo.toLowerCase())}"><input type="checkbox" value="${a.id}" ${sel.has(a.id)?'checked':''}> ${esc(a.codigo)} <span class="pill">${fmtNum(a.hectares)} ha</span></label>`).join('')}</div>
      <div class="msg erro" id="merro" style="display:none"></div>
      <div class="acoes"><button class="btn sec" id="mcan">Cancelar</button>${podeEditar() ? '<button class="btn" id="msal">Salvar</button>' : ''}</div>
      ${mod && ehAdmin() ? '<div class="acoes"><button class="btn perigo" id="mexc">Excluir</button></div>' : ''}</div>`;
    document.body.appendChild(m);

    m.querySelector('#mcan').onclick = () => m.remove();
    const salvar = m.querySelector('#msal');

      if (r.error) { const d = m.querySelector('#merro'); d.textContent = r.error.message; d.style.display='block'; return; }

// ---------- Mapa ----------
async function telaMapa(){
  const fid = E.fazenda.id;
  $('#corpo').innerHTML = `<div class="topo"><button class="voltar" id="volta">←</button><h2>Mapa – ${esc(E.fazenda.nome)}</h2></div>
    <div class="filtros"><input id="mbusca" placeholder="Procurar área pelo código"></div><div id="mapa"></div>`;
  $('#volta').onclick = () => ir('inicio');
  const [{data:areas}, {data:mods}, {data:ma}, lotes] = await Promise.all([
    sb.from('areas').select('*').eq('fazenda_id', fid),
    sb.from('modulos').select('id,nome').eq('fazenda_id', fid),
    sb.from('modulo_areas').select('modulo_id,area_id'),
    carregarLotes()]);
  const modDe = {}; (ma||[]).forEach(x => { const mm = (mods||[]).find(m => m.id === x.modulo_id); if (mm) modDe[x.area_id] = mm.nome; });
  const porArea = {}; lotes.forEach(l => (porArea[l.area_id] = porArea[l.area_id] || []).push(l));
  const totCab = lotes.reduce((s,l) => s + l.quantidade, 0);
  $('#mbusca').insertAdjacentHTML('afterend', `<div class="rodape" style="flex-basis:100%">Total: <b>${fmtNum(totCab,0)} cabeças</b> · ${fmtNum((areas||[]).reduce((s,a)=>s+Number(a.hectares||0),0))} ha · toque numa área para ver os lotes e lançar</div>`);
  const mapa = L.map('mapa', {zoomControl:true});
  L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {maxZoom:19, attribution:'Esri'}).addTo(mapa);
  const grupo = L.featureGroup().addTo(mapa); const camadas = {};
  (areas||[]).filter(a => Array.isArray(a.geometria) && a.geometria.length > 2).forEach(a => {
    const ls = porArea[a.id] || []; const cab = ls.reduce((s,l) => s + l.quantidade, 0);
    const p = L.polygon(a.geometria, {color:'#fff', weight:1.5, fillColor:a.cor || '#a7c232', fillOpacity: cab ? .65 : .3}).addTo(grupo);
    p.bindTooltip(cab && !podeEditar() ? `${esc(a.codigo)}<br>${cab}` : esc(a.codigo), {permanent:true, direction:cab && podeEditar() ? 'bottom' : 'center', offset:cab && podeEditar() ? [0,8] : [0,0], className:'rotulo'});
    p.on('click', () => fichaArea(a, ls, modDe[a.id]));
    camadas[a.codigo.toLowerCase()] = {p, a, ls};
  });
  if (grupo.getLayers().length) mapa.fitBounds(grupo.getBounds(), {padding:[10,10]}); else mapa.setView([-5.5,-48.5], 12);
  $('#mbusca').onchange = e => { const c = camadas[e.target.value.trim().toLowerCase()]; if (c) { mapa.fitBounds(c.p.getBounds()); fichaArea(c.a, c.ls, modDe[c.a.id]); } else aviso('Área não encontrada'); };
  // bolinha arrastavel: arraste o lote ate outro pasto para movimentar
  if (podeEditar()) {
    const dentro = (pt, poly) => { let x = pt.lng, y = pt.lat, ok = false;
      for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) { const xi = poly[i][1], yi = poly[i][0], xj = poly[j][1], yj = poly[j][0];
        if (((yi > y) !== (yj > y)) && (x < (xj - xi) * (y - yi) / (yj - yi) + xi)) ok = !ok; } return ok; };
    const icone = cab => L.divIcon({className:'', iconSize:[30,30], iconAnchor:[15,15],
      html:`<div style="width:30px;height:30px;border-radius:50%;background:#ffd23f;border:2px solid #2f5d1e;color:#1f2a1a;font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 4px rgba(0,0,0,.5);cursor:grab">${cab}</div>`});
    Object.values(camadas).forEach(({p, a, ls}) => {
      const cab = ls.reduce((s,l) => s + l.quantidade, 0); if (!cab) return;
      const centro = p.getBounds().getCenter();
      const mk = L.marker(centro, {draggable:true, icon:icone(cab), zIndexOffset:1000}).addTo(mapa);
      mk.bindTooltip('Arraste para outro pasto', {direction:'top', offset:[0,-14]});
      mk.on('dragend', () => {
        const pt = mk.getLatLng(); mk.setLatLng(centro);
        const alvo = Object.values(camadas).find(c => c.a.id !== a.id && dentro(pt, c.a.geometria));
        if (!alvo) { aviso('Solte a bolinha dentro de outro pasto'); return; }
        formOperacao({operacao:'Movimentação', area_id:a.id, area_destino_id:alvo.a.id});
      });
    });
    $('#mbusca').insertAdjacentHTML('afterend', '<div class="rodape" style="flex-basis:100%">🟡 Arraste a bolinha amarela de um pasto para outro para movimentar o lote.</div>');
  }
}

const OPS = {

const CAUSAS = ['Fraqueza','Doença','Picada de cobra','Acidente','Raio','Parto','Timpanismo','Intoxicação','Desconhecida','Outra'];
async function carregarLotes(){
  const {data} = await sb.from('lotes').select('*, areas(codigo,nome), categorias_manejo(codigo,nome,sexo,categoria_oficial)').eq('fazenda_id', E.fazenda.id);
  return (data||[]).map(l => ({...l, area_codigo:l.areas?.codigo, cat_nome:l.categorias_manejo?.nome, sexo:l.categorias_manejo?.sexo, cat_oficial:l.categorias_manejo?.categoria_oficial}));
}
const diasDesde = d => d ? Math.floor((Date.now() - new Date(d+'T12:00:00')) / 864e5) : null;
const hojeISO = () => { const d = new Date(Date.now() - 3*3600e3); return d.toISOString().slice(0,10); };

function fichaArea(a, ls, modulo){
  const cab = ls.reduce((s,l) => s + l.quantidade, 0);
  const kg = ls.reduce((s,l) => s + l.quantidade*Number(l.peso_medio||0), 0);
  const ua = kg / 450;
  const m = document.createElement('div'); m.className = 'modal';
  m.innerHTML = `<div class="caixa"><h3>${esc(a.codigo)}${a.nome!==a.codigo?' – '+esc(a.nome):''}</h3>
    <div class="rodape" style="margin-top:0">${fmtNum(a.hectares)} ha · ${esc(a.tipo_uso)}${a.cultura?' · '+esc(a.cultura):''}${modulo?' · Módulo '+esc(modulo):''}</div>
    <div class="grade" style="grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0">
      <div class="quad" style="min-height:70px;padding:8px;cursor:default"><b>${fmtNum(cab,0)}</b><span>cabeças</span></div>
      <div class="quad" style="min-height:70px;padding:8px;cursor:default"><b>${cab?fmtNum(kg/cab,0):'–'}</b><span>kg médio</span></div>
      <div class="quad" style="min-height:70px;padding:8px;cursor:default"><b>${a.hectares>0?fmtNum(ua/a.hectares,1):'–'}</b><span>UA/ha</span></div></div>
    <div class="tabela"><table><thead><tr><th>Categoria</th><th class="num">Cab</th><th class="num">Peso (kg)</th><th>Entrada</th></tr></thead><tbody>
    ${ls.map(l => `<tr><td>${esc(l.cat_nome)}</td><td class="num">${l.quantidade}</td><td class="num">${fmtNum(l.peso_medio,0)}${l.tipo_peso==='Projetado'?'*':''}</td><td>${fmtData(l.data_entrada)}${l.data_entrada?' ('+diasDesde(l.data_entrada)+'d)':''}</td></tr>`).join('') || '<tr><td colspan="4" class="vazio">Área vazia</td></tr>'}
    </tbody></table></div>
    ${ls.some(l=>l.tipo_peso==='Projetado')?'<div class="rodape">* peso projetado</div>':''}
    ${podeEditar() ? `<div class="secao">Lançar nesta área</div><div class="grade" style="grid-template-columns:repeat(3,1fr);gap:8px">
      ${['Movimentação','Morte','Nascimento','Mudança de categoria','Pesagem','Abate para consumo'].map(o => `<button class="btn sec peq" data-op="${o}" style="min-height:54px">${o}</button>`).join('')}</div>` : ''}
    <div class="acoes"><button class="btn sec" id="fch">Fechar</button></div></div>`;
  document.body.appendChild(m);
  m.querySelector('#fch').onclick = () => m.remove();
  m.onclick = e => { if (e.target === m) m.remove(); };

    g('l_peso').textContent = cfg.peso ? 'Peso médio (kg) *' : 'Peso médio (kg)';
    g('l_area').textContent = cfg.destino === 'area' ? 'Área de origem *' : 'Área *';

  const preencher = () => { const l = lotes.find(x => x.area_id === g('o_area').value && x.categoria_id === g('o_cat').value);
    if (l && OPS[g('o_op').value].t !== 'Entrada') { if (!g('o_q').value) g('o_q').placeholder = 'até ' + l.quantidade; if (!g('o_peso').value && l.peso_medio) g('o_peso').placeholder = fmtNum(l.peso_medio,0) + ' (atual)'; } };
  g('o_op').onchange = () => { atualizar(); preencher(); }; g('o_area').onchange = () => { atualizar(); preencher(); }; g('o_cat').onchange = preencher;
  atualizar(); preencher();

      causa_morte: cfg.causa ? g('o_causa').value : '', observacao: g('o_obs').value.trim()};

const idade = n => { if (!n) return ''; const d = new Date(n+'T12:00:00'), h = new Date(); let m = (h.getFullYear()-d.getFullYear())*12 + h.getMonth()-d.getMonth(); if (h.getDate() < d.getDate()) m--; if (m < 0) m = 0; return (m >= 12 ? Math.floor(m/12)+'a' : '') + (m%12) + 'm'; };
const OPS_IND = {'Pesagem':{peso:1,obr:1}, 'Localização':{area:1}, 'Vacinação e sanidade':{proc:1}, 'Identificação eletrônica':{chip:1},
  'Troca de brinco':{brinco:1}, 'Morte':{causa:1, saida:1}, 'Venda':{peso:1, saida:1}, 'Abate para consumo':{peso:1, saida:1},
  'Transferência - Saída':{saida:1}, 'Exclusão':{saida:1}};

async function baseFazenda(){

    sb.from('procedimentos').select('id,nome').eq('fazenda_id', fid).order('nome')]);
  cacheBase = {fid, areas:areas||[], cats:cats||[], procs:procs||[], areaPor:Object.fromEntries((areas||[]).map(a => [a.id, a.codigo])), catPor:Object.fromEntries((cats||[]).map(c => [c.id, c.nome]))};
  return cacheBase;
}

// ---------- Financeiro ----------
const finFaz = () => (E.fazendas.find(f => f.sede_financeiro) || E.fazenda).id;
const fD = v => v ? fmtData(v + 'T12:00:00') : '';
const moeda = v => (Number(v)||0).toLocaleString('pt-BR', {style:'currency', currency:'BRL'});
const OPS_FIN = {Pagar:['Pagamentos','Compra de produtos','Compra de animais','Transportes e fretes','Comissões'], Receber:['Recebimentos','Venda de animais','Venda de produtos']};
const FORMAS = ['PIX','Boleto','Transferência','Dinheiro','Cartão de crédito','Débito em conta','Cheque','Outros'];
let FIN = null;
async function todas(mk){ let out = [], i = 0; while (true) { const {data, error} = await mk().range(i, i+999); if (error) throw error; out = out.concat(data||[]); if (!data || data.length < 1000) break; i += 1000; } return out; }
async function carregarFin(forcar){
  if (FIN && !forcar && FIN.faz === finFaz()) return FIN;
  const fz = finFaz();
  const [contas, centros, planos, lancs, transf] = await Promise.all([
    todas(() => sb.from('contas_bancarias').select('*').eq('fazenda_id', fz).order('nome')),
    todas(() => sb.from('centros_custo').select('*').eq('fazenda_id', fz).order('nome')),
    todas(() => sb.from('plano_contas').select('*').eq('fazenda_id', fz).order('codigo')),
    todas(() => sb.from('lancamentos_financeiros').select('*').eq('fazenda_id', fz).order('vencimento').order('id')),
    todas(() => sb.from('transferencias_bancarias').select('*').eq('fazenda_id', fz).order('data'))]);
  FIN = {faz:fz, contas, centros, planos, lancs, transf};
  return FIN;
}
const nomeConta = id => FIN?.contas.find(c => c.id === id)?.nome || '';
const statusLanc = l => l.status === 'Efetivada' ? (l.tipo === 'Pagar' ? 'Pago' : 'Recebido') : l.status === 'Cancelada' ? 'Cancelada' : (l.vencimento < hojeISO() ? 'Vencida' : 'Em aberto');
const corStatus = s => ({Pago:'#e7f3df', Recebido:'#e7f3df', Vencida:'#fde8e6', Cancelada:'#eee'}[s] || '#fff4d6');
const grupoDoPlano = txt => { const cod = String(txt||'').split(' - ')[0].trim(); const p = FIN.planos.find(x => x.codigo === cod); return p ? p : null; };
// movimentos que entram no saldo de uma conta
function movimentosConta(c, ate){
  const lim = ate || hojeISO(), ini = c.data_saldo_inicial || '0000';
  const cartao = c.tipo === 'Cartão de crédito';
  const mv = [];
  FIN.lancs.forEach(l => {
    if (l.conta_id !== c.id || !l.data_pagamento || l.data_pagamento > lim || l.status === 'Cancelada') return;
    if (!cartao && (l.status !== 'Efetivada' || l.data_pagamento < ini)) return;
    const v = Number(l.valor_pago ?? l.valor) || 0;
    mv.push({data:l.data_pagamento, desc:l.pessoa, det:[l.plano_conta, l.observacao].filter(Boolean).join(' · '), op:l.operacao, valor:l.tipo === 'Receber' ? v : -v, lanc:l});
  });
  FIN.transf.forEach(t => {
    if (t.data > lim || t.data < ini) return;
    if (t.conta_origem_id === c.id) mv.push({data:t.data, desc:'Transferência para '+nomeConta(t.conta_destino_id), det:t.observacao||'', op:'Transferência', valor:-Number(t.valor), transf:t});
    if (t.conta_destino_id === c.id) mv.push({data:t.data, desc:'Transferência de '+nomeConta(t.conta_origem_id), det:t.observacao||'', op:'Transferência', valor:Number(t.valor), transf:t});
  });
  return mv.sort((a,b) => a.data < b.data ? -1 : a.data > b.data ? 1 : 0);
}
const saldoConta = (c, ate) => Number(c.saldo_inicial||0) + movimentosConta(c, ate).reduce((s,m) => s + m.valor, 0);

    const st = $('#fst').value, dt = $('#fdt').value, de = $('#fde').value, ate = $('#fate').value, b = $('#fbus').value.toLowerCase(), cc = $('#fcc').value, ct = $('#fconta').value;

      if (st === 'Vencida' && s !== 'Vencida') return false;

      return true;
    });
  };
  let ls = [];
  const desenhar = () => {
    ls = filtrar();
    const tot = ls.reduce((s,l) => s + Number(l.valor||0), 0), pago = ls.filter(l => l.status==='Efetivada').reduce((s,l) => s + Number(l.valor_pago ?? l.valor ?? 0), 0);

    $('#rod').textContent = `${fmtNum(ls.length,0)} lançamentos` + (ls.length > mostra.length ? ` (mostrando os primeiros ${mostra.length}; use os filtros ou exporte a planilha)` : '');

  desenhar();
}

function formLancFin(reg){
  const novo = !reg.id, tipo = reg.tipo, rec = tipo === 'Receber', pode = podeEditar();
  const nat = rec ? 'Receita' : 'Despesa';
  const planos = FIN.planos.filter(p => p.natureza === nat || reg.plano_conta === p.codigo+' - '+p.nome);
  const optPl = [...planos.map(p => p.codigo+' - '+p.nome)]; if (reg.plano_conta && !optPl.includes(reg.plano_conta)) optPl.unshift(reg.plano_conta);
  const optCc = FIN.centros.map(c => c.nome); if (reg.centro_custo && !optCc.includes(reg.centro_custo)) optCc.unshift(reg.centro_custo);
  const ops = OPS_FIN[tipo].includes(reg.operacao) || !reg.operacao ? OPS_FIN[tipo] : [reg.operacao, ...OPS_FIN[tipo]];
  const pessoas = [...new Set(FIN.lancs.map(l => l.pessoa).filter(Boolean))].sort();
  const socios = [...new Set(FIN.lancs.map(l => l.socio).filter(Boolean))].sort();
  const sel = (id, arr, v, vazio) => `<select id="${id}">${vazio!==undefined?`<option value="">${vazio}</option>`:''}${arr.map(x => `<option ${x===v?'selected':''}>${esc(x)}</option>`).join('')}</select>`;
  const efet = reg.status === 'Efetivada';
  const m = document.createElement('div'); m.className = 'modal';
  m.innerHTML = `<div class="caixa"><h3>${novo ? 'Nova conta a ' + (rec?'receber':'pagar') : (rec ? 'Conta a receber' : 'Conta a pagar')}</h3>
    <label>Operação</label>${sel('l_op', ops, reg.operacao)}
    <label>${rec?'Cliente':'Fornecedor'} *</label><input id="l_pes" list="l_pesl" value="${esc(reg.pessoa)}"><datalist id="l_pesl">${pessoas.map(p => `<option value="${esc(p)}">`).join('')}</datalist>
    <div style="display:flex;gap:8px"><div style="flex:1"><label>Documento</label><input id="l_doc" value="${esc(reg.documento)}"></div>
      <div style="flex:1"><label>Tipo de documento</label>${sel('l_tdoc', ['Nota fiscal','Recibo','Boleto','Contrato','Outros'].concat(reg.tipo_documento && !['Nota fiscal','Recibo','Boleto','Contrato','Outros'].includes(reg.tipo_documento) ? [reg.tipo_documento] : []), reg.tipo_documento, '—')}</div></div>
    <div style="display:flex;gap:8px"><div style="flex:1"><label>Emissão</label><input id="l_emi" type="date" value="${reg.data_emissao || (novo ? hojeISO() : '')}"></div>
      <div style="flex:1"><label>${novo ? '1º vencimento' : 'Vencimento'} *</label><input id="l_ven" type="date" value="${reg.vencimento || hojeISO()}"></div></div>
    <div style="display:flex;gap:8px"><div style="flex:1"><label>Valor${novo ? ' de cada parcela' : ''} (R$) *</label><input id="l_val" inputmode="decimal" value="${reg.valor != null ? String(reg.valor).replace('.',',') : ''}"></div>
      ${novo ? '<div style="flex:1"><label>Parcelas</label><input id="l_npar" type="number" min="1" max="120" value="1"></div>' : `<div style="flex:1"><label>Parcela</label><input id="l_par" value="${esc(reg.parcela)}"></div>`}</div>
    <label>Plano de contas *</label>${sel('l_pl', optPl, reg.plano_conta, '—')}
    <label>Centro de custo *</label>${sel('l_cc', optCc, reg.centro_custo, '—')}
    <div style="display:flex;gap:8px"><div style="flex:1"><label>Conta</label><select id="l_conta"><option value="">—</option>${FIN.contas.filter(c => c.ativo || c.id === reg.conta_id).map(c => `<option value="${c.id}" ${c.id===reg.conta_id?'selected':''}>${esc(c.nome)}</option>`).join('')}</select></div>
      <div style="flex:1"><label>Forma de pagamento</label>${sel('l_forma', FORMAS.concat(reg.forma_pagamento && !FORMAS.includes(reg.forma_pagamento) ? [reg.forma_pagamento] : []), reg.forma_pagamento, '—')}</div></div>
    <label>Sócio / produtor</label><input id="l_soc" list="l_socl" value="${esc(reg.socio)}"><datalist id="l_socl">${socios.map(p => `<option value="${esc(p)}">`).join('')}</datalist>
    <label>Observação</label><input id="l_obs" value="${esc(reg.observacao)}">
    <label class="chk" style="margin-top:12px"><input type="checkbox" id="l_efet" ${efet?'checked':''}> <b>Já foi ${rec?'recebido':'pago'}</b></label>
    <div id="l_baixa" style="display:${efet?'flex':'none'};gap:8px"><div style="flex:1"><label>Data ${rec?'do recebimento':'do pagamento'}</label><input id="l_dpag" type="date" value="${reg.data_pagamento || hojeISO()}"></div>
      <div style="flex:1"><label>Valor ${rec?'recebido':'pago'} (R$)</label><input id="l_vpag" inputmode="decimal" value="${reg.valor_pago != null ? String(reg.valor_pago).replace('.',',') : ''}" placeholder="igual ao valor"></div></div>
    ${reg.criado_em ? `<div class="rodape">Lançado em ${fmtData(reg.criado_em)}${reg.id_origem !== undefined && !reg.criado_por ? ' · importado do sistema anterior' : ''}</div>` : ''}
    <div class="msg erro" id="lerro" style="display:none"></div>
    <div class="acoes"><button class="btn sec" id="lcan">Cancelar</button>${pode ? '<button class="btn" id="lsal">Salvar</button>' : ''}</div>
    ${!novo && ehAdmin() ? '<div class="acoes"><button class="btn perigo" id="lexc">Excluir</button></div>' : ''}</div>`;
  document.body.appendChild(m);
  const q = s => m.querySelector(s);
  if (!pode) m.querySelectorAll('input,select').forEach(i => i.disabled = true);
  q('#l_efet').onchange = () => { q('#l_baixa').style.display = q('#l_efet').checked ? 'flex' : 'none'; };
  q('#lcan').onclick = () => m.remove(); m.onclick = e => { if (e.target === m) m.remove(); };
  const erro = t => { const d = q('#lerro'); d.textContent = t; d.style.display = 'block'; };
  const num = v => { v = String(v||'').trim().replace(/\./g,'').replace(',', '.'); return v === '' ? null : Number(v); };
  if (pode) q('#lsal').onclick = async () => {
    const valor = num(q('#l_val').value);
    const o = {tipo, operacao:q('#l_op').value, pessoa:q('#l_pes').value.trim(), documento:q('#l_doc').value.trim()||null, tipo_documento:q('#l_tdoc').value||null,
      data_emissao:q('#l_emi').value||null, vencimento:q('#l_ven').value, valor, plano_conta:q('#l_pl').value||null, centro_custo:q('#l_cc').value||null,
      conta_id:q('#l_conta').value||null, forma_pagamento:q('#l_forma').value||null, socio:q('#l_soc').value.trim()||null, observacao:q('#l_obs').value.trim()||null};
    if (!o.pessoa) return erro(`Preencha: ${rec?'cliente':'fornecedor'}`);
    if (!o.vencimento) return erro('Preencha o vencimento');
    if (!(valor > 0)) return erro('Informe um valor maior que zero');
    if (!o.plano_conta) return erro('Escolha o plano de contas');
    if (!o.centro_custo) return erro('Escolha o centro de custo');
    if (q('#l_efet').checked) {
      o.status = 'Efetivada'; o.data_pagamento = q('#l_dpag').value; o.valor_pago = num(q('#l_vpag').value) ?? valor;
      if (!o.data_pagamento) return erro('Informe a data ' + (rec?'do recebimento':'do pagamento'));
      if (!o.conta_id) return erro('Escolha a conta de onde ' + (rec?'entrou':'saiu') + ' o dinheiro');
    } else { o.status = 'Em aberto'; o.data_pagamento = null; o.valor_pago = null; }
    q('#lsal').disabled = true;
    let r;
    if (novo) {
      const n = Math.max(1, Math.min(120, parseInt(q('#l_npar').value) || 1)), d0 = new Date(o.vencimento + 'T12:00:00');
      const linhas = [];
      for (let i = 0; i < n; i++) {
        const d = new Date(d0); d.setMonth(d0.getMonth() + i);
        if (d.getDate() !== d0.getDate()) d.setDate(0);
        const iso = new Date(d - d.getTimezoneOffset()*60000).toISOString().slice(0,10);
        linhas.push({...o, fazenda_id:FIN.faz, vencimento:iso, parcela:`${i+1}/${n}`,
          ...(i > 0 ? {status:'Em aberto', data_pagamento:null, valor_pago:null} : {})});
      }
      r = await sb.from('lancamentos_financeiros').insert(linhas);
    } else {
      o.parcela = q('#l_par').value.trim() || null; o.atualizado_em = new Date().toISOString();
      r = await sb.from('lancamentos_financeiros').update(o).eq('id', reg.id);
    }
    if (r.error) { q('#lsal').disabled = false; return erro(r.error.message); }
    m.remove(); aviso('Salvo'); await carregarFin(true); render();
  };
  const exc = q('#lexc');
  if (exc) exc.onclick = async () => {
    if (!confirm('Excluir este lançamento? Não dá para desfazer.')) return;
    const r = await sb.from('lancamentos_financeiros').delete().eq('id', reg.id);
    if (r.error) return erro(r.error.message);
    m.remove(); aviso('Excluído'); await carregarFin(true); render();
  };
}

async function telaExtrato(){
  await carregarFin();

  if (!c) return ir('finsaldos');
  const h = hojeISO(), ini30 = new Date(Date.now() - 30*864e5).toISOString().slice(0,10);
  $('#corpo').innerHTML = `
    <div class="topo"><button class="voltar" id="volta">←</button><h2>Extrato</h2><button class="btn sec" id="csv">Exportar planilha</button></div>
    <div class="filtros"><select id="xc">${FIN.contas.map(x => `<option value="${x.id}" ${x.id===c.id?'selected':''}>${esc(x.nome)}</option>`).join('')}</select>
      <input id="xde" type="date" value="${ini30}"><input id="xate" type="date" value="${h}"></div>
    <div class="tabela"><table><thead><tr><th>Data</th><th>Descrição</th><th>Operação</th><th>Detalhe</th><th class="num">Valor</th><th class="num">Saldo</th></tr></thead><tbody id="tb"></tbody></table></div>
    <div class="rodape" id="rod"></div>`;
  $('#volta').onclick = () => ir('finsaldos');
  let mostra = [];

    const de = $('#xde').value || '0000', ate = $('#xate').value || '9999';
    const mv = movimentosConta(conta, '9999-12-31');
    let saldo = Number(conta.saldo_inicial||0);
    mv.filter(x => x.data < de).forEach(x => saldo += x.valor);
    const anterior = saldo;
    mostra = mv.filter(x => x.data >= de && x.data <= ate).map(x => ({...x, saldo: saldo += x.valor}));
    const ent = mostra.filter(x => x.valor > 0).reduce((s,x) => s + x.valor, 0), sai = mostra.filter(x => x.valor < 0).reduce((s,x) => s + x.valor, 0);
    $('#tb').innerHTML = `<tr><td>${fD(de === '0000' ? '' : de)}</td><td colspan="4"><i>Saldo anterior</i></td><td class="num">${fmtNum(anterior)}</td></tr>` +
      mostra.map((x,i) => `<tr class="${x.lanc?'clic':''}" data-i="${i}"><td>${fD(x.data)}</td><td>${esc(x.desc)}</td><td>${esc(x.op)}</td><td>${esc(x.det)}</td><td class="num" style="color:${x.valor<0?'var(--vermelho)':'var(--verde)'}">${fmtNum(x.valor)}</td><td class="num">${fmtNum(x.saldo)}</td></tr>`).join('');
    $('#rod').textContent = `${mostra.length} movimentos · entradas ${moeda(ent)} · saídas ${moeda(-sai)} · saldo final ${moeda(saldo)}`;
    document.querySelectorAll('#tb tr.clic').forEach(tr => tr.onclick = () => formLancFin(mostra[+tr.dataset.i].lanc));
  };
  ['xc','xde','xate'].forEach(id => $('#'+id).onchange = desenhar);
  $('#csv').onclick = () => baixarCSV('Extrato ' + nomeConta(E.extratoConta), ['Data','Descrição','Operação','Detalhe','Valor','Saldo'], mostra.map(x => [fD(x.data), x.desc, x.op, x.det, fmtNum(x.valor), fmtNum(x.saldo)]));
  desenhar();
}

async function telaFluxo(){
  $('#corpo').innerHTML = '<div class="vazio">Carregando…</div>';
  await carregarFin();
  const anos = [...new Set(FIN.lancs.map(l => (l.data_pagamento || l.vencimento).slice(0,4)))].sort();
  const anoAtual = hojeISO().slice(0,4);
  const MES = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
  $('#corpo').innerHTML = `
    <div class="topo"><button class="voltar" id="volta">←</button><h2>Fluxo de caixa</h2><button class="btn sec" id="csv">Exportar planilha</button></div>
    <div class="filtros"><select id="fa">${anos.map(a => `<option ${a===anoAtual?'selected':''}>${a}</option>`).join('')}</select>
      <select id="fm"><option value="real">Realizado (pago e recebido)</option><option value="prev">Previsto (em aberto, pelo vencimento)</option><option value="tudo">Realizado + previsto</option></select>
      <select id="fcc"><option value="">Centro de custo: todos</option>${FIN.centros.map(c => `<option>${esc(c.nome)}</option>`).join('')}</select>
      <select id="fdet"><option value="grupo">Por grupo do plano</option><option value="conta">Por conta do plano</option></select></div>
    <div class="tabela"><table id="tf"></table></div>
    <div class="rodape">Valores de lançamentos com rateio entre vários centros de custo entram inteiros em cada centro escolhido no filtro.</div>`;
  $('#volta').onclick = () => ir('inicio');
  let csv = [];
  const desenhar = () => {
    const ano = $('#fa').value, modo = $('#fm').value, cc = $('#fcc').value, det = $('#fdet').value;
    const lin = {}; const ord = {};
    FIN.lancs.forEach(l => {
      if (l.status === 'Cancelada') return;
      if (cc && !String(l.centro_custo||'').split(', ').includes(cc)) return;
      let d, v;
      if (l.status === 'Efetivada') { if (modo === 'prev') return; d = l.data_pagamento || l.vencimento; v = Number(l.valor_pago ?? l.valor); }
      else { if (modo === 'real') return; d = l.vencimento; v = Number(l.valor); }
      if (!d || d.slice(0,4) !== ano) return;
      const p = grupoDoPlano(l.plano_conta);
      const nat = l.tipo === 'Receber' ? 'Entradas' : 'Saídas';
      const chave = det === 'grupo' ? (p?.grupo || l.plano_conta || 'Sem plano') : (l.plano_conta || 'Sem plano');
      const k = nat + '|' + chave;
      if (!lin[k]) { lin[k] = Array(12).fill(0); ord[k] = [nat, chave]; }
      lin[k][+d.slice(5,7) - 1] += l.tipo === 'Receber' ? v : -v;
    });
    const ks = Object.keys(lin).sort((a,b) => a.localeCompare(b, 'pt-BR', {numeric:true}));
    const soma = f => Array.from({length:12}, (_,i) => ks.filter(f).reduce((s,k) => s + lin[k][i], 0));
    const ent = soma(k => k.startsWith('Entradas')), sai = soma(k => k.startsWith('Saídas')), res = ent.map((v,i) => v + sai[i]);
    const acum = []; res.reduce((s,v,i) => (acum[i] = s + v), 0);
    const tot = a => a.reduce((s,v) => s + v, 0);
    const cel = v => `<td class="num" style="color:${v<0?'var(--vermelho)':''}">${v ? fmtNum(v,0) : ''}</td>`;

    csv = [['Entradas', ...ent, tot(ent)], ...ks.filter(k => k.startsWith('Entradas')).map(k => ['  '+ord[k][1], ...lin[k], tot(lin[k])]),
      ['Saídas', ...sai, tot(sai)], ...ks.filter(k => k.startsWith('Saídas')).map(k => ['  '+ord[k][1], ...lin[k], tot(lin[k])]),

const TIPOS_EST = {'Compra':1, 'Transferência entre fazendas - Entrada':1, 'Venda':-1, 'Consumo':-1, 'Transferência entre fazendas - Saída':-1, 'Transferência entre locais':0, 'Ajuste de estoque':0};
async function carregarEst(){
  const fid = E.fazenda.id;
  const [produtos, locais, movs] = await Promise.all([
    todas(() => sb.from('produtos').select('*').eq('fazenda_id', fid).order('nome')),
    todas(() => sb.from('locais_estoque').select('*').eq('fazenda_id', fid).order('nome')),
    todas(() => sb.from('movimentos_estoque').select('*').eq('fazenda_id', fid).order('data').order('criado_em'))]);
  const pP = Object.fromEntries(produtos.map(p => [p.id, p])), pL = Object.fromEntries(locais.map(l => [l.id, l]));
  const saldo = {}; // produto|local
  const custo = {}; // produto -> {q, v}
  movs.forEach(m => { const k = m.produto_id + '|' + m.local_id; saldo[k] = (saldo[k]||0) + Number(m.quantidade);
    if (Number(m.quantidade) > 0 && m.valor_unitario != null && ['Compra','Transferência entre fazendas - Entrada'].includes(m.tipo)) { const c = custo[m.produto_id] = custo[m.produto_id] || {q:0, v:0}; c.q += Number(m.quantidade); c.v += Number(m.quantidade) * Number(m.valor_unitario); } });
  const saldoDe = (p, l) => l ? (saldo[p+'|'+l] || 0) : Object.entries(saldo).filter(([k]) => k.startsWith(p+'|')).reduce((s,[,v]) => s + v, 0);
  const custoMedio = p => custo[p]?.q ? custo[p].v / custo[p].q : null;
  return {produtos, locais, movs, pP, pL, saldo, saldoDe, custoMedio};
}
const fQ = v => fmtNum(v, Number.isInteger(Number(v)) ? 0 : 2);

function formMovEst(S, pre){
  if (!S.locais.length) { aviso('Cadastre primeiro um local de armazenamento'); return ir('locais'); }
  const prods = S.produtos.filter(p => p.ativo !== false || p.id === pre.produto_id);
  const m = document.createElement('div'); m.className = 'modal';
  m.innerHTML = `<div class="caixa"><h3>Movimentação de estoque</h3>
    <label>Operação *</label><select id="e_tipo">${Object.keys(TIPOS_EST).map(t => `<option ${t===(pre.tipo||'Compra')?'selected':''}>${t}</option>`).join('')}</select>
    <label>Data *</label><input id="e_data" type="date" value="${hojeISO()}" max="${hojeISO()}">
    <label>Produto *</label><select id="e_prod">${opcoes(prods, pre.produto_id)}</select>
    <label id="l_loc">Local *</label><select id="e_loc">${opcoes(S.locais, S.locais.length === 1 ? S.locais[0].id : '')}</select>
    <div id="b_dest"><label>Local de destino *</label><select id="e_dest">${opcoes(S.locais)}</select></div>
    <div id="e_saldo" class="rodape"></div>
    <label id="l_q">Quantidade *</label><input id="e_q" inputmode="decimal">
    <div id="b_vu"><label>Valor unitário (R$)</label><input id="e_vu" inputmode="decimal"></div>
    <div id="b_pes"><label id="l_pes">Fornecedor</label><input id="e_pes"></div>
    <label>Documento / nota</label><input id="e_doc">
    <label>Observação</label><input id="e_obs">
    <div class="msg erro" id="e_erro" style="display:none"></div>
    <div class="acoes"><button class="btn sec" id="e_can">Cancelar</button><button class="btn" id="e_sal">Lançar</button></div></div>`;
  document.body.appendChild(m);
  const g = id => m.querySelector('#'+id);
  const num = v => { v = String(v||'').trim().replace(/\./g,'').replace(',', '.'); return v === '' ? null : Number(v); };
  const atualizar = () => {
    const t = g('e_tipo').value, p = S.pP[g('e_prod').value];
    g('b_dest').style.display = t === 'Transferência entre locais' ? '' : 'none';
    g('b_vu').style.display = ['Compra','Venda','Transferência entre fazendas - Entrada'].includes(t) ? '' : 'none';
    g('b_pes').style.display = ['Compra','Venda'].includes(t) ? '' : 'none';
    g('l_pes').textContent = t === 'Venda' ? 'Cliente' : 'Fornecedor';
    g('l_q').textContent = t === 'Ajuste de estoque' ? 'Saldo correto (contado) *' : `Quantidade${p?.unidade ? ' ('+p.unidade+')' : ''} *`;
    g('l_loc').textContent = t === 'Transferência entre locais' ? 'Local de origem *' : 'Local *';
    const s = p && g('e_loc').value ? S.saldoDe(p.id, g('e_loc').value) : null;
    g('e_saldo').textContent = s == null ? '' : `Saldo atual neste local: ${fQ(s)} ${p.unidade||''}`;
    if (t === 'Compra' && p && !g('e_vu').value && S.custoMedio(p.id) != null) g('e_vu').placeholder = 'custo médio ' + fmtNum(S.custoMedio(p.id));
  };
  ['e_tipo','e_prod','e_loc'].forEach(id => g(id).onchange = atualizar); atualizar();
  g('e_can').onclick = () => m.remove();
  g('e_sal').onclick = async () => {
    const erro = t => { g('e_erro').textContent = t; g('e_erro').style.display = 'block'; };
    const t = g('e_tipo').value, pid = g('e_prod').value, loc = g('e_loc').value, q = num(g('e_q').value), d = g('e_data').value;
    if (!d) return erro('Informe a data'); if (!pid) return erro('Escolha o produto'); if (!loc) return erro('Escolha o local');
    if (q == null || isNaN(q) || (t !== 'Ajuste de estoque' && !(q > 0)) || (t === 'Ajuste de estoque' && q < 0)) return erro('Informe a quantidade');
    const atual = S.saldoDe(pid, loc);
    const base = {fazenda_id:E.fazenda.id, data:d, tipo:t, produto_id:pid, pessoa:g('e_pes').value.trim()||null, documento:g('e_doc').value.trim()||null, observacao:g('e_obs').value.trim()||null};
    let linhas;
    if (t === 'Transferência entre locais') {
      const dest = g('e_dest').value; if (!dest || dest === loc) return erro('Escolha um local de destino diferente');
      if (q > atual + 1e-9) return erro(`Saldo insuficiente no local de origem (${fQ(atual)})`);
      const grupo = crypto.randomUUID ? crypto.randomUUID() : null;
      linhas = [{...base, local_id:loc, quantidade:-q, grupo}, {...base, local_id:dest, quantidade:q, grupo}];
    } else if (t === 'Ajuste de estoque') {
      const dif = q - atual; if (Math.abs(dif) < 1e-9) return erro('O saldo já é esse; nada para ajustar');
      linhas = [{...base, local_id:loc, quantidade:dif, observacao:(base.observacao ? base.observacao + ' · ' : '') + `saldo ajustado de ${fQ(atual)} para ${fQ(q)}`}];
    } else {
      const sinal = TIPOS_EST[t];
      if (sinal < 0 && q > atual + 1e-9) return erro(`Saldo insuficiente neste local (${fQ(atual)}). Faça um ajuste se o estoque real for maior.`);
      linhas = [{...base, local_id:loc, quantidade:sinal*q, valor_unitario:num(g('e_vu').value) ?? (sinal > 0 ? S.custoMedio(pid) : null)}];
    }
    g('e_sal').disabled = true;
    const r = await sb.from('movimentos_estoque').insert(linhas);
    g('e_sal').disabled = false;
    if (r.error) return erro(r.error.message);
    m.remove(); aviso(`${t} lançada`); if (['estinsumos','estmov'].includes(E.tela)) render();
  };
}

    ls = fem.filter(a => (!b || a.brinco.includes(b) || (a.chip||'').includes(b)) && (!s || (a.situacao_reprodutiva||'Sem situação') === s) && (!o || a.ordem_paricao === o) && (!ar || a.area_id === ar));
    const mostra = ls.slice(0, 800);
    $('#tb').innerHTML = mostra.map((a,i) => `<tr class="clic" data-i="${i}"><td><b>${esc(a.brinco)}</b>${a.precoce?' <span class="pill">precoce</span>':''}</td><td>${idade(a.data_nascimento)}</td><td>${esc(a.raca)}</td>
      <td><span class="pill" style="background:${COR_SIT[a.situacao_reprodutiva]||'#fff'}">${esc(a.situacao_reprodutiva||'–')}</span></td><td class="num">${a.n_partos||''}</td><td>${esc(a.ordem_paricao)}</td><td>${fD(a.data_prevista_parto)}</td><td>${esc(B.areaPor[a.area_id]||'')}</td><td class="num">${fmtNum(a.peso_atual,0)}</td></tr>`).join('')
      || '<tr><td colspan="9" class="vazio">Nenhuma fêmea encontrada</td></tr>';
    $('#rod').textContent = `${fmtNum(ls.length,0)} fêmeas` + (ls.length > mostra.length ? ` (mostrando ${mostra.length}; use os filtros ou exporte)` : '');
    document.querySelectorAll('#tb tr.clic').forEach(tr => tr.onclick = () => fichaReprodutiva(mostra[+tr.dataset.i].id));
  };
  $('#rbus').oninput = desenhar; ['rsit','rord','rarea'].forEach(id => $('#'+id).onchange = desenhar);
  $('#csv').onclick = () => baixarCSV('Matrizes', ['Brinco','Chip','Idade','Raça','Situação','Partos','Ordem','Parto previsto','Área','Peso'], ls.map(a => [a.brinco, a.chip, idade(a.data_nascimento), a.raca, a.situacao_reprodutiva, a.n_partos, a.ordem_paricao, fD(a.data_prevista_parto), B.areaPor[a.area_id]||'', fmtNum(a.peso_atual,0)]));
  desenhar();
}

async function fichaReprodutiva(id){
  const [{data:a}, {data:evs}] = await Promise.all([
    sb.from('animais').select('*').eq('id', id).single(),
    sb.from('eventos_reprodutivos').select('*').eq('animal_id', id).order('data', {ascending:false}).order('criado_em', {ascending:false})]);
  if (!a) return aviso('Animal não encontrado');
  const {data:crias} = await sb.from('animais').select('id,brinco,sexo,data_nascimento,peso_atual,status').eq('fazenda_id', a.fazenda_id).eq('mae_brinco', a.brinco).order('data_nascimento', {ascending:false});
  const det = e => [e.tipo_cobertura, e.reprodutor ? 'Touro ' + e.reprodutor : '', e.diagnostico === true ? 'Prenhe' : e.diagnostico === false ? 'Vazia' : '', e.tipo_paricao, e.cria_brinco ? 'Cria ' + e.cria_brinco : '', e.observacao].filter(Boolean).join(' · ');
  const m = document.createElement('div'); m.className = 'modal';
  m.innerHTML = `<div class="caixa"><h3>Brinco ${esc(a.brinco)} <span class="pill" style="background:${COR_SIT[a.situacao_reprodutiva]||'#eee'}">${esc(a.situacao_reprodutiva||'sem situação')}</span></h3>
    <div class="rodape" style="margin-top:0">${idade(a.data_nascimento)} · ${esc(a.raca||'')} · ${a.n_partos||0} parto(s)${a.ordem_paricao?' · '+esc(a.ordem_paricao):''}${a.data_prevista_parto?' · parto previsto '+fD(a.data_prevista_parto):''}</div>
    ${podeEditar() ? `<div class="grade" style="grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0">${OPS_REP.map(o => `<button class="btn sec peq" data-op="${o}" style="min-height:50px">${o.replace('Diagnóstico de gestação','Diagnóstico')}</button>`).join('')}</div>` : ''}
    <div class="secao">Crias (${(crias||[]).length})</div>
    <div class="tabela"><table><thead><tr><th>Brinco</th><th>Sexo</th><th>Idade</th><th class="num">Peso</th><th>Status</th></tr></thead><tbody>
      ${(crias||[]).map(c => `<tr><td><b>${esc(c.brinco)}</b></td><td>${esc(c.sexo)}</td><td>${idade(c.data_nascimento)}</td><td class="num">${fmtNum(c.peso_atual,0)}</td><td>${esc(c.status)}</td></tr>`).join('') || '<tr><td colspan="5" class="vazio">Nenhuma cria registrada</td></tr>'}</tbody></table></div>
    <div class="secao">Histórico reprodutivo</div>
    <div class="tabela"><table><thead><tr><th>Data</th><th>Operação</th><th>Detalhe</th></tr></thead><tbody>
      ${(evs||[]).map(e => `<tr><td>${fD(e.data)}</td><td>${esc(e.operacao)}</td><td>${esc(det(e))}</td></tr>`).join('') || '<tr><td colspan="3" class="vazio">Sem lançamentos</td></tr>'}</tbody></table></div>
    <div class="acoes"><button class="btn sec" id="fch">Fechar</button></div></div>`;
  document.body.appendChild(m);
  m.querySelector('#fch').onclick = () => m.remove(); m.onclick = e => { if (e.target === m) m.remove(); };
  m.querySelectorAll('[data-op]').forEach(b => b.onclick = () => { m.remove(); formReprodutivo({operacao:b.dataset.op, brincos:a.brinco}); });
}

async function formReprodutivo(pre){
  const {data:reps} = await sb.from('eventos_reprodutivos').select('reprodutor').eq('fazenda_id', E.fazenda.id).not('reprodutor', 'is', null).order('data', {ascending:false}).limit(1000);
  const touros = [...new Set((reps||[]).map(r => r.reprodutor))];
  const B = await baseFazenda();
  const m = document.createElement('div'); m.className = 'modal';
  m.innerHTML = `<div class="caixa"><h3>Lançamento reprodutivo</h3>
    <label>Operação *</label><select id="r_op">${OPS_REP.map(o => `<option ${o===(pre.operacao||'Inseminação')?'selected':''}>${o}</option>`).join('')}</select>
    <label>Data *</label><input id="r_data" type="date" value="${hojeISO()}" max="${hojeISO()}">
    <label>Brinco(s) da(s) fêmea(s) *</label><textarea id="r_b" rows="3" inputmode="numeric" placeholder="Um ou vários, separados por espaço, vírgula ou linha">${esc(pre.brincos||'')}</textarea>
    <div id="r_cont" class="rodape"></div>
    <div id="b_ins"><label>Tipo de cobertura</label><select id="r_tc">${['IATF (Inseminação Artificial em Tempo Fixo)','IA (Inseminação Artificial)','Monta natural','Repasse com touro'].map(x => `<option>${x}</option>`).join('')}</select></div>
    <div id="b_rep"><label>Reprodutor (touro ou sêmen)</label><input id="r_rep" list="touros"><datalist id="touros">${touros.map(t => `<option value="${esc(t)}">`).join('')}</datalist></div>
    <div id="b_diag"><label>Resultado *</label><select id="r_diag"><option value="true">Prenhe</option><option value="false">Vazia</option></select></div>
    <div id="b_par"><label>Tipo de parição</label><select id="r_tp"><option>Normal</option><option>Distócico (com ajuda)</option><option>Aborto/Natimorto</option></select>
      <div id="b_cria"><div style="display:flex;gap:8px"><div style="flex:2"><label>Brinco da cria</label><input id="r_cria" inputmode="numeric"></div>
        <div style="flex:1"><label>Sexo da cria</label><select id="r_csexo"><option value="">—</option><option value="M">Macho</option><option value="F">Fêmea</option></select></div>
        <div style="flex:1"><label>Peso (kg)</label><input id="r_cpeso" inputmode="decimal"></div></div>
        <div class="rodape">Com brinco e sexo, a cria já é cadastrada como nascimento, ligada à mãe.</div></div></div>
    <label>Observação</label><input id="r_obs">
    <div class="msg erro" id="r_erro" style="display:none"></div><div id="r_ok"></div>
    <div class="acoes"><button class="btn sec" id="r_can">Fechar</button><button class="btn" id="r_sal">Lançar</button></div></div>`;
  document.body.appendChild(m);
  const g = id => m.querySelector('#'+id);
  const atualizar = () => {
    const op = g('r_op').value, n = separarCodigos(g('r_b').value).length;
    g('b_ins').style.display = op === 'Inseminação' ? '' : 'none';
    g('b_rep').style.display = ['Inseminação','Diagnóstico de gestação'].includes(op) ? '' : 'none';
    g('b_diag').style.display = op === 'Diagnóstico de gestação' ? '' : 'none';
    g('b_par').style.display = op === 'Parição' ? '' : 'none';
    g('b_cria').style.display = op === 'Parição' && n <= 1 && !/Aborto/.test(g('r_tp').value) ? '' : 'none';
    g('r_cont').textContent = n ? `${n} fêmea(s)` : '';
  };
  g('r_op').onchange = atualizar; g('r_b').oninput = atualizar; g('r_tp').onchange = atualizar; atualizar();
  g('r_can').onclick = () => { m.remove(); if (['matrizes','histrep'].includes(E.tela)) render(); };
  g('r_sal').onclick = async () => {
    const erro = t => { g('r_erro').textContent = t; g('r_erro').style.display = t ? 'block' : 'none'; };
    erro('');
    const op = g('r_op').value, brincos = separarCodigos(g('r_b').value), d = g('r_data').value;
    if (!d) return erro('Informe a data'); if (!brincos.length) return erro('Informe o brinco da fêmea');
    const cria = op === 'Parição' && brincos.length === 1 && !/Aborto/.test(g('r_tp').value) ? g('r_cria').value.trim().toUpperCase() : '';
    if (cria && cria.length > 5) return erro('Brinco da cria com mais de 5 dígitos: confira');
    if (cria && !g('r_csexo').value) return erro('Informe o sexo da cria');
    const p = {fazenda_id:E.fazenda.id, operacao:op, data:d, brincos, tipo_cobertura: op==='Inseminação' ? g('r_tc').value : '', reprodutor:g('r_rep').value.trim(),
      diagnostico: op==='Diagnóstico de gestação' ? g('r_diag').value : null, tipo_paricao: op==='Parição' ? g('r_tp').value : '', cria_brinco:cria, observacao:g('r_obs').value.trim()};
    g('r_sal').disabled = true;
    const r = await sb.rpc('lancar_reprodutivo', {p});
    let msg = '';
    if (!r.error && cria && r.data.lancados) {
      const mae = (await buscarAnimal(brincos[0]));
      const r2 = await sb.rpc('cadastrar_animal', {p:{fazenda_id:E.fazenda.id, origem:'Nascimento', data:d, brinco:cria, sexo:g('r_csexo').value, raca:mae?.raca||'', mae_brinco:mae?.brinco||brincos[0], area_id:mae?.area_id||'', categoria_id:'', peso:g('r_cpeso').value.replace(',','.'), observacao:''}});
      msg = r2.error ? ` · cria não cadastrada: ${r2.error.message.replace(/^.*?: /,'')}` : ` · cria ${cria} cadastrada`;
    }
    g('r_sal').disabled = false;
    if (r.error) return erro(r.error.message.replace(/^.*?: /,''));
    const er = r.data.erros || [];
    g('r_ok').innerHTML = `<div class="msg ok">${r.data.lancados} lançado(s)${msg}</div>` + (er.length ? `<div class="msg erro">${er.map(esc).join('<br>')}</div>` : '');
    if (!er.length) { g('r_b').value = ''; g('r_cria').value = ''; g('r_cpeso').value = ''; atualizar(); g('r_b').focus(); }
    cacheBase = null;
  };
  g('r_b').focus();
}

async function telaHistRep(){
  const ini = new Date(Date.now() - 90*864e5).toISOString().slice(0,10);
  $('#corpo').innerHTML = `<div class="topo"><button class="voltar" id="volta">←</button><h2>Histórico reprodutivo</h2>
      ${podeEditar() ? '<button class="btn" id="novo">+ Lançar</button>' : ''}<button class="btn sec" id="csv">Exportar planilha</button></div>
    <div class="filtros"><input id="h_ini" type="date" value="${ini}"><input id="h_fim" type="date" value="${hojeISO()}">
      <select id="h_op"><option value="">Todas as operações</option>${OPS_REP.map(o => `<option>${o}</option>`).join('')}</select>
      <input id="h_b" placeholder="Brinco ou touro"><button class="btn" id="h_ver">Visualizar</button></div>
    <div class="grade" id="h_ind" style="grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;margin-bottom:10px"></div>
    <div class="tabela"><table><thead><tr><th>Data</th><th>Fêmea</th><th>Operação</th><th>Cobertura</th><th>Reprodutor</th><th>Resultado / parição</th><th>Cria</th></tr></thead><tbody id="tb"></tbody></table></div>
    <div class="rodape" id="rod"></div>`;
  $('#volta').onclick = () => ir('inicio');
  if ($('#novo')) $('#novo').onclick = () => formReprodutivo({});
  let rows = [];
  const buscar = async () => {
    $('#tb').innerHTML = '<tr><td colspan="7" class="vazio">Carregando...</td></tr>';
    rows = await todas(() => { let q = sb.from('eventos_reprodutivos').select('*').eq('fazenda_id', E.fazenda.id).gte('data', $('#h_ini').value).lte('data', $('#h_fim').value).order('data', {ascending:false}).order('id');
      if ($('#h_op').value) q = q.eq('operacao', $('#h_op').value); return q; });
    const b = $('#h_b').value.trim().toUpperCase();
    if (b) rows = rows.filter(e => e.femea_brinco.includes(b) || String(e.reprodutor||'').toUpperCase().includes(b));
    const n = o => rows.filter(e => e.operacao === o).length;
    const dg = rows.filter(e => e.operacao === 'Diagnóstico de gestação'), pos = dg.filter(e => e.diagnostico).length;
    const ab = rows.filter(e => e.operacao === 'Parição' && /Aborto/.test(e.tipo_paricao||'')).length;
    const card = (v, t) => `<div class="quad" style="min-height:64px;padding:8px;cursor:default"><b>${v}</b><span>${t}</span></div>`;
    $('#h_ind').innerHTML = card(fmtNum(n('Inseminação'),0), 'inseminações') + card(fmtNum(dg.length,0), 'diagnósticos') + card(dg.length ? fmtNum(pos/dg.length*100,1)+'%' : '–', 'taxa de prenhez')
      + card(fmtNum(n('Parição') - ab,0), 'partos') + card(fmtNum(ab,0), 'abortos/natimortos') + card(fmtNum(n('Desmama'),0), 'desmamas');
    const mostra = rows.slice(0, 1000);
    $('#tb').innerHTML = mostra.map(e => `<tr class="${e.animal_id?'clic':''}" data-a="${e.animal_id||''}"><td>${fD(e.data)}</td><td><b>${esc(e.femea_brinco)}</b></td><td>${esc(e.operacao)}</td><td>${esc(e.tipo_cobertura)}</td><td>${esc(e.reprodutor)}</td>
      <td>${e.diagnostico===true?'Prenhe':e.diagnostico===false?'Vazia':esc(e.tipo_paricao)}</td><td>${esc(e.cria_brinco)}</td></tr>`).join('') || '<tr><td colspan="7" class="vazio">Nada no período</td></tr>';
    $('#rod').textContent = `${fmtNum(rows.length,0)} lançamentos` + (rows.length > mostra.length ? ` (mostrando ${mostra.length})` : '');
    document.querySelectorAll('#tb tr.clic').forEach(tr => tr.onclick = () => fichaReprodutiva(tr.dataset.a));
  };
  $('#h_ver').onclick = buscar;
  $('#csv').onclick = () => baixarCSV('Histórico reprodutivo', ['Data','Fêmea','Operação','Cobertura','Reprodutor','Resultado / parição','Cria','Observação'],
    rows.map(e => [fD(e.data), e.femea_brinco, e.operacao, e.tipo_cobertura, e.reprodutor, e.diagnostico===true?'Prenhe':e.diagnostico===false?'Vazia':e.tipo_paricao, e.cria_brinco, e.observacao]));
  buscar();
}

// ---------- Usuários ----------
async function telaUsuarios(){
  const fid = E.fazenda.id;
  const {data:mem} = await sb.from('fazenda_usuarios').select('usuario_id,papel').eq('fazenda_id', fid);
  const ids = (mem||[]).map(m => m.usuario_id);
  const {data:perfis} = ids.length ? await sb.from('perfis').select('id,nome,email').in('id', ids) : {data:[]};
  const nomes = {admin:'Administrador', gerente:'Gerente', operador:'Operador (lança)', consulta:'Só consulta'};
  $('#corpo').innerHTML = `
    <div class="topo"><button class="voltar" id="volta">←</button><h2>Usuários – ${esc(E.fazenda.nome)}</h2></div>
    <div class="tabela"><table><thead><tr><th>Nome</th><th>Email</th><th>Acesso</th><th></th></tr></thead><tbody>
    ${(mem||[]).map(m => { const p = (perfis||[]).find(x => x.id === m.usuario_id) || {};
      return `<tr><td>${esc(p.nome)}</td><td>${esc(p.email)}</td><td><select data-u="${m.usuario_id}" class="papel">${Object.entries(nomes).map(([k,v]) => `<option value="${k}" ${k===m.papel?'selected':''}>${v}</option>`).join('')}</select></td>
      <td>${m.usuario_id !== E.usuario.id ? `<button class="btn perigo peq" data-r="${m.usuario_id}">Remover</button>` : ''}</td></tr>`; }).join('') || '<tr><td colspan="4" class="vazio">Só administradores gerais têm acesso</td></tr>'}
    </tbody></table></div>
    <div class="secao">Liberar acesso</div>
    <div class="tabela" style="padding:12px">
      <div class="rodape" style="margin-top:0">A pessoa cria a conta no app primeiro. Depois você libera pelo email dela.</div>
      <label>Email</label><input id="uemail" type="email">
      <label>Acesso</label><select id="upapel">${Object.entries(nomes).map(([k,v]) => `<option value="${k}" ${k==='operador'?'selected':''}>${v}</option>`).join('')}</select>
      <label class="chk"><input type="checkbox" id="utodas"> Liberar em todas as fazendas</label>
      <div class="acoes"><button class="btn" id="uadd">Liberar acesso</button></div><div id="umsg"></div></div>`;
  $('#volta').onclick = () => ir('inicio');
  document.querySelectorAll('.papel').forEach(s => s.onchange = async () => {
    const r = await sb.from('fazenda_usuarios').update({papel:s.value}).eq('fazenda_id', fid).eq('usuario_id', s.dataset.u);
    aviso(r.error ? r.error.message : 'Acesso alterado');
  });
  document.querySelectorAll('[data-r]').forEach(b => b.onclick = async () => {
    if (!confirm('Remover o acesso desta pessoa nesta fazenda?')) return;
    await sb.from('fazenda_usuarios').delete().eq('fazenda_id', fid).eq('usuario_id', b.dataset.r); telaUsuarios();
  });
  $('#uadd').onclick = async () => {
    const email = $('#uemail').value.trim(), papel = $('#upapel').value;
    const alvo = $('#utodas').checked ? E.fazendas : [E.fazenda];
    let msg = '';
    for (const f of alvo) { const r = await sb.rpc('adicionar_usuario_fazenda', {f:f.id, e:email, p:papel}); msg = r.error ? r.error.message : r.data; if (msg !== 'ok') break; }
    if (msg === 'ok') { aviso('Acesso liberado'); telaUsuarios(); } else $('#umsg').innerHTML = `<div class="msg erro">${esc(msg)}</div>`;
  };
}

sb.auth.onAuthStateChange((ev) => { if (ev === 'SIGNED_IN' && !E.usuario) carregarUsuario(); if (ev === 'PASSWORD_RECOVERY') novaSenha(); });
async function novaSenha(){
  const s = prompt('Digite a nova senha (mínimo 6 caracteres):');
  if (s) { const r = await sb.auth.updateUser({password:s}); alert(r.error ? traduzErro(r.error.message) : 'Senha alterada.'); }
}
carregarUsuario();
</script>
