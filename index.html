  const totPar = () => { const t = [...q('#n_par').querySelectorAll('.p_v')].reduce((s,i) => s + num(i.value), 0); q('#n_parv').textContent = bv(t); q('#n_parv').style.color = Math.abs(t - vfin()) > .01 ? 'var(--vermelho)' : ''; };
  ['#n_npar','#n_ven','#n_dias','#n_mes'].forEach(s => q(s).addEventListener('change', gerarPar));
  const recalc = () => { q('#n_vfin').value = bv(vfin()); q('#n_rat').querySelectorAll('tr').forEach(tr => { const p = num(tr.querySelector('.r_pc').value); tr.querySelector('.r_v').value = bv(vfin() * p / 100); }); totRat(); gerarPar(); };
  ['#n_vini','#n_desc','#n_jur'].forEach(s => q(s).oninput = recalc);
  linhaRat(100); gerarPar(); mostraProd();
  // dados que já vieram preenchidos (nota fiscal, negócio de gado...)
  { const set = (sel, v) => { if (v != null && v !== '' && q(sel)) q(sel).value = v; };
    if (pre.operacao && OPS_FIN[tipo].includes(pre.operacao) && q('#n_op').value !== pre.operacao) { q('#n_op').value = pre.operacao; mostraProd(); }
    set('#n_data', pre.data_emissao); set('#n_pes', pre.pessoa); set('#n_doc', pre.documento); set('#n_tdoc', pre.tipo_documento); set('#n_emi', pre.data_emissao);
    set('#n_soc', pre.socio); set('#n_obs', pre.observacao); set('#n_forma', pre.forma_pagamento);
    const tot = pre._valores ? pre._valores.reduce((s, v) => s + Number(v || 0), 0) : Number(pre.valor || 0);
    if (tot) { q('#n_vini').value = bv(tot); if (pre.tipo_documento === 'Nota fiscal') q('#n_vnota').value = bv(tot); }
    const r0 = q('#n_rat').firstElementChild;
    if (r0) { if (pre.fazenda_ref_id) r0.querySelector('.r_f').value = pre.fazenda_ref_id; if (pre.centro_custo) r0.querySelector('.r_c').value = pre.centro_custo;
      if (pre.plano_conta) { const pl = [...r0.querySelector('.r_p').options].find(o => o.value === pre.plano_conta || o.value.endsWith(' - ' + pre.plano_conta) || o.value.startsWith(pre.plano_conta + ' ')); if (pl) r0.querySelector('.r_p').value = pl.value; } }
    if (pre._parcelas > 1) q('#n_npar').value = pre._parcelas;
    if (pre.vencimento) q('#n_ven').value = pre.vencimento;
    recalc();
    if (pre._vencs || pre._valores) [...q('#n_par').children].forEach((tr, i) => { if (pre._vencs?.[i]) tr.querySelector('.p_d').value = pre._vencs[i]; if (pre._valores?.[i] != null) tr.querySelector('.p_v').value = bv(pre._valores[i]); });
    totPar(); }
  q('#n_can').onclick = () => m.remove();
  q('#n_sal').onclick = async () => {
    q('#n_erro').style.display = 'none';
    const pessoa = q('#n_pes').value.trim(), vf = vfin();
    if (!pessoa) return erro(`Preencha: ${rec ? 'cliente' : 'fornecedor'}`);
    if (!q('#n_data').value) return erro('Preencha a data');
    if (!(vf > 0)) return erro('Informe o valor (valor final maior que zero)');
    const rats = [...q('#n_rat').children].map(tr => ({faz:tr.querySelector('.r_f').value, cc:tr.querySelector('.r_c').value, pl:tr.querySelector('.r_p').value, pct:num(tr.querySelector('.r_pc').value)}));
    for (const [i, r] of rats.entries()) { if (!r.faz || !r.cc || !r.pl) return erro(`Rateio ${i+1}: escolha fazenda, centro de custo e plano de contas`); if (!(r.pct > 0)) return erro(`Rateio ${i+1}: informe o valor ou o %`); }
    if (Math.abs(rats.reduce((s,r) => s + r.pct, 0) - 100) > .01) return erro('O rateio precisa somar 100% do valor final');
    const pars = [...q('#n_par').children].map(tr => ({ven:tr.querySelector('.p_d').value, v:num(tr.querySelector('.p_v').value), pg:tr.querySelector('.p_pg').checked, dp:tr.querySelector('.p_dp').value, ct:tr.querySelector('.p_ct').value}));
    for (const [i, p] of pars.entries()) { if (!p.ven) return erro(`Parcela ${i+1}: informe o vencimento`); if (!(p.v > 0)) return erro(`Parcela ${i+1}: valor maior que zero`);
      if (p.pg && (!p.dp || !p.ct)) return erro(`Parcela ${i+1}: informe a data e a conta do ${rec ? 'recebimento' : 'pagamento'}`); }
    if (Math.abs(pars.reduce((s,p) => s + p.v, 0) - vf) > .01) return erro('A soma das parcelas precisa ser igual ao valor final');
    const itens = /produtos/i.test(q('#n_op').value) ? [...q('#n_itens').children].map(tr => ({produto_id:tr.querySelector('.it_p').value, produto:tr.querySelector('.it_p').selectedOptions[0]?.textContent || '', quantidade:num(tr.querySelector('.it_q').value), valor_unitario:num(tr.querySelector('.it_u').value), total:num(tr.querySelector('.it_t').value)})).filter(i => i.produto_id && i.quantidade) : [];
    if (itens.length && q('#n_pfaz').value && !q('#n_ploc').value) return erro('Escolha o local de estoque (ou deixe "não dar entrada no estoque")');
    const grupo = crypto.randomUUID(), n = pars.length;
    const base = {tipo, operacao:q('#n_op').value, pessoa, documento:q('#n_doc').value.trim() || null, tipo_documento:q('#n_tdoc').value || null, data_emissao:q('#n_emi').value || q('#n_data').value,
      forma_pagamento:q('#n_forma').value || null, socio:q('#n_soc').value.trim() || null, observacao:q('#n_obs').value.trim() || null, fazenda_id:FIN.faz, grupo,
      valor_inicial:num(q('#n_vini').value) || null, desconto:num(q('#n_desc').value) || null, juros:num(q('#n_jur').value) || null, valor_nota:num(q('#n_vnota').value) || null,
      ordem_servico:q('#n_os').value.trim() || null, numero_pedido:q('#n_ped').value.trim() || null};
    const linhas = [];
    pars.forEach((p, i) => { let resto = p.v;
      rats.forEach((r, k) => { const v = k === rats.length - 1 ? r2(resto) : r2(p.v * r.pct / 100); resto -= v;
        linhas.push({...base, parcela:`${i+1}/${n}`, vencimento:p.ven, valor:v, plano_conta:r.pl, centro_custo:r.cc, fazenda_ref_id:r.faz, rateio_pct:r.pct,
          conta_id:(p.pg ? p.ct : q('#n_conta').value) || null, status:p.pg ? 'Efetivada' : 'Em aberto', data_pagamento:p.pg ? p.dp : null, valor_pago:p.pg ? v : null,
          itens:(i === 0 && k === 0 && itens.length) ? itens : null}); }); });
    q('#n_sal').disabled = true;
    const r = await sb.from('lancamentos_financeiros').insert(linhas).select('id');
    if (r.error) { q('#n_sal').disabled = false; return erro(r.error.message); }
    if (pre._neg) await sb.from('negociacoes_gado').update({lancamento_id:r.data?.[0]?.id || null, lancamentos_ids:(r.data||[]).map(x => x.id)}).eq('id', pre._neg);
    if (pre._nota) await sb.from('notas_fiscais').update({status:'Lançada', lancamento_id:r.data?.[0]?.id || null}).eq('id', pre._nota);
    if (itens.length && q('#n_pfaz').value) {
      const mv = itens.map(i => ({fazenda_id:q('#n_pfaz').value, data:q('#n_data').value, tipo:'Compra', produto_id:i.produto_id, local_id:q('#n_ploc').value, quantidade:i.quantidade, valor_unitario:i.valor_unitario || null,
        pessoa, documento:base.documento, observacao:'Compra lançada no financeiro'}));
      const r2_ = await sb.from('movimentos_estoque').insert(mv); if (r2_.error) aviso('Conta salva, mas o estoque não entrou: ' + r2_.error.message);
    }
    m.remove(); aviso(`Salvo: ${n} parcela(s)${rats.length > 1 ? ` · rateio em ${rats.length} centros` : ''}`); await carregarFin(true); render();
  };
}

function formLancFin(reg){
  const novo = !reg.id, tipo = reg.tipo, rec = tipo === 'Receber', pode = podeEditar();
  const nat = rec ? 'Receita' : 'Despesa';
  const planos = FIN.planos.filter(p => p.natureza === nat || reg.plano_conta === p.codigo+' - '+p.nome);
  const optPl = [...planos.map(p => p.codigo+' - '+p.nome)]; if (reg.plano_conta && !optPl.includes(reg.plano_conta)) optPl.unshift(reg.plano_conta);
  const optCc = FIN.centros.map(c => c.nome); if (reg.centro_custo && !optCc.includes(reg.centro_custo)) optCc.unshift(reg.centro_custo);
  const ops = OPS_FIN[tipo].includes(reg.operacao) || !reg.operacao ? OPS_FIN[tipo] : [reg.operacao, ...OPS_FIN[tipo]];
  const pessoas = [...new Set(FIN.lancs.map(l => l.pessoa).concat((FIN.pessoas||[]).map(p => p.nome)).filter(Boolean))].sort();
  const socios = [...new Set(FIN.lancs.map(l => l.socio).filter(Boolean))].sort();
  const sel = (id, arr, v, vazio) => `<select id="${id}">${vazio!==undefined?`<option value="">${vazio}</option>`:''}${arr.map(x => `<option ${x===v?'selected':''}>${esc(x)}</option>`).join('')}</select>`;
  const efet = reg.status === 'Efetivada';
  const m = document.createElement('div'); m.className = 'modal';
  m.innerHTML = `<div class="caixa"><h3>${novo ? 'Nova conta a ' + (rec?'receber':'pagar') : (rec ? 'Conta a receber' : 'Conta a pagar')}</h3>
    <label>Operação</label>${sel('l_op', ops, reg.operacao)}
    <label>${rec?'Cliente':'Fornecedor'} *</label><input id="l_pes" list="l_pesl" value="${esc(reg.pessoa)}"><datalist id="l_pesl">${pessoas.map(p => `<option value="${esc(p)}">`).join('')}</datalist>
    <div style="display:flex;gap:8px"><div style="flex:1"><label>Documento</label><input id="l_doc" value="${esc(reg.documento)}"></div>
      <div style="flex:1"><label>Tipo de documento</label>${sel('l_tdoc', ['Nota fiscal','Recibo','Boleto','Contrato','Outros'].concat(reg.tipo_documento && !['Nota fiscal','Recibo','Boleto','Contrato','Outros'].includes(reg.tipo_documento) ? [reg.tipo_documento] : []), reg.tipo_documento, '—')}</div></div>
    <div style="display:flex;gap:8px"><div style="flex:1"><label>Emissão</label><input id="l_emi" type="date" value="${reg.data_emissao || (novo ? hojeISO() : '')}"></div>
      <div style="flex:1"><label>${novo ? '1º vencimento' : 'Vencimento'} *</label><input id="l_ven" type="date" value="${reg.vencimento || hojeISO()}"></div></div>
    <div style="display:flex;gap:8px"><div style="flex:1"><label>Valor${novo ? ' de cada parcela' : ''} (R$) *</label><input id="l_val" inputmode="decimal" value="${reg.valor != null ? String(reg.valor).replace('.',',') : ''}"></div>
      ${novo ? `<div style="flex:1"><label>Parcelas</label><input id="l_npar" type="number" min="1" max="120" value="${reg._parcelas||1}"></div>` : `<div style="flex:1"><label>Parcela</label><input id="l_par" value="${esc(reg.parcela)}"></div>`}</div>
    <label>Plano de contas *</label>${sel('l_pl', optPl, reg.plano_conta, '—')}
    <label>Centro de custo *</label>${sel('l_cc', optCc, reg.centro_custo, '—')}
    <div style="display:flex;gap:8px"><div style="flex:1"><label>Conta</label><select id="l_conta"><option value="">—</option>${FIN.contas.filter(c => c.ativo || c.id === reg.conta_id).map(c => `<option value="${c.id}" ${c.id===reg.conta_id?'selected':''}>${esc(c.nome)}</option>`).join('')}</select></div>
      <div style="flex:1"><label>Forma de pagamento</label>${sel('l_forma', FORMAS.concat(reg.forma_pagamento && !FORMAS.includes(reg.forma_pagamento) ? [reg.forma_pagamento] : []), reg.forma_pagamento, '—')}</div></div>
    <label>Fazenda (de onde é esta conta)</label><select id="l_faz"><option value="">— todas / geral —</option>${E.fazendas.filter(f => !f.sede_financeiro).map(f => `<option value="${f.id}" ${f.id===reg.fazenda_ref_id?'selected':''}>${esc(f.nome)}</option>`).join('')}</select>
    <label>Sócio / produtor</label><input id="l_soc" list="l_socl" value="${esc(reg.socio)}"><datalist id="l_socl">${socios.map(p => `<option value="${esc(p)}">`).join('')}</datalist>
    <label>Observação</label><input id="l_obs" value="${esc(reg.observacao)}">
    <div id="l_anexos"></div>
    <label class="chk" style="margin-top:12px"><input type="checkbox" id="l_efet" ${efet?'checked':''}> <b>Já foi ${rec?'recebido':'pago'}</b></label>
    <div id="l_baixa" style="display:${efet?'flex':'none'};gap:8px"><div style="flex:1"><label>Data ${rec?'do recebimento':'do pagamento'}</label><input id="l_dpag" type="date" value="${reg.data_pagamento || hojeISO()}"></div>
      <div style="flex:1"><label>Valor ${rec?'recebido':'pago'} (R$)</label><input id="l_vpag" inputmode="decimal" value="${reg.valor_pago != null ? String(reg.valor_pago).replace('.',',') : ''}" placeholder="igual ao valor"></div></div>
    ${reg.grupo ? `<div class="rodape">Lançamento com rateio/parcelas: ${FIN.lancs.filter(l => l.grupo === reg.grupo).length} linha(s)${reg.rateio_pct ? ` · esta linha = ${fmtNum(reg.rateio_pct,2)}% do rateio` : ''}${reg.valor_nota ? ` · valor da nota fiscal ${moeda(reg.valor_nota)}` : ''}${reg.desconto ? ` · desconto ${moeda(reg.desconto)}` : ''}${reg.juros ? ` · juros ${moeda(reg.juros)}` : ''}${reg.ordem_servico ? ` · OS ${esc(reg.ordem_servico)}` : ''}</div>` : ''}
    ${Array.isArray(reg.itens) && reg.itens.length ? `<div class="rodape">Produtos: ${reg.itens.map(i => `${fmtNum(i.quantidade,2)} × ${esc(i.produto)} = ${moeda(i.total)}`).join(' · ')}</div>` : ''}
    ${reg.criado_em ? `<div class="rodape">Lançado em ${fmtData(reg.criado_em)}</div>` : ''}
    <div class="msg erro" id="lerro" style="display:none"></div>
    <div class="acoes"><button class="btn sec" id="lcan">Cancelar</button>${pode ? '<button class="btn" id="lsal">Salvar</button>' : ''}${!novo && ehAdmin() ? '<button class="btn perigo" id="lexc">Excluir</button>' : ''}</div>
    </div>`;
  document.body.appendChild(m);
  const q = s => m.querySelector(s);
  if (!pode) m.querySelectorAll('input,select').forEach(i => i.disabled = true);
  blocoAnexos(m, reg);
  q('#l_cc').addEventListener('change', () => { if (q('#l_faz').value) return; const cc = q('#l_cc').value.toUpperCase();
    const f = E.fazendas.find(f => !f.sede_financeiro && cc.startsWith(f.nome.toUpperCase().replace('FAZENDA ','') + '-')); if (f) q('#l_faz').value = f.id; });
  q('#l_efet').onchange = () => { q('#l_baixa').style.display = q('#l_efet').checked ? 'flex' : 'none'; };
  q('#lcan').onclick = () => m.remove(); m.onclick = e => { if (e.target === m) m.remove(); };
  const erro = t => { const d = q('#lerro'); d.textContent = t; d.style.display = 'block'; };
  const num = v => { v = String(v||'').trim().replace(/\./g,'').replace(',', '.'); return v === '' ? null : Number(v); };
  if (pode) q('#lsal').onclick = async () => {
    const valor = num(q('#l_val').value);
    const o = {tipo, operacao:q('#l_op').value, pessoa:q('#l_pes').value.trim(), documento:q('#l_doc').value.trim()||null, tipo_documento:q('#l_tdoc').value||null,
      data_emissao:q('#l_emi').value||null, vencimento:q('#l_ven').value, valor, plano_conta:q('#l_pl').value||null, centro_custo:q('#l_cc').value||null,
      conta_id:q('#l_conta').value||null, forma_pagamento:q('#l_forma').value||null, socio:q('#l_soc').value.trim()||null, observacao:q('#l_obs').value.trim()||null, fazenda_ref_id:q('#l_faz').value||null};
    if (!o.pessoa) return erro(`Preencha: ${rec?'cliente':'fornecedor'}`);
    if (!o.vencimento) return erro('Preencha o vencimento');
    if (!(valor > 0)) return erro('Informe um valor maior que zero');
    if (!o.plano_conta) return erro('Escolha o plano de contas');
    if (!o.centro_custo) return erro('Escolha o centro de custo');
    if (q('#l_efet').checked) {
      o.status = 'Efetivada'; o.data_pagamento = q('#l_dpag').value; o.valor_pago = num(q('#l_vpag').value) ?? valor;
      if (!o.data_pagamento) return erro('Informe a data ' + (rec?'do recebimento':'do pagamento'));
      if (!o.conta_id) return erro('Escolha a conta de onde ' + (rec?'entrou':'saiu') + ' o dinheiro');
    } else { o.status = 'Em aberto'; o.data_pagamento = null; o.valor_pago = null; }
    q('#lsal').disabled = true;
    let r;
    if (novo) {
      const n = Math.max(1, Math.min(120, parseInt(q('#l_npar').value) || 1)), d0 = new Date(o.vencimento + 'T12:00:00');
      const linhas = [];
      for (let i = 0; i < n; i++) {
        const d = new Date(d0); d.setMonth(d0.getMonth() + i);
        if (d.getDate() !== d0.getDate()) d.setDate(0);
        const iso = new Date(d - d.getTimezoneOffset()*60000).toISOString().slice(0,10);
        linhas.push({...o, fazenda_id:FIN.faz, vencimento:(reg._vencs && reg._vencs.length === n && reg._vencs[i]) || iso, parcela:`${i+1}/${n}`,

          ...(i > 0 ? {status:'Em aberto', data_pagamento:null, valor_pago:null} : {})});
      }
      r = await sb.from('lancamentos_financeiros').insert(linhas).select('id');
      if (!r.error && reg._neg) await sb.from('negociacoes_gado').update({lancamento_id:r.data?.[0]?.id || null, lancamentos_ids:(r.data||[]).map(x => x.id)}).eq('id', reg._neg);
      if (!r.error && reg._nota) await sb.from('notas_fiscais').update({status:'Lançada', lancamento_id:r.data?.[0]?.id || null}).eq('id', reg._nota);
    } else {
      o.parcela = q('#l_par').value.trim() || null; o.atualizado_em = new Date().toISOString();
      r = await sb.from('lancamentos_financeiros').update(o).eq('id', reg.id);
      // rateio: as outras linhas da mesma parcela recebem a mesma baixa
      if (!r.error && reg.grupo && o.status !== reg.status) {
        const irmas = FIN.lancs.filter(l => l.grupo === reg.grupo && l.parcela === reg.parcela && l.id !== reg.id);
        for (const l of irmas) await sb.from('lancamentos_financeiros').update(o.status === 'Efetivada'
          ? {status:'Efetivada', data_pagamento:o.data_pagamento, conta_id:o.conta_id, valor_pago:l.valor, atualizado_em:o.atualizado_em}
          : {status:'Em aberto', data_pagamento:null, valor_pago:null, atualizado_em:o.atualizado_em}).eq('id', l.id);
        if (irmas.length) aviso(`Baixa aplicada também nas outras ${irmas.length} linha(s) do rateio desta parcela`);
      }
    }
    if (r.error) { q('#lsal').disabled = false; return erro(r.error.message); }
    m.remove(); aviso('Salvo'); await carregarFin(true); render();
  };
  const exc = q('#lexc');
  if (exc) exc.onclick = async () => {
    if (!confirm('Excluir este lançamento? Não dá para desfazer.')) return;
    const r = await sb.from('lancamentos_financeiros').delete().eq('id', reg.id);
    if (r.error) return erro(r.error.message);
    m.remove(); aviso('Excluído'); await carregarFin(true); render();
  };
}

async function telaSaldos(){
  $('#corpo').innerHTML = '<div class="vazio">Carregando…</div>';
  await carregarFin();
  const hoje = hojeISO();
  const linhas = FIN.contas.map(c => {
    const s = saldoConta(c);
    const prev = FIN.lancs.filter(l => l.conta_id === c.id && l.status === 'Em aberto' && c.tipo !== 'Cartão de crédito').reduce((t,l) => t + (l.tipo==='Receber'?1:-1)*Number(l.valor||0), 0);
    return {c, s, prev};
  });
  const tot = linhas.reduce((t,x) => t + x.s, 0);
  $('#corpo').innerHTML = `
    <div class="topo"><button class="voltar" id="volta">←</button><h2>Contas e saldos</h2>

const TIPOS_EST = {'Compra':1, 'Transferência entre fazendas - Entrada':1, 'Venda':-1, 'Consumo':-1, 'Transferência entre fazendas - Saída':-1, 'Transferência entre locais':0, 'Ajuste de estoque':0};
async function carregarEst(){
  const fid = E.fazenda.id;
  const [produtos, locais, movs] = await Promise.all([
    todas(() => sb.from('produtos').select('*').eq('fazenda_id', fid).order('nome')),
    todas(() => sb.from('locais_estoque').select('*').eq('fazenda_id', fid).order('nome')),
    todas(() => sb.from('movimentos_estoque').select('*').eq('fazenda_id', fid).order('data').order('criado_em'))]);
  const pP = Object.fromEntries(produtos.map(p => [p.id, p])), pL = Object.fromEntries(locais.map(l => [l.id, l]));
  const saldo = {}; // produto|local
  const custo = {}; // produto -> {q, v}
  movs.forEach(m => { const k = m.produto_id + '|' + m.local_id; saldo[k] = (saldo[k]||0) + Number(m.quantidade);
    if (Number(m.quantidade) > 0 && m.valor_unitario != null && ['Compra','Transferência entre fazendas - Entrada'].includes(m.tipo)) { const c = custo[m.produto_id] = custo[m.produto_id] || {q:0, v:0}; c.q += Number(m.quantidade); c.v += Number(m.quantidade) * Number(m.valor_unitario); } });
  const saldoDe = (p, l) => l ? (saldo[p+'|'+l] || 0) : Object.entries(saldo).filter(([k]) => k.startsWith(p+'|')).reduce((s,[,v]) => s + v, 0);
  const custoMedio = p => custo[p]?.q ? custo[p].v / custo[p].q : null;
  return {produtos, locais, movs, pP, pL, saldo, saldoDe, custoMedio};
}
const fQ = v => fmtNum(v, Number.isInteger(Number(v)) ? 0 : 2);

function fichaProdutoEst(S, p){
  const mv = S.movs.filter(m => m.produto_id === p.id);
  let s = 0; const linhas = mv.map(m => ({m, s: s += Number(m.quantidade)})).reverse();
  const m = document.createElement('div'); m.className = 'modal';
  m.innerHTML = `<div class="caixa"><h3>${esc(p.nome)} <span class="pill">${esc(p.unidade||'')}</span></h3>
    <div class="rodape" style="margin-top:0">Saldo ${fQ(S.saldoDe(p.id))} ${esc(p.unidade||'')}${S.custoMedio(p.id)!=null?' · custo médio '+moeda(S.custoMedio(p.id)):''}</div>
    ${podeEditar() ? `<div class="grade" style="grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0">${['Compra','Consumo','Transferência entre locais','Venda','Ajuste de estoque','Transferência entre fazendas - Saída'].map(t => `<button class="btn sec peq" data-t="${t}" style="min-height:50px">${t.replace('Transferência entre fazendas - ','Transf. fazenda - ').replace('Transferência entre locais','Transf. entre locais')}</button>`).join('')}</div>` : ''}

    ${linhas.map(x => `<tr><td>${fD(x.m.data)}</td><td>${esc(x.m.tipo)}</td><td>${esc(S.pL[x.m.local_id]?.nome)}</td><td class="num" style="color:${x.m.quantidade<0?'var(--vermelho)':'var(--verde)'}">${fQ(x.m.quantidade)}</td><td class="num">${fQ(x.s)}</td></tr>`).join('') || '<tr><td colspan="5" class="vazio">Sem movimentações</td></tr>'}

function formMovEst(S, pre){
  if (!S.locais.length) { aviso('Cadastre primeiro um local de armazenamento'); return ir('locais'); }
  const prods = S.produtos.filter(p => p.ativo !== false || p.id === pre.produto_id);
  const m = document.createElement('div'); m.className = 'modal';
  m.innerHTML = `<div class="caixa"><h3>Movimentação de estoque</h3>
    <label>Operação *</label><select id="e_tipo">${Object.keys(TIPOS_EST).map(t => `<option ${t===(pre.tipo||'Compra')?'selected':''}>${t}</option>`).join('')}</select>
    <label>Data *</label><input id="e_data" type="date" value="${hojeISO()}" max="${hojeISO()}">
    <label>Produto *</label><select id="e_prod">${opcoes(prods, pre.produto_id)}</select>
    <label id="l_loc">Local *</label><select id="e_loc">${opcoes(S.locais, S.locais.length === 1 ? S.locais[0].id : '')}</select>
    <div id="b_dest"><label>Local de destino *</label><select id="e_dest">${opcoes(S.locais)}</select></div>
    <div id="e_saldo" class="rodape"></div>
    <label id="l_q">Quantidade *</label><input id="e_q" inputmode="decimal">
    <div id="b_vu"><label>Valor unitário (R$)</label><input id="e_vu" inputmode="decimal"></div>
    <div id="b_pes"><label id="l_pes">Fornecedor</label><input id="e_pes"></div>
    <label>Documento / nota</label><input id="e_doc">
    <label>Observação</label><input id="e_obs">
    <div class="msg erro" id="e_erro" style="display:none"></div>
    <div class="acoes"><button class="btn sec" id="e_can">Cancelar</button><button class="btn" id="e_sal">Confirmar</button></div></div>`;
  document.body.appendChild(m);
  const g = id => m.querySelector('#'+id);
  const num = v => { v = String(v||'').trim().replace(/\./g,'').replace(',', '.'); return v === '' ? null : Number(v); };
  const atualizar = () => {
    const t = g('e_tipo').value, p = S.pP[g('e_prod').value];
    g('b_dest').style.display = t === 'Transferência entre locais' ? '' : 'none';
    g('b_vu').style.display = ['Compra','Venda','Transferência entre fazendas - Entrada'].includes(t) ? '' : 'none';
    g('b_pes').style.display = ['Compra','Venda'].includes(t) ? '' : 'none';
    g('l_pes').textContent = t === 'Venda' ? 'Cliente' : 'Fornecedor';
    g('l_q').textContent = t === 'Ajuste de estoque' ? 'Saldo correto (contado) *' : `Quantidade${p?.unidade ? ' ('+p.unidade+')' : ''} *`;
    g('l_loc').textContent = t === 'Transferência entre locais' ? 'Local de origem *' : 'Local *';
    const s = p && g('e_loc').value ? S.saldoDe(p.id, g('e_loc').value) : null;
    g('e_saldo').textContent = s == null ? '' : `Saldo atual neste local: ${fQ(s)} ${p.unidade||''}`;
    if (t === 'Compra' && p && !g('e_vu').value && S.custoMedio(p.id) != null) g('e_vu').placeholder = 'custo médio ' + fmtNum(S.custoMedio(p.id));
  };
  ['e_tipo','e_prod','e_loc'].forEach(id => g(id).onchange = atualizar); atualizar();
  g('e_can').onclick = () => m.remove();
  g('e_sal').onclick = async () => {
    const erro = t => { g('e_erro').textContent = t; g('e_erro').style.display = 'block'; };
    const t = g('e_tipo').value, pid = g('e_prod').value, loc = g('e_loc').value, q = num(g('e_q').value), d = g('e_data').value;
    if (!d) return erro('Informe a data'); if (!pid) return erro('Escolha o produto'); if (!loc) return erro('Escolha o local');
    if (q == null || isNaN(q) || (t !== 'Ajuste de estoque' && !(q > 0)) || (t === 'Ajuste de estoque' && q < 0)) return erro('Informe a quantidade');
    const atual = S.saldoDe(pid, loc);
    const base = {fazenda_id:E.fazenda.id, data:d, tipo:t, produto_id:pid, pessoa:g('e_pes').value.trim()||null, documento:g('e_doc').value.trim()||null, observacao:g('e_obs').value.trim()||null};
    let linhas;
    if (t === 'Transferência entre locais') {
      const dest = g('e_dest').value; if (!dest || dest === loc) return erro('Escolha um local de destino diferente');
      if (q > atual + 1e-9) return erro(`Saldo insuficiente no local de origem (${fQ(atual)})`);
      const grupo = crypto.randomUUID ? crypto.randomUUID() : null;
      linhas = [{...base, local_id:loc, quantidade:-q, grupo}, {...base, local_id:dest, quantidade:q, grupo}];
    } else if (t === 'Ajuste de estoque') {
      const dif = q - atual; if (Math.abs(dif) < 1e-9) return erro('O saldo já é esse; nada para ajustar');
      linhas = [{...base, local_id:loc, quantidade:dif, observacao:(base.observacao ? base.observacao + ' · ' : '') + `saldo ajustado de ${fQ(atual)} para ${fQ(q)}`}];
    } else {
      const sinal = TIPOS_EST[t];
      if (sinal < 0 && q > atual + 1e-9) return erro(`Saldo insuficiente neste local (${fQ(atual)}). Faça um ajuste se o estoque real for maior.`);
      linhas = [{...base, local_id:loc, quantidade:sinal*q, valor_unitario:num(g('e_vu').value) ?? (sinal > 0 ? S.custoMedio(pid) : null)}];
    }
    g('e_sal').disabled = true;
    const r = await sb.from('movimentos_estoque').insert(linhas);
    g('e_sal').disabled = false;
    if (r.error) return erro(r.error.message);
    m.remove(); aviso(`${t} lançada`); if (['estinsumos','estmov'].includes(E.tela)) render();
  };
}

}

  document.body.appendChild(m);
  const g = id => m.querySelector('#'+id);
  const atualizar = () => {
    const op = g('r_op').value, n = separarCodigos(g('r_b').value).length;
    g('b_ins').style.display = op === 'Inseminação' ? '' : 'none';
    g('b_rep').style.display = ['Inseminação','Diagnóstico de gestação'].includes(op) ? '' : 'none';
    g('b_diag').style.display = op === 'Diagnóstico de gestação' ? '' : 'none';
    g('b_par').style.display = op === 'Parição' ? '' : 'none';
    g('b_cria').style.display = op === 'Parição' && n <= 1 && !/Aborto/.test(g('r_tp').value) ? '' : 'none';
    g('r_cont').textContent = n ? `${n} fêmea(s)` : '';
  };

  g('r_can').onclick = () => { m.remove(); if (['matrizes','histrep'].includes(E.tela)) render(); };
  g('r_sal').onclick = async () => {
    const erro = t => { g('r_erro').textContent = t; g('r_erro').style.display = t ? 'block' : 'none'; };
    erro('');
    const op = g('r_op').value, brincos = separarCodigos(g('r_b').value), d = g('r_data').value;
    if (!d) return erro('Informe a data'); if (!brincos.length) return erro('Informe o brinco da fêmea');
    const cria = op === 'Parição' && brincos.length === 1 && !/Aborto/.test(g('r_tp').value) ? g('r_cria').value.trim().toUpperCase() : '';
    if (cria && cria.length > 5) return erro('Brinco da cria com mais de 5 dígitos: confira');
    if (cria && !g('r_csexo').value) return erro('Informe o sexo da cria');
    const p = {fazenda_id:E.fazenda.id, operacao:op, data:d, brincos, tipo_cobertura: op==='Inseminação' ? g('r_tc').value : '', reprodutor:g('r_rep').value.trim(),
      diagnostico: op==='Diagnóstico de gestação' ? g('r_diag').value : null, tipo_paricao: op==='Parição' ? g('r_tp').value : '', cria_brinco:cria, observacao:g('r_obs').value.trim()};
    g('r_sal').disabled = true;
    const r = await sb.rpc('lancar_reprodutivo', {p});
    let msg = '';
    if (!r.error && cria && r.data.lancados) {
      const mae = (await buscarAnimal(brincos[0]));
      const r2 = await sb.rpc('cadastrar_animal', {p:{fazenda_id:E.fazenda.id, origem:'Nascimento', data:d, brinco:cria, sexo:g('r_csexo').value, raca:mae?.raca||'', mae_brinco:mae?.brinco||brincos[0], area_id:mae?.area_id||'', categoria_id:'', peso:g('r_cpeso').value.replace(',','.'), observacao:''}});
      msg = r2.error ? ` · cria não cadastrada: ${r2.error.message.replace(/^.*?: /,'')}` : ` · cria ${cria} cadastrada`;
      if (!r2.error && mae?.area_id && g('r_ccat')?.value) {
        const r3 = await sb.rpc('lancar_operacao', {p:{fazenda_id:E.fazenda.id, operacao:'Nascimento', data:d, area_id:mae.area_id, categoria_id:g('r_ccat').value, area_destino_id:'', categoria_destino_id:'', quantidade:1, peso_medio:g('r_cpeso').value.replace(',','.') || '', causa_morte:'', observacao:'Cria ' + cria + ' da ' + (mae.brinco || '')}});
        const an = await buscarAnimal(cria); if (an) await sb.rpc('lancar_individual', {p:{animal_id:an.id, operacao:'Localização', data:d, area_id:mae.area_id, categoria_id:g('r_ccat').value}});
        msg += r3.error ? ' (lote não ajustado)' : ' · somada no lote da mãe'; }
    }
    g('r_sal').disabled = false;
    if (r.error) return erro(r.error.message.replace(/^.*?: /,''));
    const er = r.data.erros || [];
    g('r_ok').innerHTML = `<div class="msg ok">${r.data.lancados} lançado(s)${msg}</div>` + (er.length ? `<div class="msg erro">${er.map(esc).join('<br>')}</div>` : '');
    if (!er.length) { g('r_b').value = ''; g('r_cria').value = ''; g('r_cpeso').value = ''; atualizar(); g('r_b').focus(); }
    cacheBase = null;
  };
  g('r_b').focus();
}

// Estrutura da DRE gerencial pelo código do grupo do plano de contas
const DRE_LINHAS = [
  ['rb', 'Receita bruta', c => [100,103,105,108].includes(c)],
  ['ded', '(-) Deduções e impostos sobre vendas', c => [130,135].includes(c)],
  ['cv', '(-) Custos variáveis (nutrição, sanidade, reprodução...)', c => (c >= 300 && c < 350) || [230,247].includes(c)],
  ['ca', '(-) Compras de animais', c => c >= 350 && c < 360],
  ['cf', '(-) Custos fixos (pessoal, manutenção, energia...)', c => [200,210,220,240,245,246,248,249,251,270].includes(c)],
  ['adm', '(-) Despesas administrativas', c => [363,364,365,368,400].includes(c)],
  ['vend', '(-) Despesas com vendas', c => c === 370],
  ['rfin', '(+) Receitas financeiras', c => c === 120],
  ['dfin', '(-) Despesas financeiras', c => c === 380],
  ['rno', '(+) Receitas não operacionais (venda de ativos)', c => c === 140],
  ['trib', '(-) Tributos sobre o resultado', c => c === 390],
  ['fora', 'Fora do resultado: investimentos, capital, financiamentos e movimentações', c => c >= 410]];
const linhaDRE = txt => { const p = grupoDoPlano(txt); const c = parseInt(p?.grupo || txt) || 0; return (DRE_LINHAS.find(l => l[2](c)) || ['outros'])[0]; };

async function telaDRE(){
  $('#corpo').innerHTML = '<div class="vazio">Carregando…</div>';
  await carregarFin();
  const anos = [...new Set(FIN.lancs.map(l => (l.data_pagamento || l.vencimento).slice(0,4)))].sort();
  const MES = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
  $('#corpo').innerHTML = `<div class="topo"><button class="voltar" id="volta">←</button><h2>DRE – resultado do exercício</h2><button class="btn sec" id="csv">Exportar planilha</button></div>
    <div class="filtros"><select id="da">${anos.map(a => `<option ${a===hojeISO().slice(0,4)?'selected':''}>${a}</option>`).join('')}</select>
      <select id="dreg"><option value="caixa">Regime de caixa (pago e recebido)</option><option value="comp">Competência (pelo vencimento)</option></select>
      <select id="dcc"><option value="">Centro de custo: todos</option>${FIN.centros.map(c => `<option>${esc(c.nome)}</option>`).join('')}</select>
      <select id="dfz"><option value="">Fazenda: todas</option>${E.fazendas.filter(f => !f.sede_financeiro).map(f => `<option value="${f.id}">${esc(f.nome)}</option>`).join('')}<option value="-">Sem fazenda</option></select>
      <select id="dper"><option value="ano">Total do ano</option><option value="mes">Mês a mês</option></select></div>
    <div class="tabela"><table id="td"></table></div>
    <div class="rodape">DRE gerencial montada pelos grupos do plano de contas. Não inclui variação do valor do rebanho. Para a declaração oficial, confira com o contador.</div>`;
  $('#volta').onclick = () => ir('inicio');
  let csv = [], cab = [];
  const desenhar = () => {
    const ano = $('#da').value, caixa = $('#dreg').value === 'caixa', cc = $('#dcc').value, mensal = $('#dper').value === 'mes', fz = $('#dfz').value;
    const L = {}; const det = {};
    FIN.lancs.forEach(l => {
      if (l.status === 'Cancelada') return;
      if (caixa && l.status !== 'Efetivada') return;
      if (cc && !String(l.centro_custo||'').split(', ').includes(cc)) return;
      if (fz && (fz === '-' ? l.fazenda_ref_id : l.fazenda_ref_id !== fz)) return;
      const d = caixa ? (l.data_pagamento || l.vencimento) : l.vencimento;
      if (!d || d.slice(0,4) !== ano) return;
      const v = (caixa ? Number(l.valor_pago ?? l.valor) : Number(l.valor)) * (l.tipo === 'Receber' ? 1 : -1);
      const k = linhaDRE(l.plano_conta), mi = mensal ? +d.slice(5,7) - 1 : 0;
      (L[k] = L[k] || Array(12).fill(0))[mi] += v;
      const g = grupoDoPlano(l.plano_conta)?.grupo || l.plano_conta || 'Sem plano';
      det[k] = det[k] || {}; (det[k][g] = det[k][g] || Array(12).fill(0))[mi] += v;
    });
    const n = mensal ? 12 : 1, z = () => Array(n).fill(0), get = k => (L[k] || Array(12).fill(0)).slice(0, n);
    const soma = (...ks) => z().map((_,i) => ks.reduce((s,k) => s + get(k)[i], 0));
    const rl = soma('rb','ded'), ro = soma('rb','ded','cv','ca','cf','adm','vend'), rliq = soma('rb','ded','cv','ca','cf','adm','vend','rfin','dfin','rno','trib','outros');
    const rb = get('rb');
    const cel = (v, i) => `<td class="num" style="color:${v<0?'var(--vermelho)':''}">${v ? fmtNum(v,0) : ''}</td>`;
    const pct = a => mensal ? '' : `<td class="num">${rb[0] ? fmtNum(a[0]/rb[0]*100,1)+'%' : ''}</td>`;
    const linha = (nome, a, est='') => `<tr style="${est}"><td style="white-space:normal">${nome}</td>${a.map(cel).join('')}${pct(a)}</tr>`;
    const sub = k => Object.entries(det[k]||{}).sort((a,b) => a[0].localeCompare(b[0],'pt-BR',{numeric:true})).map(([g,a]) => linha('&nbsp;&nbsp;&nbsp;' + esc(g), a.slice(0,n), 'color:var(--cinza);font-size:13px')).join('');
    const bloco = k => { const l = DRE_LINHAS.find(x => x[0] === k); return linha(l[1], get(k)) + sub(k); };
    const tot = (nome, a) => linha(`<b>${nome}</b>`, a, 'background:#eef2e8;font-weight:700');
    cab = [ano, ...(mensal ? MES : ['Total']), ...(mensal ? [] : ['% receita'])];
    $('#td').innerHTML = `<thead><tr>${cab.map((c,i) => `<th class="${i?'num':''}">${c}</th>`).join('')}</tr></thead><tbody>
      ${bloco('rb')}${bloco('ded')}${tot('= Receita líquida', rl)}
      ${bloco('cv')}${bloco('ca')}${bloco('cf')}${bloco('adm')}${bloco('vend')}${tot('= Resultado operacional', ro)}
      ${bloco('rfin')}${bloco('dfin')}${bloco('rno')}${bloco('trib')}${L.outros ? linha('Outros (sem grupo reconhecido)', get('outros')) + sub('outros') : ''}
      ${tot('= Resultado líquido do período', rliq)}
      <tr><td colspan="${cab.length}" style="padding-top:16px"></td></tr>${bloco('fora')}</tbody>`;
    const lin = (nome, a) => [nome, ...a.map(v => fmtNum(v)), ...(mensal ? [] : [rb[0] ? fmtNum(a[0]/rb[0]*100,1) : ''])];
    csv = [...['rb','ded'].map(k => lin(DRE_LINHAS.find(x=>x[0]===k)[1], get(k))), lin('= Receita líquida', rl),
      ...['cv','ca','cf','adm','vend'].map(k => lin(DRE_LINHAS.find(x=>x[0]===k)[1], get(k))), lin('= Resultado operacional', ro),
      ...['rfin','dfin','rno','trib'].map(k => lin(DRE_LINHAS.find(x=>x[0]===k)[1], get(k))), lin('= Resultado líquido do período', rliq), lin(DRE_LINHAS.at(-1)[1], get('fora'))];
  };
  ['da','dreg','dcc','dper','dfz'].forEach(id => $('#'+id).onchange = desenhar);
  $('#csv').onclick = () => baixarCSV('DRE ' + $('#da').value, cab, csv);
  desenhar();
}

      .map(l => ({l, ent: l.tipo === 'Receber' ? Number(l.valor_pago ?? l.valor) : 0, sai: l.tipo === 'Pagar' ? Number(l.valor_pago ?? l.valor) : 0}))
      .sort((a,b) => a.l.data_pagamento < b.l.data_pagamento ? -1 : 1);
    const E_ = ls.reduce((s,x) => s + x.ent, 0), S_ = ls.reduce((s,x) => s + x.sai, 0);
    const card = (t, v, cor) => `<div class="quad" style="min-height:64px;padding:8px;cursor:default"><span>${t}</span><b style="color:${cor||'inherit'}">${moeda(v)}</b></div>`;
    $('#ltot').innerHTML = card('Receitas', E_, 'var(--verde)') + card('Despesas', S_, 'var(--vermelho)') + card('Resultado', E_ - S_, E_-S_<0?'var(--vermelho)':'var(--verde)') + `<div class="quad" style="min-height:64px;padding:8px;cursor:default"><span>Lançamentos</span><b>${fmtNum(ls.length,0)}</b></div>`;
    if (lanc) {

      csv = rows.map(r => r.map((c,i) => i > 5 ? fmtNum(c) : c));
    } else {
      cab = ['Mês','Receitas','Despesas','Resultado do mês','Resultado acumulado'];
      let ac = 0;
      const rows = MES.map((m,i) => { const mm = String(i+1).padStart(2,'0'); const x = ls.filter(y => y.l.data_pagamento.slice(5,7) === mm);
        const e = x.reduce((s,y) => s + y.ent, 0), s = x.reduce((s2,y) => s2 + y.sai, 0); ac += e - s; return [m, e, s, e - s, ac]; });
      $('#tl').innerHTML = `<thead><tr>${cab.map((c,i) => `<th class="${i?'num':''}">${c}</th>`).join('')}</tr></thead><tbody>` +
        rows.map(r => `<tr>${r.map((c,i) => i ? `<td class="num" style="color:${c<0?'var(--vermelho)':''}">${c ? fmtNum(c) : ''}</td>` : `<td>${c}</td>`).join('')}</tr>`).join('') +
        `<tr style="background:#eef2e8;font-weight:700"><td>Total</td><td class="num">${fmtNum(E_)}</td><td class="num">${fmtNum(S_)}</td><td class="num">${fmtNum(E_-S_)}</td><td></td></tr></tbody>`;
      csv = rows.map(r => r.map((c,i) => i ? fmtNum(c) : c));
    }
  };
  ['la','ls','lv','lfora'].forEach(id => $('#'+id).onchange = desenhar);
  $('#csv').onclick = () => baixarCSV('Livro caixa ' + $('#la').value + ($('#ls').value ? ' ' + $('#ls').value : ''), cab, csv);
  desenhar();
}

async function fichaNota(id){
  const {data:n} = await sb.from('notas_fiscais').select('*').eq('id', id).single();
  if (!n) return;
  const d = n.dados || {};
  const itens = Array.isArray(d.itens) ? d.itens : [];
  const parc = Array.isArray(d.duplicatas) ? d.duplicatas : [];
  const m = document.createElement('div'); m.className = 'modal';
  m.innerHTML = `<div class="caixa"><h3>NF ${esc(n.numero||'')}${n.serie?' série '+esc(n.serie):''} <span class="pill">${esc(n.status)}</span></h3>
    <div class="rodape" style="margin-top:0">${fmtData(n.data_emissao)} · ${moeda(n.valor_total)} · ${esc(n.situacao_sefaz||'')}${n.manifestacao?' · manifestação: '+esc(n.manifestacao):''}</div>
    <label>Emitente</label><div><b>${esc(n.emitente_nome)}</b> ${esc(n.emitente_doc||'')}</div>
    <label>Destinatário</label><div>${esc(n.destinatario_nome)}</div>
    <label>Natureza da operação</label><div>${esc(n.natureza_operacao||'')}</div>
    <label>Chave de acesso</label><div style="font-family:monospace;font-size:12px;word-break:break-all">${esc(n.chave||'')}</div>
    ${itens.length ? `<div class="secao">Itens</div><div class="tabela"><table><thead><tr><th>Produto</th><th class="num">Qtd</th><th>Un</th><th class="num">Valor</th></tr></thead><tbody>
      ${itens.map(i => `<tr><td style="white-space:normal">${esc(i.descricao||'')}</td><td class="num">${fmtNum(i.quantidade_comercial,2)}</td><td>${esc(i.unidade_comercial||'')}</td><td class="num">${fmtNum(i.valor_bruto ?? i.valor_total)}</td></tr>`).join('')}</tbody></table></div>`
      : (n.completa ? '' : '<div class="rodape">Esta nota só tem o resumo (a SEFAZ ainda não liberou o conteúdo completo).</div>')}
    ${parc.length ? `<div class="rodape">Duplicatas: ${parc.map(p => `${fD(p.data_vencimento)} ${moeda(p.valor)}`).join(' · ')}</div>` : ''}
    <div class="msg erro" id="nerro" style="display:none"></div>

    ${podeEditar() && itens.length ? `<div class="acoes">${d.estoque ? '<span class="rodape">✔ Já deu entrada no estoque (' + d.estoque.itens + ' itens)</span>' : ''}<button class="btn sec" id="nest">Dar entrada no estoque de insumos</button></div>` : ''}
    <div class="acoes">${podeEditar() ? `<button class="btn sec" id="nign">${n.status==='Ignorada'?'Voltar para nova':'Ignorar nota'}</button>` : ''}<button class="btn sec" id="nfch">Cancelar</button></div></div>`;
  document.body.appendChild(m);
  m.querySelector('#nfch').onclick = () => m.remove(); m.onclick = e => { if (e.target === m) m.remove(); };
  const ign = m.querySelector('#nign');
  if (ign) ign.onclick = async () => { const r = await sb.from('notas_fiscais').update({status: n.status==='Ignorada' ? 'Nova' : 'Ignorada'}).eq('id', n.id); if (r.error) return aviso(r.error.message); m.remove(); aviso('Atualizado'); render(); };
  if (m.querySelector('#nest')) m.querySelector('#nest').onclick = () => { m.remove(); entradaEstoqueNota(n); };
  const lanc = m.querySelector('#nlanc');
  if (lanc) lanc.onclick = async () => {
    await carregarFin(true); m.remove();
    const venc = parc[0]?.data_vencimento?.slice(0,10) || String(n.data_emissao||'').slice(0,10) || hojeISO();
    const obs = itens.slice(0,3).map(i => i.descricao).filter(Boolean).join(', ');
    formNovoFin('Pagar', 'Compra de produtos', {tipo:'Pagar', operacao: 'Compra de produtos', pessoa:n.emitente_nome, documento:n.numero, tipo_documento:'Nota fiscal', data_emissao:String(n.data_emissao||'').slice(0,10), vencimento:venc,
      valor: Number(n.valor_total), socio:n.destinatario_nome, observacao:obs, _nota:n.id, _parcelas: parc.length,
      _valores: parc.length > 1 ? parc.map(p => Number(p.valor)) : null, _vencs: parc.length > 1 ? parc.map(p => String(p.data_vencimento).slice(0,10)) : null});
  };
}

const TIPOS_AGRI = ['Preparo do solo','Calagem / gessagem','Plantio','Adubação','Adubação de cobertura','Pulverização','Roçada','Irrigação','Colheita','Ensilagem','Fenação','Outros'];
async function carregarAgri(){
  const fid = E.fazenda.id;
  const [ops, safras, areas, produtos, locais] = await Promise.all([
    todas(() => sb.from('operacoes_agricolas').select('*').eq('fazenda_id', fid).order('data', {ascending:false}).order('criado_em', {ascending:false})),
    todas(() => sb.from('safras').select('*').eq('fazenda_id', fid).order('inicio', {ascending:false})),
    todas(() => sb.from('areas').select('id,codigo,hectares,cultura').eq('fazenda_id', fid).order('codigo')),
    todas(() => sb.from('produtos').select('id,nome,unidade,ativo').eq('fazenda_id', fid).order('nome')),
    todas(() => sb.from('locais_estoque').select('id,nome,ativo').eq('fazenda_id', fid).order('nome'))]);
  return {ops, safras, areas, produtos, locais, aP:Object.fromEntries(areas.map(a => [a.id,a])), pP:Object.fromEntries(produtos.map(p => [p.id,p])), sP:Object.fromEntries(safras.map(s => [s.id,s]))};
}

  const g = id => m.querySelector('#'+id);
  const num = v => { v = String(v||'').trim().replace(/\./g,'').replace(',', '.'); return v === '' ? null : Number(v); };
  const marcadas = () => novo ? [...m.querySelectorAll('#g_areas input:checked')] : [];
  const atualizar = () => {
    const t = g('g_tipo').value;
    g('b_col').style.display = ['Colheita','Ensilagem','Fenação'].includes(t) ? '' : 'none';
    g('b_prod').style.display = ['Roçada','Colheita','Ensilagem','Fenação'].includes(t) ? 'none' : '';
    const p = A.pP[g('g_prod').value]; g('l_gq').textContent = `Quantidade total${p?.unidade ? ' ('+p.unidade+')' : ''}`;
    if (novo) { const ha = marcadas().reduce((s,i) => s + Number(i.dataset.ha||0), 0); g('g_ha').placeholder = ha ? fmtNum(ha)+' (soma)' : 'soma das áreas'; }
    if (g('g_local')) g('g_local').style.display = g('g_baixa').checked ? '' : 'none';
  };
  if (novo) { g('g_abus').oninput = e => m.querySelectorAll('#g_areas .chk').forEach(l => l.style.display = l.dataset.c.includes(e.target.value.toLowerCase()) ? '' : 'none');
    m.querySelectorAll('#g_areas input').forEach(i => i.onchange = atualizar); g('g_baixa').onchange = atualizar; }
  g('g_tipo').onchange = atualizar; g('g_prod').onchange = atualizar; atualizar();
  g('g_dose').oninput = () => { const ha = num(g('g_ha').value) ?? marcadas().reduce((s,i) => s + Number(i.dataset.ha||0), 0); const d = num(g('g_dose').value); if (d != null && ha) g('g_q').value = String(Math.round(d*ha*1000)/1000).replace('.',','); };
  g('g_can').onclick = () => m.remove();
  const erro = t => { g('g_erro').textContent = t; g('g_erro').style.display = 'block'; };
  if (pode) g('g_sal').onclick = async () => {
    const t = g('g_tipo').value, d = g('g_data').value, temProd = g('b_prod').style.display !== 'none', temCol = g('b_col').style.display !== 'none';
    const prod = temProd ? g('g_prod').value || null : null, qtd = temProd ? num(g('g_q').value) : null;
    const base = {fazenda_id:E.fazenda.id, data:d, tipo:t, safra_id:g('g_safra').value||null, produto_id:prod, maquina:g('g_maq').value.trim()||null, operador:g('g_op').value.trim()||null,
      colhido: temCol ? num(g('g_col').value) : null, unidade_colheita: temCol ? g('g_ucol').value : null, custo:num(g('g_custo').value), observacao:g('g_obs').value.trim()||null};
    if (!d) return erro('Informe a data');
    if (prod && !(qtd > 0)) return erro('Informe a quantidade do produto');
    g('g_sal').disabled = true;
    if (!novo) {
      const r = await sb.from('operacoes_agricolas').update({...base, area_id:g('g_area').value, area_ha:num(g('g_ha').value), quantidade:qtd}).eq('id', reg.id);
      g('g_sal').disabled = false; if (r.error) return erro(r.error.message); m.remove(); aviso('Salvo'); return render();
    }
    const sel = marcadas(); if (!sel.length) { g('g_sal').disabled = false; return erro('Marque pelo menos uma área'); }
    const haTot = num(g('g_ha').value) ?? sel.reduce((s,i) => s + Number(i.dataset.ha||0), 0);
    const baixa = prod && qtd > 0 && g('g_baixa').checked;
    if (baixa && !g('g_local').value) { g('g_sal').disabled = false; return erro('Escolha o local de onde sai o produto'); }
    let movId = null;
    if (baixa) {
      const {data:movs} = await sb.from('movimentos_estoque').select('quantidade').eq('fazenda_id', E.fazenda.id).eq('produto_id', prod).eq('local_id', g('g_local').value);
      const saldo = (movs||[]).reduce((s,x) => s + Number(x.quantidade), 0);
      if (qtd > saldo + 1e-9) { g('g_sal').disabled = false; return erro(`Saldo insuficiente no estoque (${fQ(saldo)}). Desmarque a baixa ou lance a compra antes.`); }
      const r = await sb.from('movimentos_estoque').insert({fazenda_id:E.fazenda.id, data:d, tipo:'Consumo', produto_id:prod, local_id:g('g_local').value, quantidade:-qtd,
        observacao:`${t} em ${sel.map(i => A.aP[i.value]?.codigo).join(', ')}`}).select('id').single();
      if (r.error) { g('g_sal').disabled = false; return erro(r.error.message); }
      movId = r.data.id;
    }
    // uma linha por área, com produto, custo e colheita rateados pela área
    const linhas = sel.map((i, k) => { const ha = Number(i.dataset.ha||0), fr = sel.length === 1 ? 1 : (haTot ? ha / sel.reduce((s,x) => s + Number(x.dataset.ha||0), 0) : 1/sel.length);
      const rr = v => v == null ? null : Math.round(v * fr * 1000) / 1000;
      return {...base, area_id:i.value, area_ha: sel.length === 1 ? haTot : Math.round(haTot*fr*100)/100, quantidade:rr(qtd), colhido:rr(base.colhido), custo: base.custo == null ? null : Math.round(base.custo*fr*100)/100, movimento_id: k === 0 ? movId : null}; });
    const r = await sb.from('operacoes_agricolas').insert(linhas);
    g('g_sal').disabled = false;
    if (r.error) return erro(r.error.message);
    m.remove(); aviso(`${t} lançada em ${linhas.length} área(s)`); render();
  };
  const exc = g('g_exc');
  if (exc) exc.onclick = async () => {
    if (!confirm('Excluir esta operação?' + (reg.movimento_id ? ' A baixa no estoque também será desfeita.' : ''))) return;
    const r = await sb.from('operacoes_agricolas').delete().eq('id', reg.id);
    if (r.error) return erro(r.error.message);
    if (reg.movimento_id) await sb.from('movimentos_estoque').delete().eq('id', reg.movimento_id);
    m.remove(); aviso('Excluída'); render();
  };
}

async function telaChuvas(){
  $('#corpo').innerHTML = '<div class="vazio">Carregando…</div>';
  const ch = await todas(() => sb.from('chuvas').select('*').eq('fazenda_id', E.fazenda.id).order('data', {ascending:false}));
  const anos = [...new Set([hojeISO().slice(0,4), ...ch.map(c => c.data.slice(0,4))])].sort().reverse();
  const MES = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
  const pluvs = [...new Set(ch.map(c => c.pluviometro).filter(Boolean))].sort();
  $('#corpo').innerHTML = `<div class="topo"><button class="voltar" id="volta">←</button><h2>Chuvas – ${esc(E.fazenda.nome)}</h2>
      ${podeEditar() ? '<button class="btn" id="novo">+ Lançar chuva</button>' : ''}<button class="btn sec" id="csv">Exportar planilha</button></div>
    <div class="filtros"><select id="cano">${anos.map(a => `<option>${a}</option>`).join('')}</select>
      <select id="cpl"><option value="">Pluviômetro: todos (média)</option>${pluvs.map(p => `<option>${esc(p)}</option>`).join('')}</select></div>
    <div class="tabela"><table id="cmes"></table></div>
    <div class="secao">Lançamentos</div>
    <div class="tabela"><table><thead><tr><th>Data</th><th class="num">mm</th><th>Pluviômetro</th><th>Observação</th></tr></thead><tbody id="tb"></tbody></table></div>`;
  $('#volta').onclick = () => ir('inicio');
  if ($('#novo')) $('#novo').onclick = () => formChuva(pluvs);
  let ls = [];
  const desenhar = () => {
    const ano = $('#cano').value, pl = $('#cpl').value;
    ls = ch.filter(c => c.data.slice(0,4) === ano && (!pl || c.pluviometro === pl));
    // por dia: média entre pluviômetros quando não há filtro
    const dia = {}; ls.forEach(c => { (dia[c.data] = dia[c.data] || []).push(Number(c.mm)); });
    const mes = Array(12).fill(0), dias = Array(12).fill(0);
    Object.entries(dia).forEach(([d, v]) => { const mm = v.reduce((s,x) => s + x, 0) / v.length; mes[+d.slice(5,7)-1] += mm; if (mm > 0) dias[+d.slice(5,7)-1]++; });
    let ac = 0; const acum = mes.map(v => ac += v);
    $('#cmes').innerHTML = `<thead><tr><th>${ano}</th>${MES.map(m => `<th class="num">${m}</th>`).join('')}<th class="num">Total</th></tr></thead><tbody>
      <tr><td>Chuva (mm)</td>${mes.map(v => `<td class="num">${v ? fmtNum(v,1) : ''}</td>`).join('')}<td class="num"><b>${fmtNum(ac,1)}</b></td></tr>
      <tr><td>Dias com chuva</td>${dias.map(v => `<td class="num">${v || ''}</td>`).join('')}<td class="num">${dias.reduce((s,v) => s + v, 0)}</td></tr>
      <tr><td>Acumulado</td>${acum.map(v => `<td class="num">${v ? fmtNum(v,0) : ''}</td>`).join('')}<td></td></tr></tbody>`;
    $('#tb').innerHTML = ls.map((c,i) => `<tr class="${ehAdmin()?'clic':''}" data-i="${i}"><td>${fD(c.data)}</td><td class="num">${fmtNum(c.mm,1)}</td><td>${esc(c.pluviometro)}</td><td>${esc(c.observacao)}</td></tr>`).join('') || '<tr><td colspan="4" class="vazio">Nenhuma chuva lançada neste ano</td></tr>';
    document.querySelectorAll('#tb tr.clic').forEach(tr => tr.onclick = async () => { const c = ls[+tr.dataset.i]; if (!confirm(`Excluir a chuva de ${fmtNum(c.mm,1)} mm em ${fD(c.data)}?`)) return; const r = await sb.from('chuvas').delete().eq('id', c.id); if (r.error) return aviso(r.error.message); aviso('Excluída'); telaChuvas(); });
  };
  ['cano','cpl'].forEach(id => $('#'+id).onchange = desenhar);
  $('#csv').onclick = () => baixarCSV('Chuvas ' + $('#cano').value, ['Data','mm','Pluviômetro','Observação'], ls.map(c => [fD(c.data), fmtNum(c.mm,1), c.pluviometro, c.observacao]));
  desenhar();
}

function formChuva(pluvs){
  const m = document.createElement('div'); m.className = 'modal';
  m.innerHTML = `<div class="caixa"><h3>Lançar chuva</h3>
    <div style="display:flex;gap:8px"><div style="flex:1"><label>Data *</label><input id="c_data" type="date" value="${hojeISO()}" max="${hojeISO()}"></div>
      <div style="flex:1"><label>Chuva (mm) *</label><input id="c_mm" inputmode="decimal"></div></div>
    <label>Pluviômetro / local</label><input id="c_pl" list="c_pls" value="${esc(pluvs[0]||'')}"><datalist id="c_pls">${pluvs.map(p => `<option value="${esc(p)}">`).join('')}</datalist>
    <label>Observação</label><input id="c_obs">
    <div class="msg erro" id="c_erro" style="display:none"></div>
    <div class="acoes"><button class="btn sec" id="c_can">Cancelar</button><button class="btn" id="c_sal">Salvar</button></div></div>`;
  document.body.appendChild(m);
  const g = id => m.querySelector('#'+id);
  g('c_can').onclick = () => m.remove(); g('c_mm').focus();
  g('c_sal').onclick = async () => {
    const mm = Number(String(g('c_mm').value).replace(',', '.'));
    if (!g('c_data').value) { g('c_erro').textContent = 'Informe a data'; g('c_erro').style.display = 'block'; return; }
    if (!(mm >= 0) || g('c_mm').value === '') { g('c_erro').textContent = 'Informe os milímetros'; g('c_erro').style.display = 'block'; return; }
    const r = await sb.from('chuvas').insert({fazenda_id:E.fazenda.id, data:g('c_data').value, mm, pluviometro:g('c_pl').value.trim()||null, observacao:g('c_obs').value.trim()||null});
    if (r.error) { g('c_erro').textContent = r.error.message; g('c_erro').style.display = 'block'; return; }
    m.remove(); aviso('Chuva lançada'); telaChuvas();
  };
}

// ---------- Usuários ----------
async function telaUsuarios(){
  const fid = E.fazenda.id;
  const {data:mem} = await sb.from('fazenda_usuarios').select('usuario_id,papel').eq('fazenda_id', fid);
  const ids = (mem||[]).map(m => m.usuario_id);
  const {data:perfis} = ids.length ? await sb.from('perfis').select('id,nome,email').in('id', ids) : {data:[]};
  const nomes = {admin:'Administrador', gerente:'Gerente', operador:'Operador (lança)', consulta:'Só consulta'};
  $('#corpo').innerHTML = `
    <div class="topo"><button class="voltar" id="volta">←</button><h2>Usuários – ${esc(E.fazenda.nome)}</h2></div>
    <div class="tabela"><table><thead><tr><th>Nome</th><th>Email</th><th>Acesso</th><th></th></tr></thead><tbody>
    ${(mem||[]).map(m => { const p = (perfis||[]).find(x => x.id === m.usuario_id) || {};
      return `<tr><td>${esc(p.nome)}</td><td>${esc(p.email)}</td><td><select data-u="${m.usuario_id}" class="papel">${Object.entries(nomes).map(([k,v]) => `<option value="${k}" ${k===m.papel?'selected':''}>${v}</option>`).join('')}</select></td>
      <td>${m.usuario_id !== E.usuario.id ? `<button class="btn perigo peq" data-r="${m.usuario_id}">Remover</button>` : ''}</td></tr>`; }).join('') || '<tr><td colspan="4" class="vazio">Só administradores gerais têm acesso</td></tr>'}
    </tbody></table></div>
    <div class="secao">Liberar acesso</div>
    <div class="tabela" style="padding:12px">
      <div class="rodape" style="margin-top:0">A pessoa cria a conta no app primeiro. Depois você libera pelo email dela.</div>
      <label>Email</label><input id="uemail" type="email">
      <label>Acesso</label><select id="upapel">${Object.entries(nomes).map(([k,v]) => `<option value="${k}" ${k==='operador'?'selected':''}>${v}</option>`).join('')}</select>
      <label class="chk"><input type="checkbox" id="utodas"> Liberar em todas as fazendas</label>
      <div class="acoes"><button class="btn" id="uadd">Liberar acesso</button></div><div id="umsg"></div></div>`;
  $('#volta').onclick = () => ir('inicio');
  document.querySelectorAll('.papel').forEach(s => s.onchange = async () => {
    const r = await sb.from('fazenda_usuarios').update({papel:s.value}).eq('fazenda_id', fid).eq('usuario_id', s.dataset.u);
    aviso(r.error ? r.error.message : 'Acesso alterado');
  });
  document.querySelectorAll('[data-r]').forEach(b => b.onclick = async () => {
    if (!confirm('Remover o acesso desta pessoa nesta fazenda?')) return;
    await sb.from('fazenda_usuarios').delete().eq('fazenda_id', fid).eq('usuario_id', b.dataset.r); telaUsuarios();
  });
  $('#uadd').onclick = async () => {
    const email = $('#uemail').value.trim(), papel = $('#upapel').value;
    const alvo = $('#utodas').checked ? E.fazendas : [E.fazenda];
    let msg = '';
    for (const f of alvo) { const r = await sb.rpc('adicionar_usuario_fazenda', {f:f.id, e:email, p:papel}); msg = r.error ? r.error.message : r.data; if (msg !== 'ok') break; }
    if (msg === 'ok') { aviso('Acesso liberado'); telaUsuarios(); } else $('#umsg').innerHTML = `<div class="msg erro">${esc(msg)}</div>`;
  };
}

sb.auth.onAuthStateChange((ev) => { if (ev === 'SIGNED_IN' && !E.usuario) carregarUsuario(); if (ev === 'PASSWORD_RECOVERY') novaSenha(); });
async function novaSenha(){
  const s = prompt('Digite a nova senha (mínimo 6 caracteres):');
  if (s) { const r = await sb.auth.updateUser({password:s}); alert(r.error ? traduzErro(r.error.message) : 'Senha alterada.'); }
}
carregarUsuario();
</script>
