.mcBox{display:flex;align-items:center;gap:6px;border:1px solid var(--borda);border-radius:10px;background:#fff;padding:10px 12px;min-height:44px;box-sizing:border-box;cursor:pointer;font-weight:600;text-transform:uppercase;font-size:14px}

const SUPABASE_URL = 'https://jmdjoofjetjcwhpfgyiv.supabase.co';
const SUPABASE_KEY = 'sb_publishable_KuP1vwLUWIAqNDpDdgatxQ_fSkBxhZ1';

const E = {usuario:null, perfil:null, fazendas:[], fazenda:null, papel:null, tela:'inicio', grupo:null};
try { const v = JSON.parse(sessionStorage.getItem('fjk_volta') || 'null'); if (v) { sessionStorage.removeItem('fjk_volta'); E.tela = v.tela || 'inicio'; E.grupo = v.grupo || null; } } catch(e) {}
const $ = s => document.querySelector(s);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtNum = (v, d=2) => v == null || v === '' ? '' : Number(v).toLocaleString('pt-BR', {minimumFractionDigits:d, maximumFractionDigits:d});
const fmtData = v => { if(!v) return ''; const d = new Date(v); return isNaN(d) ? '' : d.toLocaleDateString('pt-BR', {day:'2-digit',month:'2-digit',year:'numeric'}); };
// perguntas e avisos no padrão do sistema (no lugar das janelas do aparelho/navegador)
function dlgSis(msg, botoes, entrada){ return new Promise(res => {
  const m = document.createElement('div'); m.className = 'modal'; m.style.zIndex = 100005;
  m.innerHTML = `<div class="caixa" style="max-width:460px"><div style="white-space:pre-line;font-size:16px;line-height:1.45;color:#1f3d1c">${esc(String(msg ?? ''))}</div>`
    + (entrada != null ? `<input id="dlg_in" style="width:100%;margin-top:12px" value="${esc(String(entrada))}">` : '')
    + `<div class="acoes">${botoes.map((b, i) => `<button type="button" class="btn ${b.c || ''}" data-i="${i}">${b.t}</button>`).join('')}</div></div>`;
  document.body.appendChild(m); try { window.tnFechar && window.tnFechar(); } catch(e) {}
  const fim = v => { m.remove(); res(v); }, inp = m.querySelector('#dlg_in');
  m.querySelectorAll('[data-i]').forEach(b => b.onclick = () => fim(botoes[+b.dataset.i].v === 'in' ? (inp ? inp.value : '') : botoes[+b.dataset.i].v));
  m.addEventListener('click', e => { if (e.target === m) fim(botoes[0].v === 'in' ? null : botoes[0].v === true ? true : botoes.length > 1 ? (entrada != null ? null : false) : undefined); });
  if (inp) { setTimeout(() => inp.focus(), 50); inp.addEventListener('keydown', e => { if (e.key === 'Enter') fim(inp.value); }); }
  else setTimeout(() => m.querySelector('[data-i]:last-child')?.focus(), 50);
}); }
const confirma = msg => dlgSis(msg, [{t:'Cancelar', c:'sec', v:false}, {t:'Confirmar', v:true}]);
const pergunta = (msg, ini) => dlgSis(msg, [{t:'Cancelar', c:'sec', v:null}, {t:'OK', v:'in'}], ini ?? '');
const avisoModal = msg => dlgSis(msg, [{t:'OK', v:undefined}]);
function aviso(t){ const a=$('#aviso'); const er=/n[ãa]o (foi|é|há|pode|consegu)|erro|inv[áa]lid|informe|selecione|falh|sem permiss/i.test(t); a.classList.toggle('erro', er); a.innerHTML=`<span class="avIc">${er ? '⚠️' : '✅'}</span>${esc(t)}`; a.style.display='block'; { const tk = document.getElementById('tecNum'); const h = tk && tk.classList.contains('on') ? tk.getBoundingClientRect().top : 0; a.style.top = h > 0 ? Math.max(a.offsetHeight / 2 + 8, h / 2) + 'px' : ''; } /* com o teclado numérico aberto, o aviso fica acima dele */ clearTimeout(a._t); a._t=setTimeout(()=>a.style.display='none', er ? 3500 : 2200); }
const podeEditar = () => E.perfil?.admin || ['admin','gerente','operador'].includes(E.papel);
const ehAdmin = () => E.perfil?.admin || E.papel === 'admin';

// ---------- Login ----------
function telaLogin(modo='entrar', msg=''){
  const titulos = {entrar:'Entrar', criar:'Criar conta', esqueci:'Recuperar senha'};
  $('#app').innerHTML = `
  <div class="login">
    <img class="logo-fjk" src="${LOGO_FJK}" alt="FJK Agropecuária">
    <h2>FJK Agropecuária</h2>
    <p>${titulos[modo]}</p>
    ${modo==='criar' ? '<label>Seu nome</label><input id="lnome" autocomplete="name">' : ''}
    <label>Email</label><input id="lemail" type="email" autocomplete="email">
    ${modo!=='esqueci' ? `<label>Senha</label><input id="lsenha" type="password" autocomplete="${modo==='criar'?'new-password':'current-password'}">` : ''}
    <div class="acoes"><button class="btn" id="lbtn">${titulos[modo]}</button></div>
    ${msg}
    ${modo==='entrar' ? '<button class="link" data-m="criar">Criar conta</button><button class="link" data-m="esqueci">Esqueci a senha</button>' : '<button class="link" data-m="entrar">Voltar para entrar</button>'}
  </div>`;
  document.querySelectorAll('.link').forEach(b => b.onclick = () => telaLogin(b.dataset.m));
  $('#lbtn').onclick = async () => {
    const email = $('#lemail').value.trim(), senha = $('#lsenha')?.value || '';
    $('#lbtn').disabled = true;
    let r;
    if (modo==='entrar') r = await sb.auth.signInWithPassword({email, password:senha});
    else if (modo==='criar') r = await sb.auth.signUp({email, password:senha, options:{data:{nome:$('#lnome').value.trim()}, emailRedirectTo: location.href.split('#')[0]}});
    else r = await sb.auth.resetPasswordForEmail(email, {redirectTo: location.href.split('#')[0]});
    if (r.error) return telaLogin(modo, `<div class="msg erro">${esc(traduzErro(r.error.message))}</div>`);
    if (modo==='criar' && !r.data.session) return telaLogin('entrar', '<div class="msg ok">Conta criada. Abra o email de confirmação e depois entre aqui.</div>');
    if (modo==='esqueci') return telaLogin('entrar', '<div class="msg ok">Enviamos um link para o seu email.</div>');
  };
}
function traduzErro(m){
  if (/Invalid login/i.test(m)) return 'Email ou senha incorretos.';
  if (/Email not confirmed/i.test(m)) return 'Confirme o email antes de entrar (veja sua caixa de entrada).';
  if (/at least 6/i.test(m)) return 'A senha precisa ter pelo menos 6 caracteres.';
  if (/already registered/i.test(m)) return 'Esse email já tem conta. Use "Entrar".';
  return m;
}

// ---------- Início ----------
async function carregarUsuario(){
  let user = null;
  try { ({data:{user}} = await sb.auth.getUser()); } catch(e) {}
  // sem internet: usa o login guardado no aparelho
  if (!user) { try { const {data:{session}} = await sb.auth.getSession(); if (session?.user && (!navigator.onLine || true)) user = session.user; } catch(e) {} }
  E.usuario = user;
  if (!user) return telaLogin();
  const {data:perfil} = await sb.from('perfis').select('*').eq('id', user.id).single();
  E.perfil = perfil;
  const {data:faz} = await sb.from('fazendas').select('*').eq('ativo', true).order('nome');
  E.fazendas = ordFaz(faz || []);
  const salva = localStorage.getItem('fjk_fazenda');
  E.fazenda = E.fazendas.find(f => f.id === salva) || E.fazendas[0] || null;
  await carregarPapel();
  render();
  setTimeout(() => SYNC.todas(), 2000);
}
async function carregarPapel(){
  E.papel = null;
  if (!E.fazenda) return;
  const {data} = await sb.from('fazenda_usuarios').select('papel').eq('fazenda_id', E.fazenda.id).eq('usuario_id', E.usuario.id).maybeSingle();
  E.papel = data?.papel || (E.perfil?.admin ? 'admin' : null);

// ===== análise: plano de movimentações para ajustar a lotação à taxa desejada =====
// critérios: move o lote inteiro sempre que possível (menos manejo); vaca parida vai junto com o bezerro mamando; não mistura machos com fêmeas;
// prefere destino que já tem a mesma categoria, depois o mesmo módulo, depois o que fica mais perto da meta; o que não couber vira "excesso sem destino"
function analisarLotacao(args){ const {S, modo, modDe, far, voltar} = args; let linhas = args.linhas; S.aceitos ??= {};
  const num = v => { v = String(v ?? '').trim(); if (!v) return null; if (v.includes(',')) v = v.replace(/\./g, '').replace(',', '.'); const x = Number(v); return isNaN(x) ? null : x; };
  // só entram as áreas marcadas no filtro (num módulo, as áreas desmarcadas ficam fora, com o gado delas)
  if (far && far.length) linhas = linhas.map(l => { const ars = (l.ars || []).filter(a => far.includes(a.codigo)); if (ars.length === (l.ars || []).length) return l;
    const ids = new Set(ars.map(a => a.id)), lotes = (l.lotes || []).filter(x => ids.has(x.area_id));

const ATU = {
  nova:null, ult:Date.now(),
  iniciar(){
    if (!/^v\d+$/.test(VERSAO) || ATU._ok) return; ATU._ok = true;
    ['click','keydown','input','touchstart','change'].forEach(ev => document.addEventListener(ev, e => {
      ATU.ult = Date.now(); if ((ev === 'input' || ev === 'change') && e.target?.closest?.('#corpo .caixa, .modal, #corpo form, #corpo .filtros, #corpo')) E.sujo = true; }, true));
    const ver = async () => { try { const t = await (await fetch(location.pathname + '?v=' + Date.now(), {cache:'no-store'})).text();
      const v = (t.match(/const VERSAO = "(v\d+)"/) || [])[1]; if (v && v !== VERSAO) { ATU.nova = v;
        // na tela inicial (ou logo ao abrir o app) atualiza na hora
        ATU.recarregarSePossivel(E.tela === 'inicio' || Date.now() - ATU.t0 < 20000); return true; } } catch(e) {} return false; };
    ATU.ver = ver; ATU.t0 = Date.now();
    setInterval(ver, 60000); setTimeout(ver, 1500);
    document.addEventListener('visibilitychange', () => { if (!document.hidden) ver(); });
    setInterval(() => ATU.recarregarSePossivel(false), 5000);
  },
  recarregarSePossivel(navegando){
    if (!ATU.nova || !E.usuario) return false;
    if (document.querySelector('.modal') || FILA._rodando) return false;

      if (E.sujo || Date.now() - ATU.ult < 30000) return false;
      const a = document.activeElement; if (a && /INPUT|TEXTAREA|SELECT/.test(a.tagName)) return false;
      if (/^(curral|manejo|pesagem|importpeso|neg_|apartacao|lancar|lancrep)/.test(String(E.tela))) return false;
    }
    try { sessionStorage.setItem('fjk_volta', JSON.stringify({tela:E.tela, grupo:E.grupo})); } catch(e) {}
    // endereço novo (?v=) para o navegador não reaproveitar a página antiga guardada em cache
    const nv = ATU.nova; ATU.nova = null; location.replace(location.pathname + '?v=' + nv + '-' + Date.now()); return true;
  }
};

const SO_FAZENDA = ['importplan','pendencias','culturas','racas','tags','mapa','curral','lancar','estoque','lotacao','historico','animais','pesagem','manejo','histind','matrizes','lancrep','histrep','estinsumos','estmov','opagri','chuvas','areas','modulos','categorias','produtos','locais','safras','apartacao','importpeso','agendarep','procedimentos','iatf','gmd','evolucao','neg_Venda','neg_Abate','neg_Compra','neg_Transferência','movreb','avalotacao'];
async function telaInicio(){
  // botões só com ícone e título; o texto de baixo aparece só quando é um aviso (ex.: notas novas)
  const q = (id, ic, nome, sub) => `<div class="quad" data-t="${id}"><div class="ic">${ic}</div><b>${nome}</b>${/vermelho/.test(String(sub)) ? `<span>${sub}</span>` : ''}</div>`;
  const sair = '';
  const ligar = () => {
    document.querySelectorAll('.quad[data-t]').forEach(d => d.onclick = () => ir(d.dataset.t));
    document.querySelectorAll('.quad[data-g],.mbt[data-g]').forEach(d => d.onclick = () => ir('g_' + d.dataset.g));
    document.querySelectorAll('.mbt[data-t]').forEach(d => d.onclick = () => ir(d.dataset.t));
    document.querySelectorAll('.quad[data-faz]').forEach(d => d.onclick = async () => { E.fazenda = E.fazendas.find(f => f.id === d.dataset.faz); localStorage.setItem('fjk_fazenda', E.fazenda.id); await carregarPapel(); cacheBase = null; ir('inicio'); });
  };
  if (ehGestao()) return telaInicioGestao(q, sair, ligar);
  $('#corpo').innerHTML = `<div class="menuP principal"><div class="mbt" data-t="mapa" style="background:#6b7780"><span>🗺️</span>Mapa</div><div class="mbt" data-t="curral" style="background:#3f8f8a"><span>🐂</span>Manejos</div>
    ${Object.entries(GRUPOS).map(([k,g]) => `<div class="mbt" data-g="${k}" style="background:${g.cor || '#2e7d32'}"><span>${g.ic}</span>${g.nome}</div>`).join('')}
    <div class="mbt" data-t="pendencias" style="background:#c62828"><span>⚠️</span><div>Pendências<small id="pendN" style="display:none;font-size:13px;font-weight:800;background:#fff;color:#c62828;border-radius:8px;padding:2px 8px;margin-left:6px"></small></div></div></div>`;
  ligar();
  sb.from('pendencias').select('*', {count:'exact', head:true}).eq('fazenda_id', E.fazenda.id).eq('resolvida', false).then(r => { const n = r.count || 0, b = $('#pendN'); if (b && n) { b.textContent = n; b.style.display = ''; } });
}

// pendências da fazenda: ficam até serem marcadas como resolvidas
async function telaPendencias(){
  $('#corpo').innerHTML = '<div class="vazio">Carregando…</div>';
  let verRes = false;
  const carregar = async () => {
    const {data} = await sb.from('pendencias').select('*').eq('fazenda_id', E.fazenda.id).eq('resolvida', verRes).order('data', {ascending:false}).order('criado_em', {ascending:false});
    const B = await baseFazenda();
    $('#lista').innerHTML = (data || []).map(p => `<div class="caixaP" style="border:1.5px solid ${verRes ? '#cfd8cb' : '#f2b8b5'};border-radius:12px;padding:12px;margin:0 0 10px;background:${verRes ? '#f6f8f4' : '#fff8f7'}">
        <div style="display:flex;justify-content:space-between;gap:8px;align-items:flex-start"><b style="color:${verRes ? '#4b5a48' : '#c62828'}">${esc(p.titulo)}</b><span class="rodape" style="white-space:nowrap;margin:0">${p.data ? fmtData(p.data + 'T12:00:00') : ''}</span></div>
        <div style="margin:6px 0">${esc(p.descricao || '')}</div>
        <div class="rodape" style="margin:0">${esc(p.tipo || '')}${p.area_id && B.areaPor[p.area_id] ? ' · Área ' + esc(B.areaPor[p.area_id]) : ''}${p.quantidade ? ' · ' + fmtNum(p.quantidade,0) + ' animal(is)' : ''}</div>
        ${verRes ? `<div class="rodape" style="margin:6px 0 0">Resolvida em ${p.resolvida_em ? fmtData(p.resolvida_em) : ''}${p.observacao_resolucao ? ' · ' + esc(p.observacao_resolucao) : ''}</div>`
          : podeEditar() ? `<div style="margin-top:10px"><button class="btn" data-res="${p.id}" style="width:100%">✓ Marcar como resolvida</button></div>` : ''}</div>`).join('')
      || `<div class="vazio">${verRes ? 'Nenhuma pendência resolvida.' : 'Nenhuma pendência em aberto.'}</div>`;
    document.querySelectorAll('[data-res]').forEach(b => b.onclick = async () => {
      if (!(await confirmaSimVoltar('Confirma que esta pendência foi resolvida?'))) return;
      const r = await sb.from('pendencias').update({resolvida:true, resolvida_em:new Date().toISOString(), resolvida_por:E.usuario.id}).eq('id', b.dataset.res);
      if (r.error) return aviso('Não foi possível atualizar: ' + r.error.message); aviso('Pendência resolvida'); carregar(); });
  };
  $('#corpo').innerHTML = `<div class="topo"><button class="voltar" id="volta">←</button><h2>Pendências – ${esc(E.fazenda.nome)}</h2>${podeEditar() ? '<button class="btn" id="novo">+ Nova pendência</button>' : ''}</div>
    <div class="mdBar mdFino" style="margin:0 0 10px"><button class="btn mdD" data-v="0">Em aberto</button><button class="btn sec" data-v="1" style="background:#fff;color:#2e5b31;border:1.5px solid #2e6b34">Resolvidas</button></div>
    <div id="lista"></div>`;
  $('#volta').onclick = () => ir('inicio');
  document.querySelectorAll('[data-v]').forEach(b => b.onclick = () => { verRes = b.dataset.v === '1';
    document.querySelectorAll('[data-v]').forEach(x => { const on = x === b; x.style.background = on ? (x.dataset.v === '1' ? '#2e7d32' : '#c62828') : '#fff'; x.style.color = on ? '#fff' : (x.dataset.v === '1' ? '#2e5b31' : '#c62828'); x.style.border = '1.5px solid ' + (x.dataset.v === '1' ? '#2e6b34' : '#c62828'); });
    carregar(); });
  if ($('#novo')) $('#novo').onclick = () => { const m = document.createElement('div'); m.className = 'modal';
    m.innerHTML = `<div class="caixa" style="max-width:520px"><h3>Nova pendência</h3><label>Data *</label><input id="pd_dt" type="date" value="${hojeISO()}" style="max-width:220px"><label>Título *</label><input id="pd_t" style="width:100%"><label>Descrição</label><textarea id="pd_d" rows="5" style="resize:vertical;width:100%"></textarea>
      <div class="msg erro" id="pd_e" style="display:none"></div><div class="mdBar" style="margin-top:12px"><button class="btn mdD" id="pd_c">Cancelar</button><button class="btn mdM" id="pd_s">Salvar</button></div></div>`;
    document.body.appendChild(m); m.querySelector('#pd_c').onclick = () => m.remove();
    m.querySelector('#pd_s').onclick = async () => { const t = m.querySelector('#pd_t').value.trim(), dt = m.querySelector('#pd_dt').value; if (!dt) { m.querySelector('#pd_e').textContent = 'Informe a data'; m.querySelector('#pd_e').style.display = 'block'; return; } if (!t) { m.querySelector('#pd_e').textContent = 'Informe o título'; m.querySelector('#pd_e').style.display = 'block'; return; }
      const r = await sb.from('pendencias').insert({fazenda_id:E.fazenda.id, tipo:'Geral', titulo:t, descricao:m.querySelector('#pd_d').value.trim(), data:dt});
      if (r.error) { m.querySelector('#pd_e').textContent = r.error.message; m.querySelector('#pd_e').style.display = 'block'; return; } m.remove(); aviso('Pendência registrada'); carregar(); }; };
  carregar();
}

async function telaInicioGestao(q, sair, ligar){
  const fazendas = E.fazendas.filter(f => !f.sede_financeiro);
  const fz = E.fazenda.id;
  const venc = async t => (await sb.from('lancamentos_financeiros').select('*', {count:'exact', head:true}).eq('fazenda_id', fz).eq('tipo', t).eq('status', 'Em aberto').lt('vencimento', hojeISO())).count ?? 0;
  const [venP, venR, nNovas] = await Promise.all([venc('Pagar'), venc('Receber'),
    sb.from('notas_fiscais').select('*', {count:'exact', head:true}).eq('fazenda_id', fz).eq('status', 'Nova').then(r => r.count ?? 0)]);
  const resumo = await Promise.all(fazendas.map(async f => {
    const [lts, ha, ani, pren] = await Promise.all([
      todas(() => sb.from('lotes').select('area_id,quantidade,peso_medio,data_peso,data_entrada,categoria_id,categorias_manejo(nome,gmd_projetado,peso_referencia)').eq('fazenda_id', f.id)),
      todas(() => sb.from('areas').select('id,hectares,area_efetiva_pct,ativo,tipo_uso').eq('fazenda_id', f.id)),
      sb.from('animais').select('*', {count:'exact', head:true}).eq('fazenda_id', f.id).eq('ativo', true).then(r => r.count ?? 0),
      sb.from('animais').select('*', {count:'exact', head:true}).eq('fazenda_id', f.id).eq('ativo', true).eq('situacao_reprodutiva', 'Prenhe').then(r => r.count ?? 0)]);
    // peso projetado de cada lote (último peso + GMD da categoria até hoje), para a lotação em UA (450 kg)
    lts.forEach(l => { const g = Number(l.categorias_manejo?.gmd_projetado) || 0, d0 = l.data_peso || l.data_entrada, pm = Number(l.peso_medio) || 0;
      const rf = !pm ? Number(l.categorias_manejo?.peso_referencia) || 0 : 0, b = pm || rf, dd = pm ? d0 : l.data_entrada;
      l._p = b && g && dd ? b + g * Math.max(0, diasDesde(String(dd).slice(0,10))) : b; });
    // confinamento fica numa linha própria ("<fazenda> Conf"), separado dos pastos
    const conf = new Set(ha.filter(a => a.tipo_uso === 'Confinamento').map(a => a.id));
    const linha = (nome, ls, as) => ({f, nome, lts: ls, cab: ls.reduce((s,l) => s + l.quantidade, 0), ha: as.filter(a => a.ativo !== false && USO_LOT(a.tipo_uso)).reduce((s,a) => s + Number(a.hectares||0) * (Number(a.area_efetiva_pct ?? 100) || 100) / 100, 0), ani, pren});
    const ls = [linha(f.nome, lts.filter(l => !conf.has(l.area_id)), ha.filter(a => !conf.has(a.id)))];
    const lc = linha(f.nome + ' Conf', lts.filter(l => conf.has(l.area_id)), ha.filter(a => conf.has(a.id)));
    if (lc.cab > 0) ls.push(lc);
    return ls;
  })).then(x => x.flat());
  // lote sem peso: usa a média projetada da mesma categoria na fazenda; senão a da categoria (mesmo nome) nas outras fazendas; senão a média da fazenda
  { const med = l => { const q = l.reduce((s, x) => s + Number(x.quantidade || 0), 0); return q ? l.reduce((s, x) => s + Number(x.quantidade || 0) * x._p, 0) / q : 0; };
    const todos = resumo.flatMap(r => r.lts.filter(l => l._p > 0 && l.quantidade > 0));
    resumo.forEach(r => { const com = r.lts.filter(l => l._p > 0 && l.quantidade > 0); r.est = 0;
      r.kg = r.lts.reduce((s, l) => { if (!(l.quantidade > 0)) return s; if (l._p > 0) return s + l.quantidade * l._p;

// grade automática nos quadros de lançamento: campos pequenos lado a lado (2 ou 3 por linha)
const ehCampo = e => e && /^(INPUT|SELECT|TEXTAREA)$/.test(e.tagName) && e.type !== 'checkbox' && e.type !== 'hidden' && e.type !== 'file';
function larguraAuto(f, rot){
  let w;
  if (f.tagName === 'TEXTAREA') w = 6;
  else if (['date','number','time','month','color'].includes(f.type) || /numeric|decimal/.test(f.inputMode || f.getAttribute('inputmode') || '')) w = 2;
  else if (f.tagName === 'SELECT') w = Math.max(...[...f.options].map(o => o.text.length), 0) > 24 ? 3 : 2;
  else w = 3;
  if ((rot || '').length > 26 && w < 3) w = 3;
  if (/^Observa|^Descri|^Hist[oó]rico/i.test((rot || '').trim())) w = 6;
  return w;
}
function gradeAuto(cx){
  if (!cx || cx.dataset.grade) return; cx.dataset.grade = '1';
  let grid = null;
  const celula = (cel, campo, rot) => { const w = larguraAuto(campo, rot); cel.classList.add('fc'); cel.dataset.w = w; cel.style.setProperty('--w', w);
    if (!grid) { grid = document.createElement('div'); grid.className = 'fgrid auto'; cel.before(grid); } grid.appendChild(cel); };
  for (const el of [...cx.children]) {
    if (!el.isConnected || el.parentElement !== cx) continue;
    if (el.tagName === 'LABEL' && !el.classList.contains('chk') && ehCampo(el.nextElementSibling)) {
      const campo = el.nextElementSibling, cel = document.createElement('div'); el.before(cel); cel.append(el, campo); celula(cel, campo, el.textContent);
    } else if (el.tagName === 'DIV' && !el.className && el.children.length === 2 && el.children[0].tagName === 'LABEL' && ehCampo(el.children[1])) {
      celula(el, el.children[1], el.children[0].textContent);
    } else if (el.tagName === 'LABEL' && el.classList.contains('chk')) {
      const cel = document.createElement('div'); el.before(cel); cel.append(el); cel.classList.add('fc'); cel.dataset.w = 3; cel.style.setProperty('--w', 3);
      if (!grid) { grid = document.createElement('div'); grid.className = 'fgrid auto'; cel.before(grid); } grid.appendChild(cel);
    } else grid = null;
  }
}

    if (pts.length > 2) mapa.fitBounds(L.polygon(pts).getBounds(), {padding:[30,30]});
    else if (ref.getLayers().length) mapa.fitBounds(ref.getBounds(), {padding:[10,10]});
    else mapa.setView([-5.5,-48.5], 12); }, 150);

async function formCadastro(chave, reg){
  const C = CAD[chave];
  for (const [, , o={}] of C.campos) if (o.ref && C.porFazenda) await carregarRef(o.ref);
  const pode = chave === 'fazendas' ? ehAdmin() : podeEditar();
  const m = document.createElement('div'); m.className = 'modal';
  m.innerHTML = `<div class="caixa"><h3>${reg ? 'Editar' : 'Novo'} – ${C.titulo}</h3>
    ${gradeCampos(C.campos, reg)}
    ${chave === 'areas' ? '<div id="f_editor"></div>' : ''}
    ${reg?.criado_em ? `<div class="rodape">Cadastrado em ${fmtData(reg.criado_em)}</div>` : ''}
    <div class="msg erro" id="ferro" style="display:none"></div>
    <div class="acoes"><button class="btn sec" id="fcan">Cancelar</button>${pode ? '<button class="btn" id="fsal">Salvar</button>' : ''}${reg && ehAdmin() && chave !== 'fazendas' ? '<button class="btn perigo" id="fexc">Excluir</button>' : ''}</div>
    </div>`;
  document.body.appendChild(m);
  if (!pode) m.querySelectorAll('input,select').forEach(i => i.disabled = true);
  m.querySelector('#fcan').onclick = () => m.remove();
  // categoria: o sexo filtra a categoria oficial
  const fSexo = m.querySelector('#f_sexo'), fOf = chave === 'categorias' && m.querySelector('#f_categoria_oficial');
  if (fSexo && fOf) { const todas = [...fOf.options].map(o => o.value);
    const filtra = () => { const sx = fSexo.value, atual = fOf.value, ok = todas.filter(v => !sx || /Bezerr/.test(v) || (sx === 'M' ? /Mach|Touro/.test(v) : /Fêm|Novilh|Vaca/.test(v)));
      fOf.innerHTML = ok.map(v => `<option ${v===atual?'selected':''}>${esc(v)}</option>`).join(''); if (!ok.includes(atual)) fOf.value = ok[0] || ''; };
    fSexo.onchange = filtra; filtra(); }
  // produto: campos de vacina só aparecem para Medicamentos e Vacinas
  const fUso = chave === 'produtos' && m.querySelector('#f_tipo_uso');
  if (fUso) { const vac = () => { const v = fUso.value === 'Medicamentos e Vacinas'; m.querySelectorAll('[data-sec="vac"], .fc[data-k="dose_animal"], .fc[data-k="carencia_dias"], .fc[data-k="local_padrao_id"]').forEach(e => e.style.display = v ? '' : 'none'); };
    fUso.addEventListener('change', vac); vac(); }
  if (chave !== 'areas') m.onclick = e => { if (e.target === m) m.remove(); };
  let pegaDesenho = null;
  if (chave === 'areas') {
    m.querySelector('.caixa').style.maxWidth = '760px';
    const ha = m.querySelector('#f_hectares'); let haManual = !!(reg && Number(reg.hectares) > 0 && !(Array.isArray(reg.geometria) && reg.geometria.length > 2));
    if (ha) ha.addEventListener('input', () => haManual = true);
    pegaDesenho = await editorArea(m.querySelector('#f_editor'), reg, pts => { if (ha && !haManual && pts.length > 2) ha.value = haPoligono(pts).toFixed(2); });
    if (!pode) m.querySelector('#f_editor').style.pointerEvents = 'none';
  }
  const erro = t => { const d = m.querySelector('#ferro'); d.textContent = t; d.style.display = 'block'; };
  if (pode) m.querySelector('#fsal').onclick = async () => {
    const obj = {};
    for (const [k, rot, o={}] of C.campos) {
      if (k === '#') continue;
      const el = m.querySelector('#f_'+k);
      let v = o.tipo === 'bool' ? el.checked : el.value.trim();
      if (o.tipo === 'number') v = v === '' ? 0 : Number(v.replace(',', '.'));
      if (o.ref || o.tipo === 'date' || (o.op && v === '')) v = v || null;
      if (o.obr && !v) return erro(`Preencha: ${rot}`);
      obj[k] = v;
    }
    if (C.porFazenda) obj.fazenda_id = fazCad(C);
    if (C.codigoIgualNome) obj.codigo = obj.nome;
    if (pegaDesenho) { const pts = pegaDesenho(); if (pts.length > 0 && pts.length < 3) return erro('O desenho precisa de pelo menos 3 pontos (ou limpe o desenho)');
      obj.geometria = pts.length ? pts.map(p => [Math.round(p[0]*1e7)/1e7, Math.round(p[1]*1e7)/1e7]) : null; }
    if (C.fin) FIN = null; cacheBase = null;
    const r = reg ? await sb.from(C.tabela).update(obj).eq('id', reg.id) : await sb.from(C.tabela).insert(obj);
    if (r.error) return erro(/duplicate/.test(r.error.message) ? 'Já existe um cadastro com esse código/nome.' : r.error.message);
    m.remove(); aviso('Salvo');
    if (chave === 'fazendas') { const {data} = await sb.from('fazendas').select('*').eq('ativo',true).order('nome'); E.fazendas = ordFaz(data||[]); if(!E.fazenda) E.fazenda = E.fazendas[0]; await carregarPapel(); }
    render();
  };
  const exc = m.querySelector('#fexc');
  if (exc) exc.onclick = async () => {
    if (!await confirma('Excluir este cadastro? Não dá para desfazer.')) return;
    const r = await sb.from(C.tabela).delete().eq('id', reg.id);
    if (r.error) return erro(/foreign key/.test(r.error.message) ? 'Não dá para excluir: este cadastro está sendo usado.' : r.error.message);
    m.remove(); aviso('Excluído'); render();
  };
}

function baixarCSV(nome, cab, linhas){
  const cel = v => { const s = String(v ?? ''); return /[;"\n]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s; };
  const txt = '\ufeff' + [cab, ...linhas].map(l => l.map(cel).join(';')).join('\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([txt], {type:'text/csv;charset=utf-8'}));
  a.download = `${nome} - ${E.fazenda?.nome || ''} - ${fmtData(new Date()).replace(/\//g,'-')}.csv`;
  a.click();
}

document.addEventListener('click', e => {
  const th = e.target.closest('thead th'); if (!th || e.target.closest('input,button,select,a') || th.querySelector('input')) return;
  const tab = th.closest('table'), tb = tab?.tBodies[0], trh = th.parentElement; if (!tb || tab.dataset.propria) return;
  const i = [...trh.children].indexOf(th), rows = [...tb.rows];
  if (rows.length < 2 || rows.some(r => r.cells.length !== trh.children.length)) return;
  const dir = th.dataset.ord === 'asc' ? 'desc' : 'asc';
  trh.querySelectorAll('th').forEach(x => delete x.dataset.ord); th.dataset.ord = dir;
  const val = td => { const t = (td?.textContent || '').trim(); if (!t || t === '–' || t === '-') return null;
    const d = t.match(/^(\d{2})\/(\d{2})\/(\d{4})/); if (d) return +(d[3] + d[2] + d[1]);
    if (/\d/.test(t) && /^(R\$\s*)?[-+]?[\d.,\s]+\s*(%|kg|ha|@|d|cab)?\*?$/i.test(t)) { const n = parseFloat(t.replace(/[^\d,\-]/g, '').replace(',', '.')); if (!isNaN(n)) return n; }
    return t; };
  const k = dir === 'asc' ? 1 : -1;
  rows.sort((a, b) => { const x = val(a.cells[i]), y = val(b.cells[i]);
    if (x === null) return y === null ? 0 : 1; if (y === null) return -1;
    if (typeof x === 'number' && typeof y === 'number') return (x - y) * k;
    return String(x).localeCompare(String(y), 'pt', {numeric:true, sensitivity:'base'}) * k; });
  rows.forEach(r => tb.appendChild(r));
});

let PIND = {}, PIND_t = {};
async function carregarPesoInd(fid, gmdCat){ if (PIND[fid] && Date.now() - PIND_t[fid] < 300000) return PIND[fid]; const m = {};

      x.n++; x.s += Number(a.peso_atual) + (gmdCat[a.categoria_id] || 0) * Math.max(0, diasDesde(String(a.data_peso).slice(0,10)) || 0); });

async function carregarLotes(){

    <div class="acoes"><button class="btn sec" id="fp_x">Cancelar</button></div></div>`;
  document.body.appendChild(m);
  if (m.querySelector('#fp_obs')) { m.querySelector('#fp_obs').onclick = () => formObsCampo(a);
    m.querySelector('#fp_ef').onclick = () => formAreaEfetiva(a, () => { m.remove(); fichaPasto(a, ls, modulo, areas, porArea, modDe); });

  // histórico da área: entradas e saídas com o saldo de cabeças depois de cada uma

    const {data} = await sb.from('operacoes_rebanho').select('data,operacao,tipo,area_id,area_destino_id,categoria_nome,categoria_destino_nome,quantidade,peso_medio,criado_em')
      .or(`area_id.eq.${a.id},area_destino_id.eq.${a.id}`).gte('data', i0 || '1900-01-01').order('data', {ascending:false}).order('criado_em', {ascending:false}).limit(1000);
    const efeito = o => { const q = Number(o.quantidade) || 0;

  const info = (d, n) => { m.querySelector('#fi_data b').textContent = d ? fd(d) : '–'; m.querySelector('#fi_dias b').textContent = n ?? '–'; };

}

// medição do pasto: escore (1 a 5 estrelas) e/ou altura do capim em centímetros
function formMedicaoPasto(a){

function formAreaEfetiva(a, aoSalvar){
  const ha = Number(a.hectares) || 0, atual = Number(a.area_efetiva_pct ?? 100);
  const m = document.createElement('div'); m.className = 'modal';
  m.innerHTML = `<div class="caixa" style="max-width:620px"><h3>Área efetiva – ${esc(a.codigo)}</h3>
    <div class="grade" style="grid-template-columns:1fr 1fr;gap:8px">
      <div><label>Data</label><input id="ae_d" type="date" value="${hojeISO()}"></div><div><label>Área total (ha)</label><input value="${fmtNum(ha)}" disabled></div>
      <div><label>Área efetiva atual (%)</label><input value="${fmtNum(atual,0)}" disabled></div><div><label>Área efetiva atual (ha)</label><input value="${fmtNum(ha * atual / 100)}" disabled></div>
      <div><label>Área descoberta (%)</label><input id="ae_dp" disabled></div><div><label>Área descoberta (ha)</label><input id="ae_dh" disabled></div>
      <div><label>Área efetiva nova (%) *</label><input id="ae_p" type="number" step="0.01" min="0" max="100"></div><div><label>Área efetiva nova (ha) *</label><input id="ae_h" type="number" step="0.01" min="0"></div></div>
    <div class="tabela" style="margin-top:10px"><table><thead><tr><th>Data</th><th class="num">Área efetiva (%)</th></tr></thead><tbody id="ae_hist"><tr><td colspan="2" class="vazio">…</td></tr></tbody></table></div>
    <div class="acoes"><button class="btn sec" id="ae_x">Cancelar</button><button class="btn" id="ae_ok">Salvar</button></div></div>`;
  document.body.appendChild(m);
  const g = id => m.querySelector('#'+id), r2 = v => Math.round(v * 100) / 100;
  // área descoberta já vem calculada pela área efetiva atual; ao digitar a nova, ela acompanha
  const desc = p => { if (!isFinite(p)) p = Number(atual); g('ae_dp').value = isFinite(p) ? fmtNum(100 - p, 2) : ''; g('ae_dh').value = isFinite(p) ? fmtNum(ha * (100 - p) / 100, 2) : ''; };
  desc(NaN);
  g('ae_p').oninput = () => { const p = parseFloat(g('ae_p').value); g('ae_h').value = isFinite(p) ? r2(ha * p / 100) : ''; desc(p); };

const TIPOS_OBS = ['Pastagem','Cerca','Bebedouro / aguada','Cocho','Praga / planta invasora','Erosão','Animal','Outro'];
const fotoReduzida = arq => new Promise((ok, erro) => { const img = new Image(), rd = new FileReader();
  rd.onload = () => { img.onload = () => { const k = Math.min(1, 1280 / Math.max(img.width, img.height)); const c = document.createElement('canvas');
    c.width = Math.round(img.width * k); c.height = Math.round(img.height * k); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); ok(c.toDataURL('image/jpeg', .7)); };
    img.onerror = erro; img.src = rd.result; }; rd.onerror = erro; rd.readAsDataURL(arq); });

      ${podeEditar() ? `<button class="btn sec peq" data-del="${o.id}" title="Excluir">🗑</button>` : ''}</div>`).join('') || '<div class="rodape">Nenhuma observação registrada</div>';
    g('oc_hist').querySelectorAll('[data-zoom]').forEach(i => i.onclick = () => { const z = document.createElement('div'); z.className = 'modal'; z.innerHTML = `<img src="${i.src}" style="max-width:95vw;max-height:90vh;border-radius:10px">`; z.onclick = () => z.remove(); document.body.appendChild(z); });

// caixa de seleção com várias opções marcadas (check ao lado de cada uma); opções: texto ou {v, t}
function multiCheck(el, opcoes, rotTodos, rotPlural, ini){
  const norm = l => l.map(o => typeof o === 'object' ? {v:String(o.v), t:o.t} : {v:String(o), t:o});
  let ops = norm(opcoes), marc = new Set((ini || []).map(String)), cb = null, aberta = null, tm = null;
  el.innerHTML = `<div class="mcBox" tabindex="0"><span class="mcTxt"></span><span class="mcSeta">▾</span></div>`; el.style.position = 'relative';
  const box = el.querySelector('.mcBox'), txt = el.querySelector('.mcTxt');
  const rotulo = () => { const v = ops.filter(o => marc.has(o.v)), pf = el.dataset.prefixo; if (el.dataset.cheio && v.length === ops.length) { txt.textContent = rotTodos; return; } if (pf) { txt.innerHTML = `<b>${esc(pf)}:</b> ${esc(!v.length ? 'todas' : v.length <= 4 ? v.map(o => o.t).join(', ') : v.length + ' selecionadas')}`; return; } txt.textContent = !v.length ? rotTodos : v.length <= 2 ? v.map(o => o.t).join(', ') : `${v.length} ${rotPlural} selecionadas`; };
  const avisa = () => { rotulo(); clearTimeout(tm); tm = setTimeout(() => { if (cb) cb(); }, 120); };
  const fechar = () => { if (aberta) { aberta.remove(); aberta = null; document.removeEventListener('pointerdown', fora, true); } };
  const fora = e => { if (!el.contains(e.target)) fechar(); };
  // digitar filtra a lista; marcar/desmarcar todos vale para o que está aparecendo
  const visiveis = () => { const t = semAcento(aberta?.querySelector('.mcBusca')?.value || '').trim(); return ops.map((o, k) => [o, k]).filter(([o]) => !t || semAcento(o.t).includes(t)); };
  const desenhar = () => { aberta.querySelector('.mcItens').innerHTML = visiveis().map(([o, k]) => `<label class="mcOp"><input type="checkbox" data-k="${k}" ${marc.has(o.v) ? 'checked' : ''}> ${esc(o.t)}</label>`).join('') || '<div class="cb-vazio">Nada encontrado</div>'; };
  box.onclick = () => { if (aberta) return fechar(); if (api.antesAbrir) api.antesAbrir();
    aberta = document.createElement('div'); aberta.className = 'mcLista';
    aberta.innerHTML = `${ops.length > 1 ? '<div class="mcAc"><button type="button" class="mcT">Marcar todos</button><button type="button" class="mcN">Desmarcar todos</button></div>' : ''}${ops.length > 6 ? '<input class="mcBusca" placeholder="Digite para procurar" autocomplete="off">' : ''}<div class="mcItens"></div>`;
    el.appendChild(aberta); desenhar(); { const lr = aberta.getBoundingClientRect(); if (lr.right > window.innerWidth - 4) { aberta.style.left = 'auto'; aberta.style.right = '0'; } }
    const bu = aberta.querySelector('.mcBusca'); if (bu) { bu.oninput = desenhar; bu.onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); const v = visiveis(); if (v.length === 1) { const o = v[0][0]; marc.has(o.v) ? marc.delete(o.v) : marc.add(o.v); bu.value = ''; desenhar(); avisa(); } } else if (e.key === 'Escape') fechar(); }; if (!CB_TOQUE) setTimeout(() => bu.focus(), 0); }
    aberta.addEventListener('change', e => { const k = e.target.dataset.k; if (k == null) return; e.stopPropagation(); e.target.checked ? marc.add(ops[k].v) : marc.delete(ops[k].v); avisa(); });
    if (aberta.querySelector('.mcT')) aberta.querySelector('.mcT').onclick = () => { visiveis().forEach(([o]) => marc.add(o.v)); desenhar(); avisa(); };
    if (aberta.querySelector('.mcN')) aberta.querySelector('.mcN').onclick = () => { const v = visiveis(); if (v.length === ops.length) marc.clear(); else v.forEach(([o]) => marc.delete(o.v)); desenhar(); avisa(); };
    const r = box.getBoundingClientRect(); if (window.innerHeight - r.bottom < 220 && r.top > window.innerHeight - r.bottom) { aberta.style.top = 'auto'; aberta.style.bottom = (r.height + 2) + 'px'; }
    setTimeout(() => document.addEventListener('pointerdown', fora, true), 0); };
  rotulo();
  const api = {total: () => ops.length, todosVals: () => ops.map(o => o.v), valor: () => ops.filter(o => marc.has(o.v)).map(o => o.v), aoMudar: f => { cb = f; }, opcoes: l => { ops = norm(l); rotulo(); if (aberta) desenhar(); },
    definir: vs => { marc = new Set((vs || []).map(String)); rotulo(); if (aberta) desenhar(); }};
  return api;
}
// transforma um <select> de filtro em seleção múltipla; o select fica oculto (guarda as opções) e recebe "change" a cada marcação
function selMulti(sel, rotTodos, rotPlural){
  if (!sel || sel._mc) return sel && sel._mc; sel.dataset.cb = '1';
  if (sel.parentElement?.classList.contains('cb')) { const w = sel.parentElement; w.before(sel); w.remove(); }
  const ini = [...sel.options].filter(o => o.value && o.selected && o.hasAttribute('selected')).map(o => o.value);
  const el = document.createElement('div'); el.style.cssText = 'min-width:0;flex:' + (sel.dataset.flex || (sel.closest('.selMapa') ? '1' : '1 1 180px')); el.dataset.cheio = '1'; sel.before(el); sel.style.display = 'none';
  const lerOps = () => [...sel.options].filter(o => o.value).map(o => ({v:o.value, t:o.text}));
  const mc = multiCheck(el, lerOps(), rotTodos || (sel.options[0]?.value ? 'Todas' : sel.options[0]?.text) || 'Todas', rotPlural || 'opções', ini);

function pesoProjetado(a, evCat, gmdPor, ate){
  // animal sem pesagem: parte do peso de referência da categoria na data de entrada/cadastro
  if (!a.peso_atual || !a.data_peso) { const r = PREF[a.categoria_id], d0 = String(a.data_entrada || a.data_nascimento || a.criado_em || '').slice(0,10);
    if (!r || !d0) return null; a = {...a, peso_atual:r, data_peso:d0}; }
  ate = ate || hojeISO();
  const ev = (evCat || []).filter(e => e.categoria_id).sort((x,y) => x.data.localeCompare(y.data));
  let cat = ([...ev].reverse().find(e => e.data <= a.data_peso) || {}).categoria_id || (ev.find(e => e.data > a.data_peso) ? null : a.categoria_id) || a.categoria_id;
  let d = a.data_peso, p = Number(a.peso_atual);

  p += (gmdPor[cat] || 0) * dias(d, ate);
  return Math.round(p * 10) / 10;
}

// sugestões de mãe (fêmeas ativas acima de bezerra) e pai (machos externos, touros e sêmen já usados): aparecem abaixo do campo a partir de 2 dígitos
async function sugMaePai(m){
  const ins = [...m.querySelectorAll('#n_mae,#f_mae,#n_pai,#f_pai')];
  let L = {mae:[], pai:[]};
  ins.forEach(inp => {
    const tipo = /mae/.test(inp.id) ? 'mae' : 'pai', cx = inp.parentElement; cx.style.position = 'relative';
    const box = document.createElement('div'); box.className = 'sugB'; box.style.display = 'none'; cx.appendChild(box);
    const mostra = () => { const q = semAcento(inp.value.trim()); if (q.length < 2) { box.style.display = 'none'; return; }
      const r = L[tipo].filter(x => semAcento(x.v).includes(q)).sort((a, b) => (semAcento(a.v).startsWith(q) ? 0 : 1) - (semAcento(b.v).startsWith(q) ? 0 : 1) || a.v.localeCompare(b.v, 'pt-BR', {numeric:true})).slice(0, 50);
      box.innerHTML = r.length ? r.map(x => `<div data-v="${esc(x.v)}"><b>${esc(x.v)}</b>${x.d ? ` <span>${esc(x.d)}</span>` : ''}</div>`).join('') : '<div class="vz">Nenhum animal encontrado</div>';
      box.style.display = ''; };
    inp.addEventListener('input', mostra); inp.addEventListener('focus', mostra);
    inp.addEventListener('blur', () => setTimeout(() => box.style.display = 'none', 200));
    box.addEventListener('mousedown', e => { const d = e.target.closest('[data-v]'); if (!d) return; e.preventDefault(); inp.value = d.dataset.v; box.style.display = 'none'; inp.dispatchEvent(new Event('change', {bubbles:true})); });
  });
  try { const fid = E.fazenda.id, B = await baseFazenda();
    const [fs, ms, rp] = await Promise.all([todas(() => sb.from('animais').select('brinco,categoria_id').eq('fazenda_id', fid).eq('ativo', true).eq('sexo', 'F').order('brinco')),
      todas(() => sb.from('animais').select('brinco,categoria_id,externo,status').eq('fazenda_id', fid).eq('sexo', 'M').or('externo.eq.true,status.eq.Externo,ativo.eq.true')),
      todas(() => sb.from('eventos_reprodutivos').select('reprodutor').eq('fazenda_id', fid).not('reprodutor', 'is', null))]);
    L.mae = fs.filter(x => x.brinco && !/bezerr/i.test(semAcento(B.catPor[x.categoria_id] || ''))).map(x => ({v:x.brinco, d:B.catPor[x.categoria_id] || ''}));
    const pais = new Map();
    ms.filter(x => x.brinco && (x.externo || x.status === 'Externo' || /touro|reprodutor/i.test(semAcento(B.catPor[x.categoria_id] || '')))).forEach(x => pais.set(x.brinco, {v:x.brinco, d:(x.externo || x.status === 'Externo') ? 'Animal externo' : (B.catPor[x.categoria_id] || '')}));
    rp.forEach(r => { const n = String(r.reprodutor).trim(); if (n && !pais.has(n)) pais.set(n, {v:n, d:'Touro / sêmen'}); });
    L.pai = [...pais.values()];
    ins.forEach(i => { if (document.activeElement === i) i.dispatchEvent(new Event('input')); });
  } catch (e) {}
}

    let nota = '';

      if (!aid) { const {data:x} = await sb.from('animais').select('id').eq('fazenda_id', E.fazenda.id).eq('ativo', true).ilike('brinco', brinco).limit(1); aid = x?.[0]?.id; }

      const r2 = await sb.rpc('lancar_operacao', {p:{fazenda_id:E.fazenda.id, operacao:origem, data:p.data, area_id:p.area_id, categoria_id:p.categoria_id, area_destino_id:'', categoria_destino_id:'', quantidade:1, peso_medio:p.peso || '', causa_morte:'', observacao:'Brinco ' + brinco.toUpperCase()}});

async function conectarBastao(cb){
  if (LEITOR) { LEITOR.cb = cb; aviso('Bastão já conectado'); return; }
  if (!('serial' in navigator)) return aviso('Neste aparelho, use o bastão no modo teclado (Bluetooth HID): ele escreve o número no campo sozinho.');
  try {
    const port = await navigator.serial.requestPort(); await port.open({baudRate: 9600});
    const dec = new TextDecoderStream(); port.readable.pipeTo(dec.writable).catch(() => {});
    const rd = dec.readable.getReader(); LEITOR = {port, rd, cb}; let buf = '';
    (async () => { try { while (true) { const {value, done} = await rd.read(); if (done) break; buf += value;
      let i; while ((i = buf.search(/[\r\n]/)) >= 0) { const ln = buf.slice(0, i).trim(); buf = buf.slice(i+1); if (ln && LEITOR?.cb) LEITOR.cb(ln); } } } catch(e) {} LEITOR = null; })();
    aviso('Bastão conectado');
  } catch(e) { aviso('Bastão não conectado: ' + e.message); }
}
// ---------- Balança Bluetooth (Coimma KM3 Plus e outras): lê o peso do indicador e preenche o campo ----------
// Bluetooth BLE (Web Bluetooth) ou Bluetooth serial (Web Serial / SPP). Reconecta sozinho quando o aparelho já foi autorizado.
const BAL_SERV = [0xffe0,0xfff0,0xffb0,0xff00,0xffd0,0xfee0,0xae30,0x18f0,'6e400001-b5a3-f393-e0a9-e50e24dcca9e','49535343-fe7d-4ae5-8fa9-9fafd205e455','0000ffe0-0000-1000-8000-00805f9b34fb','e7810a71-73ae-499d-8c15-faa9aef0c3f2','0000fff0-0000-1000-8000-00805f9b34fb','00001101-0000-1000-8000-00805f9b34fb'];
const BAL = {peso:null, est:false, t:0, via:'', nome:'', hist:[], bruto:[], ouv:new Set(), dev:null, port:null, rd:null, buf:'', tentando:false, manual:false,
  cfg(){ try { return JSON.parse(localStorage.getItem('fjk_bal') || '{}'); } catch(e) { return {}; } },
  gcfg(c){ try { localStorage.setItem('fjk_bal', JSON.stringify({...BAL.cfg(), ...c})); } catch(e) {} },
  on(f){ BAL.ouv.add(f); return () => BAL.ouv.delete(f); },

  ok(){ return !!BAL.via; },
  vivo(){ return BAL.ok() && BAL.peso != null && Date.now() - BAL.t < 8000; },
  estavel(){ return BAL.vivo() && (BAL.est || Date.now() - BAL.t > 1200); },
  txt(){ return BAL.peso == null ? '–' : fmtNum(Math.round(BAL.peso), 0); },

  log(t){ BAL.bruto.push({h:new Date().toTimeString().slice(0, 8), t:'» ' + t, info:1}); if (BAL.bruto.length > 40) BAL.bruto.shift(); BAL.avisa(); },
  recebe(t){ if (!t) return;
    BAL.bruto.push({h:new Date().toTimeString().slice(0, 8), t}); if (BAL.bruto.length > 40) BAL.bruto.shift();
    BAL.buf += t; const partes = BAL.buf.split(/[\r\n\x02\x03]+/); BAL.buf = partes.pop();

  linha(p){ p = String(p).trim(); if (!p) return;

  pulso(){ if (!BAL._pl) BAL._pl = setInterval(() => { if (BAL.ok()) BAL.avisa(); }, 1000); },

const NUVEM_MAN = {tm:null, st:'', hora:'',
  caminho: (fid, id) => `manejos/${fid}/${id}.json`,
  // arquivos de uma sessão: <id>.json (antigo) ou <id>.<carimbo>.json
  async arquivos(fid, id){ const {data} = await sb.storage.from('anexos').list(`manejos/${fid}`, {limit:1000, search:id}); return (data || []).map(f => f.name).filter(n => n === id + '.json' || n.startsWith(id + '.')); },
  async apagar(fid, id, manter){ try { const todos = await NUVEM_MAN.arquivos(fid, id), car = n => Number((n.match(/\.(\d+)\.json$/) || [])[1]) || 0;
      const novo = manter ? todos.reduce((m, n) => car(n) > car(m) ? n : m, manter) : null; const ns = todos.filter(n => n !== novo); if (ns.length) await sb.storage.from('anexos').remove(ns.map(n => `manejos/${fid}/${n}`)); } catch(e) {} },
  async gravar(S, fid, status){ if (!S.id) return false; if (!navigator.onLine) { NUVEM_MAN.st = 'off'; return false; }
    NUVEM_MAN.st = 'env'; NUVEM_MAN.marca();
    try { const corpo = JSON.stringify({...S, fazenda_id:fid, fazenda:E.fazenda?.nome || '', usuario:S.usuario || E.perfil?.nome || E.usuario?.user_metadata?.nome || E.usuario?.user_metadata?.name || E.usuario?.email || '', status:status || S.status || 'aberta', atualizado:new Date().toISOString()});
      const nome = `${S.id}.${Date.now()}.json`;
      const r = await sb.storage.from('anexos').upload(`manejos/${fid}/${nome}`, new Blob([corpo], {type:'application/json'}), {contentType:'application/json', cacheControl:'0'});
      if (r.error) throw r.error;
      NUVEM_MAN.apagar(fid, S.id, nome); NUVEM_MAN.st = 'ok'; NUVEM_MAN.hora = new Date().toTimeString().slice(0, 5); NUVEM_MAN.marca(); return true; }
    catch(e) { NUVEM_MAN.st = 'erro'; NUVEM_MAN.msg = e.message || String(e); NUVEM_MAN.marca(); return false; } },
  depois(S, fid){ clearTimeout(NUVEM_MAN.tm); NUVEM_MAN.tm = setTimeout(() => NUVEM_MAN.gravar(S, fid), 1500); },
  marca(){ const b = document.getElementById('nuvemMan'); if (!b) return;
    const t = {ok:['☁️ Salvo na nuvem ' + NUVEM_MAN.hora, '#e6f4ea', '#1e6b34'], env:['☁️ Salvando…', '#eef2e8', '#455a64'], off:['📴 Sem internet: salvo no aparelho; envia quando voltar', '#fff4d6', '#8a5a00'], erro:['⚠️ Não salvou na nuvem (salvo no aparelho)', '#fdecea', '#b71c1c']}[NUVEM_MAN.st];
    b.style.display = t ? '' : 'none'; if (t) { b.textContent = t[0]; b.style.background = t[1]; b.style.color = t[2]; b.title = NUVEM_MAN.st === 'erro' ? (NUVEM_MAN.msg || '') : ''; } },
  async listar(fid){ const {data, error} = await sb.storage.from('anexos').list(`manejos/${fid}`, {limit:100, sortBy:{column:'updated_at', order:'desc'}});
    if (error) throw error;
    const ls = await Promise.all((data || []).filter(f => /\.json$/.test(f.name)).slice(0, 60).map(async f => { try { const {data:b} = await sb.storage.from('anexos').download(`manejos/${fid}/${f.name}`); return JSON.parse(await b.text()); } catch(e) { return null; } }));
    const ult = {}; ls.filter(Boolean).forEach(x => { if (!ult[x.id] || String(x.atualizado) > String(ult[x.id].atualizado)) ult[x.id] = x; });
    return Object.values(ult).filter(x => x.status !== 'excluida').sort((a, b) => String(b.atualizado).localeCompare(String(a.atualizado))); }
};

// ajusta o estoque do rebanho (lote) quando um animal individual muda de área ou categoria
// peso do lote = média dos brincos pesados naquela data (lança uma Pesagem no lote; só se a pesagem for a mais recente)
async function pesoLoteBrincos(pares, d){
  let n = 0;
  for (const k of new Set(pares)) { const [area, cat] = String(k).split('|'); if (!area || !cat) continue;
    const {data} = await sb.from('animais').select('peso_atual').eq('area_id', area).eq('categoria_id', cat).eq('ativo', true).eq('data_peso', d).limit(5000);
    const ps = (data || []).map(x => Number(x.peso_atual)).filter(x => x > 0); if (!ps.length) continue;
    const {data:l} = await sb.from('lotes').select('quantidade,data_peso,fazenda_id').eq('area_id', area).eq('categoria_id', cat).maybeSingle();
    if (!l || l.quantidade < 1 || (l.data_peso && String(l.data_peso).slice(0,10) > d)) continue;
    const media = Math.round(ps.reduce((s, x) => s + x, 0) / ps.length * 10) / 10;
    const r = await sb.rpc('lancar_operacao', {p:{fazenda_id:l.fazenda_id, operacao:'Pesagem', data:d, area_id:area, categoria_id:cat, area_destino_id:'', categoria_destino_id:'', quantidade:null, peso_medio:String(media), causa_morte:'', observacao:`Média de ${ps.length} brinco(s) pesado(s)`}});
    if (!r.error) n++; }
  return n ? ` · peso de ${n} lote(s) atualizado` : '';
}
async function sincLote(a, areaNova, catNova, d){
  if (!a.area_id || !a.categoria_id) return '';
  const {data:l} = await sb.from('lotes').select('quantidade').eq('area_id', a.area_id).eq('categoria_id', a.categoria_id).maybeSingle();
  if (!l || l.quantidade < 1) return ' (lote da área não ajustado: sem saldo)';
  const base = {fazenda_id:a.fazenda_id, data:d, quantidade:1, peso_medio:'', causa_morte:'', observacao:'Manejo individual brinco '+a.brinco, area_destino_id:'', categoria_destino_id:''};
  let r = {error:null};
  if (areaNova && areaNova !== a.area_id) r = await sb.rpc('lancar_operacao', {p:{...base, operacao:'Movimentação', area_id:a.area_id, categoria_id:a.categoria_id, area_destino_id:areaNova}});
  const areaAt = areaNova || a.area_id;
  if (!r.error && catNova && catNova !== a.categoria_id) r = await sb.rpc('lancar_operacao', {p:{...base, operacao:'Mudança de categoria', area_id:areaAt, categoria_id:a.categoria_id, categoria_destino_id:catNova}});
  return r.error ? ' (lote não ajustado: ' + r.error.message.replace(/^.*?: /,'') + ')' : '';
}

const NEG = {
  'Venda':{titulo:'Venda de animais vivos', pessoa:'Comprador', fin:'Receber', op:'Venda de animais'},
  'Abate':{titulo:'Venda para abate (frigorífico)', pessoa:'Frigorífico', fin:'Receber', op:'Venda de animais'},
  'Compra':{titulo:'Compra de animais', pessoa:'Vendedor', fin:'Pagar', op:'Compra de animais'},
  'Transferência':{titulo:'Transferência entre fazendas', pessoa:'', fin:null}};
const MODOS_VIVO = ['R$ por @ (peso vivo ÷ 30)','R$ por kg vivo','R$ por cabeça','Valor total'];
const MODOS_CARC = ['R$ por @ de carcaça (÷ 15)','R$ por kg de carcaça','R$ por cabeça','Valor total'];
const nBR = v => { v = String(v ?? '').trim(); if (!v) return 0; if (v.includes(',')) v = v.replace(/\./g,'').replace(',','.'); return Number(v) || 0; };
function calcNeg(D){
  const cab = D.itens.reduce((s,i) => s + (i.k === 'l' ? Number(i.quantidade) : 1), 0);
  const kg = D.itens.reduce((s,i) => s + (i.k === 'l' ? Number(i.quantidade) * nBR(i.peso_vivo) : nBR(i.peso_vivo)), 0);
  const carc = nBR(D.carc), preco = nBR(D.preco), m = D.modo || '';
  let bruto = 0;
  if (m.startsWith('R$ por @ (')) bruto = kg / 30 * preco;
  else if (m === 'R$ por kg vivo') bruto = kg * preco;
  else if (m.startsWith('R$ por @ de carcaça')) bruto = carc / 15 * preco;
  else if (m === 'R$ por kg de carcaça') bruto = carc * preco;
  else if (m === 'R$ por cabeça') bruto = cab * preco;
  else bruto = preco;
  const desc = bruto * nBR(D.funr) / 100 + nBR(D.outros);
  return {cab, kg, carc, bruto: Math.round(bruto*100)/100, desc: Math.round(desc*100)/100, liq: Math.round((bruto - desc)*100)/100};
}

async function guardarAnimaisLocal(fid){

    if (!d || !d.length) return;

// cópia dos animais no aparelho: formato compacto (colunas + linhas), uma por fazenda, para ocupar pouca memória
const ANI_COL = ['id','fazenda_id','brinco','chip','sexo','raca','data_nascimento','area_id','categoria_id','peso_atual','data_peso','situacao_reprodutiva','ativo','tags','_fila'];

    return (x.r || []).map(v => { const o = {fazenda_id:fid, ativo:true}; x.c.forEach((c, i) => { if (v[i] != null) o[c] = v[i]; }); return o; }); } catch(e) { return []; } }

  const c = ANI_COL.filter(c => c !== 'fazenda_id' && c !== 'ativo');
  localStorage.setItem('fjk_ani_' + fid, JSON.stringify({c, r:L.map(a => c.map(k => { const v = a[k]; return v === '' || (Array.isArray(v) && !v.length) || v === false ? null : v ?? null; }))})); }
// atualiza no aparelho os dados de TODAS as fazendas (animais + áreas, categorias, lotes, módulos já consultados)
// roda ao abrir o app, a cada 10 min com o app aberto e com sinal, quando o sinal volta e ao tocar no ⟳
const SYNC = {
  async todas(forcar){
    if (SYNC._r || !navigator.onLine || !E.usuario || !E.fazendas?.length) return false;
    if (!forcar && document.visibilityState === 'hidden') return false;
    SYNC._r = true; let ok = true;
    try { const fazs = E.fazendas.filter(f => !f.sede_financeiro);
      for (const f of fazs) { if (!navigator.onLine) { ok = false; break; } await guardarAnimaisLocal(f.id); }
      await SYNC.base(fazs.map(f => f.id)); }
    catch(e) { ok = false; } finally { SYNC._r = false; }
    return ok;
  },
  async base(ids){
    try { if (!('caches' in window)) return; const nome = (await caches.keys()).find(k => k.endsWith('-dados')); if (!nome) return;
      const ks = await (await caches.open(nome)).keys(), {data:{session}} = await sb.auth.getSession(); if (!session) return;
      const h = {apikey:SUPABASE_KEY, Authorization:'Bearer ' + session.access_token}, urls = new Set();
      for (const k of ks) { const u = k.url; if (/\/rest\/v1\/(animais|eventos_animal|operacoes_rebanho)\b/.test(u)) continue;
        const m = ids.find(id => u.includes(id)); if (!m) continue; ids.forEach(id => urls.add(u.split(m).join(id))); }
      for (const u of [...urls].slice(0, 300)) { if (!navigator.onLine) break; try { await fetch(u, {headers:h}); } catch(e) {} }
    } catch(e) {}
  }
};

    <div class="tabela"><table id="ag_t"></table></div><div class="rodape" id="rod"></div>`;
  $('#volta').onclick = () => ir('inicio');
  let csv = [];
  const des = () => { const v = $('#ag_v').value;
    if (v === 'd') { $('#ag_t').innerHTML = '<thead><tr><th>Brinco</th><th>Área</th><th>Categoria</th><th>Inseminada em</th><th>Cobertura</th><th class="num">Dias</th></tr></thead><tbody>' + aDiag.map(x => `<tr class="clic" data-a="${x.a.id}">${lin(x.a)}<td>${fD(x.ia.data)}</td><td>${esc([x.ia.tipo_cobertura, x.ia.reprodutor].filter(Boolean).join(' · '))}</td><td class="num">${x.d}</td></tr>`).join('') + '</tbody>';
      csv = [['Brinco','Área','Categoria','Inseminada em','Cobertura','Dias'], aDiag.map(x => [x.a.brinco, B.areaPor[x.a.area_id]||'', B.catPor[x.a.categoria_id]||'', fD(x.ia.data), x.ia.tipo_cobertura||'', x.d])];

// carência: devolve aviso se o animal tomou produto com carência ainda correndo
async function carenciaAnimal(a){
  const B = await baseFazenda(), cs = B.procs.filter(p => Number(p.carencia_dias) > 0); if (!cs.length) return '';
  const max = Math.max(...cs.map(p => p.carencia_dias)), desde = new Date(Date.now() - max*864e5).toISOString().slice(0,10);
  const {data} = await sb.from('eventos_animal').select('data,procedimentos').eq('animal_id', a.id).eq('operacao', 'Vacinação e sanidade').gte('data', desde);
  for (const e of data || []) { const p = cs.find(x => x.nome.toLowerCase() === String(e.procedimentos||'').toLowerCase());
    if (p) { const lib = new Date(new Date(e.data+'T12:00:00').getTime() + p.carencia_dias*864e5).toISOString().slice(0,10); if (lib > hojeISO()) return `${p.nome} em ${fD(e.data)}: carência até ${fD(lib)}`; } }
  return '';
}

// ---------- Nota fiscal pelo arquivo XML ----------
function lerXmlNFe(txt){
  const x = new DOMParser().parseFromString(txt, 'application/xml');
  if (x.getElementsByTagName('parsererror').length) throw new Error('arquivo não é XML válido');
  const tg = (el, n) => el ? el.getElementsByTagNameNS('*', n)[0] || el.getElementsByTagName(n)[0] : null;
  const tx = (el, n) => tg(el, n)?.textContent?.trim() || '';
  const inf = tg(x, 'infNFe'); if (!inf) throw new Error('não é uma NF-e');
  const ide = tg(inf, 'ide'), emit = tg(inf, 'emit'), dest = tg(inf, 'dest'), tot = tg(inf, 'ICMSTot'), prot = tg(x, 'infProt');
  const chave = (tx(prot, 'chNFe') || (inf.getAttribute('Id') || '').replace(/^NFe/, '')).trim();
  const itens = [...inf.getElementsByTagNameNS('*', 'det')].map(d => { const p = tg(d, 'prod');
    return {codigo:tx(p,'cProd'), descricao:tx(p,'xProd'), ncm:tx(p,'NCM'), cfop:tx(p,'CFOP'), unidade_comercial:tx(p,'uCom'), quantidade_comercial:Number(tx(p,'qCom'))||0,
      valor_unitario:Number(tx(p,'vUnCom'))||0, valor_bruto:Number(tx(p,'vProd'))||0}; });
  const duplicatas = [...inf.getElementsByTagNameNS('*', 'dup')].map(d => ({numero:tx(d,'nDup'), data_vencimento:tx(d,'dVenc'), valor:Number(tx(d,'vDup'))||0}));
  const cst = tx(prot, 'cStat');
  return {chave, numero:tx(ide,'nNF'), serie:tx(ide,'serie'), data_emissao:tx(ide,'dhEmi') || tx(ide,'dEmi') || null, natureza_operacao:tx(ide,'natOp'),
    emitente_nome:tx(emit,'xNome'), emitente_doc:tx(emit,'CNPJ') || tx(emit,'CPF'), emitente_uf:tx(tg(emit,'enderEmit'),'UF'),
    destinatario_nome:tx(dest,'xNome'), destinatario_doc:tx(dest,'CNPJ') || tx(dest,'CPF'), valor_total:Number(tx(tot,'vNF'))||0,
    situacao_sefaz: cst === '100' ? 'Autorizada' : cst ? 'cStat ' + cst : 'Sem protocolo', completa:true, dados:{itens, duplicatas, origem:'xml'}};
}
function importarXmlNotas(depois){
  const inp = document.createElement('input'); inp.type = 'file'; inp.accept = '.xml,text/xml,application/xml'; inp.multiple = true;
  inp.onchange = async () => {
    const fz = finFaz(), ok = [], erros = [];
    for (const f of inp.files) {
      try { const n = lerXmlNFe(await f.text()); if (!n.chave) throw new Error('sem chave de acesso');
        const r = await sb.from('notas_fiscais').upsert({...n, fazenda_id:fz, status:'Nova'}, {onConflict:'fazenda_id,chave', ignoreDuplicates:true}).select('id');
        if (r.error) throw r.error; ok.push(r.data?.length ? n.numero : n.numero + ' (já existia)'); }
      catch(e) { erros.push(f.name + ': ' + e.message); }
    }
    alertaLista('Importação de XML', [`${ok.length} nota(s) importada(s)${ok.length ? ': ' + ok.join(', ') : ''}`, ...erros]);
    if (depois) depois();
  };
  inp.click();
}

// ---------- Conciliação bancária (extrato OFX) ----------
function lerOFX(txt){
  const g = (b, t) => { const m = b.match(new RegExp('<' + t + '>([^<\\r\\n]*)', 'i')); return m ? m[1].trim() : ''; };
  const dt = s => s ? `${s.slice(0,4)}-${s.slice(4,6)}-${s.slice(6,8)}` : '';
  const trs = txt.split(/<STMTTRN>/i).slice(1).map(b => ({fitid:g(b,'FITID'), data:dt(g(b,'DTPOSTED')), valor:Number(g(b,'TRNAMT').replace(',','.'))||0, desc:[g(b,'NAME'), g(b,'MEMO')].filter(Boolean).join(' – '), tipo:g(b,'TRNTYPE')}));
  const bal = txt.match(/<LEDGERBAL>[\s\S]*?<BALAMT>([^<\r\n]+)[\s\S]*?<DTASOF>([^<\r\n]+)/i);
  return {trs, saldo: bal ? Number(bal[1].replace(',','.')) : null, saldoData: bal ? dt(bal[2].trim()) : ''};
}

// ---------- Evolução de categoria por idade ----------
const idadeMeses = n => { if (!n) return null; const d = new Date(n+'T12:00:00'), h = new Date(); let m = (h.getFullYear()-d.getFullYear())*12 + h.getMonth()-d.getMonth(); if (h.getDate() < d.getDate()) m--; return Math.max(0, m); };
async function telaEvolucao(){
  $('#corpo').innerHTML = '<div class="vazio">Carregando…</div>';
  const fid = E.fazenda.id, B = await baseFazenda();
  const {data:cats} = await sb.from('categorias_manejo').select('id,nome,idade_max_meses,proxima_categoria_id').eq('fazenda_id', fid);
  const regra = Object.fromEntries((cats||[]).filter(c => c.idade_max_meses && c.proxima_categoria_id).map(c => [c.id, c]));
  const anis = Object.keys(regra).length ? await todas(() => sb.from('animais').select('id,fazenda_id,brinco,data_nascimento,area_id,categoria_id').eq('fazenda_id', fid).eq('ativo', true).in('categoria_id', Object.keys(regra)).not('data_nascimento','is',null)) : [];
  const sug = anis.map(a => ({a, m:idadeMeses(a.data_nascimento), r:regra[a.categoria_id]})).filter(x => x.m > x.r.idade_max_meses).sort((x,y) => y.m - x.m);
  $('#corpo').innerHTML = `<div class="topo"><button class="voltar" id="volta">←</button><h2>Evolução de categoria por idade</h2></div>
    ${!Object.keys(regra).length ? '<div class="msg erro" style="display:block;background:#fff4e0;color:#8a5a00">Nenhuma regra ainda. Em Cadastros → Categorias de manejo, preencha em cada categoria a "idade máxima (meses)" e a "próxima categoria".</div>' : ''}
    <div class="rodape">Animais individuais que já passaram da idade máxima da categoria. Os lotes sem brinco continuam pela "Mudança de categoria".</div>
    <div class="tabela"><table><thead><tr><th><input type="checkbox" id="ev_all" checked></th><th>Brinco</th><th class="num">Idade (meses)</th><th>Área</th><th>De</th><th>Para</th></tr></thead><tbody>
    ${sug.map((x,i) => `<tr><td><input type="checkbox" data-i="${i}" checked></td><td><b>${esc(x.a.brinco)}</b></td><td class="num">${x.m}</td><td>${esc(B.areaPor[x.a.area_id]||'–')}</td><td>${esc(B.catPor[x.a.categoria_id]||'')}</td><td>${esc(B.catPor[x.r.proxima_categoria_id]||'')}</td></tr>`).join('') || '<tr><td colspan="6" class="vazio">Nenhum animal para mudar</td></tr>'}
    </tbody></table></div><div class="rodape" id="rod">${sug.length} animais</div>
    ${sug.length && podeEditar() ? '<div class="acoes"><button class="btn" id="ev_ok">Mudar os marcados</button></div>' : ''}`;
  $('#volta').onclick = () => ir('inicio');
  if ($('#ev_all')) $('#ev_all').onchange = () => document.querySelectorAll('[data-i]').forEach(c => c.checked = $('#ev_all').checked);
  if ($('#ev_ok')) $('#ev_ok').onclick = async () => {
    const sel = [...document.querySelectorAll('[data-i]:checked')].map(c => sug[+c.dataset.i]); if (!sel.length || !await confirma(`Mudar a categoria de ${sel.length} animais?`)) return;
    $('#ev_ok').disabled = true; let n = 0; const d = hojeISO();
    for (const x of sel) {
      const nova = x.r.proxima_categoria_id; let r;
      if (x.a.area_id) r = await sb.rpc('lancar_individual', {p:{animal_id:x.a.id, operacao:'Localização', data:d, area_id:x.a.area_id, categoria_id:nova, observacao:'Evolução de categoria por idade'}});
      else { const {data:a} = await sb.from('animais').select('*').eq('id', x.a.id).single(); r = await sb.rpc('editar_animal', {p:{...a, animal_id:a.id, categoria_id:nova}}); }
      if (!r.error) { n++; if (x.a.area_id) await sincLote(x.a, '', nova, d); }
      if (n % 20 === 0) $('#rod').textContent = `Mudando… ${n}/${sel.length}`;
    }
    aviso(`${n} animais mudaram de categoria`); cacheBase = null; telaEvolucao();
  };
}

// ---------- IATF ----------
const PROTOCOLOS = {
  'IATF 3 manejos (D0 · D8 · D10)': [{dia:0, acao:'Implante de progesterona + benzoato de estradiol'}, {dia:8, acao:'Retirada do implante + prostaglandina + eCG + cipionato'}, {dia:10, acao:'Inseminação (IATF)', ia:true}, {dia:40, acao:'Diagnóstico de gestação', dg:true}],
  'IATF 4 manejos (D0 · D7 · D9 · D11)': [{dia:0, acao:'Implante + benzoato de estradiol'}, {dia:7, acao:'Prostaglandina'}, {dia:9, acao:'Retirada do implante + eCG + cipionato'}, {dia:11, acao:'Inseminação (IATF)', ia:true}, {dia:41, acao:'Diagnóstico de gestação', dg:true}],
  'Ressincronização (D22 · D30 · D32)': [{dia:22, acao:'Novo implante nas inseminadas'}, {dia:30, acao:'Diagnóstico + retirada do implante nas vazias'}, {dia:32, acao:'Reinseminação das vazias', ia:true}, {dia:62, acao:'Diagnóstico de gestação', dg:true}]};
const addDias = (d, n) => new Date(new Date(d+'T12:00:00').getTime() + n*864e5).toISOString().slice(0,10);
async function telaIATF(){
  $('#corpo').innerHTML = '<div class="vazio">Carregando…</div>';
  const {data} = await sb.from('iatf_lotes').select('*').eq('fazenda_id', E.fazenda.id).order('d0', {ascending:false});
  const ls = data || [], hoje = hojeISO();
  const prox = l => (l.passos||[]).find(p => !p.feito);
  $('#corpo').innerHTML = `<div class="topo"><button class="voltar" id="volta">←</button><h2>Protocolos de IATF</h2>${podeEditar() ? '<button class="btn" id="novo">+ Novo lote de IATF</button>' : ''}</div>
    <div class="tabela"><table><thead><tr><th>Lote</th><th>Protocolo</th><th>D0</th><th class="num">Fêmeas</th><th>Próxima etapa</th></tr></thead><tbody>
    ${ls.map((l,i) => { const p = prox(l), dt = p ? addDias(l.d0, p.dia) : ''; return `<tr class="clic" data-i="${i}"><td><b>${esc(l.nome)}</b>${l.encerrado?' <span class="pill">encerrado</span>':''}</td><td>${esc(l.protocolo||'')}</td><td>${fD(l.d0)}</td><td class="num">${l.brincos.length}</td>
      <td>${p ? `<span style="color:${dt < hoje ? 'var(--vermelho)' : dt === hoje ? 'var(--verde)' : ''}">${fD(dt)} – ${esc(p.acao)}</span>` : 'Tudo feito'}</td></tr>`; }).join('') || '<tr><td colspan="5" class="vazio">Nenhum lote de IATF</td></tr>'}
    </tbody></table></div>`;
  $('#volta').onclick = () => ir('inicio');
  if ($('#novo')) $('#novo').onclick = () => formIATF({});
  document.querySelectorAll('tr.clic').forEach(tr => tr.onclick = () => fichaIATF(ls[+tr.dataset.i]));
}
function formIATF(l){

function fichaIATF(l){
  const m = document.createElement('div'), hoje = hojeISO(); m.className = 'modal';
  m.innerHTML = `<div class="caixa"><h3>${esc(l.nome)}</h3><div class="rodape" style="margin-top:0">${esc(l.protocolo||'')} · D0 ${fD(l.d0)} · ${l.brincos.length} fêmeas${l.reprodutor ? ' · ' + esc(l.reprodutor) : ''}</div>
    <div class="tabela" style="margin-top:8px"><table><thead><tr><th>Dia</th><th>Data</th><th>Etapa</th><th></th></tr></thead><tbody>
    ${l.passos.map((p,i) => { const dt = addDias(l.d0, p.dia); return `<tr><td>D${p.dia}</td><td style="color:${!p.feito && dt < hoje ? 'var(--vermelho)' : ''}">${fD(dt)}</td><td style="white-space:normal">${esc(p.acao)}</td>
      <td>${p.feito ? '✓ feito' : podeEditar() ? `<button class="btn ${p.ia || p.dg ? '' : 'sec'} peq" data-p="${i}">${p.ia ? 'Lançar IA' : p.dg ? 'Abrir diagnóstico' : 'Marcar feito'}</button>` : ''}</td></tr>`; }).join('')}
    </tbody></table></div>
    <details style="margin-top:8px"><summary>Fêmeas do lote</summary><div style="font-size:13px">${l.brincos.map(esc).join(', ')}</div></details>
    <div class="acoes"><button class="btn sec" id="x">Cancelar</button>${ehAdmin() ? '<button class="btn perigo" id="del">Excluir lote</button>' : ''}</div></div>`;
  document.body.appendChild(m);
  m.querySelector('#x').onclick = () => m.remove();
  if (m.querySelector('#del')) m.querySelector('#del').onclick = async () => { if (!await confirma('Excluir este lote de IATF? Os lançamentos reprodutivos já feitos continuam.')) return; await sb.from('iatf_lotes').delete().eq('id', l.id); m.remove(); telaIATF(); };
  const marcar = async i => { const passos = l.passos.map((p,j) => j === i ? {...p, feito:true, feito_em:hojeISO()} : p); const enc = passos.every(p => p.feito);
    await sb.from('iatf_lotes').update({passos, encerrado:enc}).eq('id', l.id); l.passos = passos; };
  m.querySelectorAll('[data-p]').forEach(b => b.onclick = async () => {
    const i = +b.dataset.p, p = l.passos[i];
    if (p.ia) {
      const repr = await pergunta('Touro / sêmen usado:', l.reprodutor || ''); if (repr === null) return;
      b.disabled = true;
      const r = await sb.rpc('lancar_reprodutivo', {p:{fazenda_id:E.fazenda.id, operacao:'Inseminação', data:addDias(l.d0, p.dia) > hojeISO() ? hojeISO() : addDias(l.d0, p.dia), brincos:l.brincos, tipo_cobertura:'IATF', reprodutor:repr, observacao:'IATF lote ' + l.nome}});
      if (r.error) { b.disabled = false; return aviso(r.error.message.replace(/^.*?: /,'')); }
      await marcar(i); aviso(`${r.data?.lancados || 0} inseminações lançadas` + (r.data?.erros?.length ? ` · ${r.data.erros.length} com problema` : ''));
      if (r.data?.erros?.length) alertaLista('Não lançadas', r.data.erros);
    } else if (p.dg) {
      m.remove(); const chave = 'fjk_man_' + E.fazenda.id; let S = null; try { S = JSON.parse(localStorage.getItem(chave)); } catch(e) {}
      S = {...(S || {feitos:[]}), data:hojeISO(), acoes:['dg']}; localStorage.setItem(chave, JSON.stringify(S)); await marcar(i);
      aviso('Manejo no curral aberto em modo diagnóstico'); ir('manejo'); return;
    } else await marcar(i);
    m.remove(); fichaIATF(l); telaIATF();
  });
}

// curva de peso (SVG) para a ficha do animal
function curvaPeso(pes){
  if (pes.length < 2) return '';
  const W = 520, H = 120, P = 24, xs = pes.map(p => new Date(p.data).getTime()), ys = pes.map(p => Number(p.peso));
  const x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys);
  const X = t => P + (x1 === x0 ? 0 : (t - x0) / (x1 - x0) * (W - 2*P)), Y = v => H - P - (y1 === y0 ? 0 : (v - y0) / (y1 - y0) * (H - 2*P));
  const pts = pes.map((p,i) => `${X(xs[i]).toFixed(1)},${Y(ys[i]).toFixed(1)}`).join(' ');
  return `<div class="secao">Curva de peso</div><svg viewBox="0 0 ${W} ${H}" style="width:100%;max-width:${W}px;background:#fff;border:1px solid var(--borda);border-radius:8px">
    <polyline points="${pts}" fill="none" stroke="#2f5d1e" stroke-width="2.5"/>${pes.map((p,i) => `<circle cx="${X(xs[i])}" cy="${Y(ys[i])}" r="3.5" fill="#4c8a2b"><title>${fD(p.data)}: ${fmtNum(p.peso,0)} kg</title></circle>`).join('')}
    <text x="${P}" y="14" font-size="11" fill="#6b7565">${fmtNum(y1,0)} kg</text><text x="${P}" y="${H-6}" font-size="11" fill="#6b7565">${fmtNum(y0,0)} kg · ${fD(pes[0].data)}</text><text x="${W-P}" y="${H-6}" font-size="11" fill="#6b7565" text-anchor="end">${fD(pes[pes.length-1].data)}</text></svg>`;
}

// ---------- Financeiro ----------
const finFaz = () => (E.fazendas.find(f => f.sede_financeiro) || E.fazenda).id;
const fD = v => v ? fmtData(v + 'T12:00:00') : '';
const moeda = v => (Number(v)||0).toLocaleString('pt-BR', {style:'currency', currency:'BRL'});
const OPS_FIN = {Pagar:['Pagamentos','Compra de produtos','Compra de animais','Transportes e fretes','Comissões'], Receber:['Recebimentos','Venda de animais','Venda de produtos']};
const FORMAS = ['PIX','Boleto','Transferência','Dinheiro','Cartão de crédito','Débito em conta','Cheque','Outros'];
let FIN = null;
async function todas(mk){ let out = [], i = 0; while (true) { const {data, error} = await mk().range(i, i+999); if (error) throw error; out = out.concat(data||[]); if (!data || data.length < 1000) break; i += 1000; } return out; }
async function carregarFin(forcar){
  if (FIN && !forcar && FIN.faz === finFaz()) return FIN;
  const fz = finFaz();
  const [contas, centros, planos, lancs, transf] = await Promise.all([
    todas(() => sb.from('contas_bancarias').select('*').eq('fazenda_id', fz).order('nome')),
    todas(() => sb.from('centros_custo').select('*').eq('fazenda_id', fz).order('nome')),
    todas(() => sb.from('plano_contas').select('*').eq('fazenda_id', fz).order('codigo')),
    todas(() => sb.from('lancamentos_financeiros').select('*').eq('fazenda_id', fz).order('vencimento').order('id')),
    todas(() => sb.from('transferencias_bancarias').select('*').eq('fazenda_id', fz).order('data'))]);
  const pessoas = await todas(() => sb.from('pessoas').select('id,nome,tipo,cpf_cnpj').eq('fazenda_id', fz).eq('ativo', true).order('nome')).catch(() => []);
  centros.sort((a, b) => FAZ_CC.indexOf(a.fazenda_nome) - FAZ_CC.indexOf(b.fazenda_nome) || String(a.nome).localeCompare(String(b.nome), 'pt'));
  FIN = {faz:fz, contas, centros, planos, lancs, transf, pessoas};
  return FIN;
}
const nomeConta = id => FIN?.contas.find(c => c.id === id)?.nome || '';
const statusLanc = l => l.status === 'Efetivada' ? (l.tipo === 'Pagar' ? 'Pago' : 'Recebido') : l.status === 'Cancelada' ? 'Cancelada' : (l.vencimento < hojeISO() ? 'Vencida' : 'Em aberto');
const corStatus = s => ({Pago:'#e7f3df', Recebido:'#e7f3df', Vencida:'#fde8e6', Cancelada:'#eee'}[s] || '#fff4d6');
const grupoDoPlano = txt => { const cod = String(txt||'').split(' - ')[0].trim(); const p = FIN.planos.find(x => x.codigo === cod); return p ? p : null; };
// movimentos que entram no saldo de uma conta
function movimentosConta(c, ate){
  const lim = ate || hojeISO(), ini = c.data_saldo_inicial || '0000';
  const cartao = c.tipo === 'Cartão de crédito';
  const mv = [];
  FIN.lancs.forEach(l => {
    if (l.conta_id !== c.id || !l.data_pagamento || l.data_pagamento > lim || l.status === 'Cancelada') return;
    if (!cartao && (l.status !== 'Efetivada' || l.data_pagamento < ini)) return;
    const v = Number(l.valor_pago ?? l.valor) || 0;
    mv.push({data:l.data_pagamento, desc:l.pessoa, det:[l.plano_conta, l.observacao].filter(Boolean).join(' · '), op:l.operacao, valor:l.tipo === 'Receber' ? v : -v, lanc:l});
  });
  FIN.transf.forEach(t => {
    if (t.data > lim || t.data < ini) return;
    if (t.conta_origem_id === c.id) mv.push({data:t.data, desc:'Transferência para '+nomeConta(t.conta_destino_id), det:t.observacao||'', op:'Transferência', valor:-Number(t.valor), transf:t});
    if (t.conta_destino_id === c.id) mv.push({data:t.data, desc:'Transferência de '+nomeConta(t.conta_origem_id), det:t.observacao||'', op:'Transferência', valor:Number(t.valor), transf:t});
  });
  return mv.sort((a,b) => a.data < b.data ? -1 : a.data > b.data ? 1 : 0);
}
const saldoConta = (c, ate) => Number(c.saldo_inicial||0) + movimentosConta(c, ate).reduce((s,m) => s + m.valor, 0);

// junta as linhas de rateio da mesma parcela numa linha só (como no padrão: uma linha por parcela)
function parcelasFin(tipo){
  const g = new Map();
  FIN.lancs.filter(l => l.tipo === tipo).forEach(l => { const k = l.grupo ? l.grupo + '|' + l.parcela : l.id;
    if (!g.has(k)) g.set(k, {k, rows:[], ...l, valor:0, valor_pago:0}); const u = g.get(k); u.rows.push(l);
    u.valor += Number(l.valor)||0; if (l.status === 'Efetivada') u.valor_pago += Number(l.valor_pago ?? l.valor)||0; });

    $('#tb').innerHTML = mostra.map((o, i) => `<tr class="clic" data-i="${i}"><td>${fD(o.data)}</td><td>${fD(o.venc1)}</td><td>${esc(o.operacao||'')}</td><td>${esc(o.pessoa||'')}</td><td>${esc(o.documento||'')}</td><td>${esc(o.pedido||'')}</td><td>${esc(o.os||'')}</td>

      || '<tr><td colspan="10" class="vazio">Nada no período</td></tr>';
    $('#rod').innerHTML = `${fmtNum(ls.length,0)} operações · total <b>${moeda(ls.reduce((s,o) => s + o.valor, 0))}</b>` + (ls.length > mostra.length ? ' (mostrando as primeiras 800)' : '');
    document.querySelectorAll('#tb tr.clic').forEach(tr => tr.onclick = () => fichaOpFin(mostra[+tr.dataset.i], tipo)); };
  document.querySelectorAll('#corpo .filtros input, #corpo .filtros select').forEach(i => { i.addEventListener('change', desenhar); if (i.tagName === 'INPUT' && i.type !== 'date') i.addEventListener('input', desenhar); });

  desenhar();
}
function fichaOpFin(o, tipo){
  const rec = tipo === 'Receber', r0 = o.rows[0];
  const m = document.createElement('div'); m.className = 'modal';
  const linhas = [...o.rows].sort((a,b) => String(a.vencimento).localeCompare(String(b.vencimento)) || String(a.plano_conta).localeCompare(String(b.plano_conta)));
  m.innerHTML = `<div class="caixa" style="max-width:1000px"><h3>${esc(o.operacao||'')} – ${esc(o.pessoa||'')}</h3>
    <div class="grade" style="grid-template-columns:repeat(3,1fr);gap:4px 14px;font-size:14px">
      <div>Data: <b>${fD(o.data)}</b></div><div>Documento: <b>${esc(o.documento||'–')}</b>${r0.tipo_documento ? ' ('+esc(r0.tipo_documento)+')' : ''}</div><div>Valor final: <b>${moeda(o.valor)}</b></div>
      ${r0.valor_inicial ? `<div>Valor inicial: <b>${moeda(r0.valor_inicial)}</b></div>` : ''}${r0.desconto ? `<div>Descontos: <b>${moeda(r0.desconto)}</b></div>` : ''}${r0.juros ? `<div>Multas/juros: <b>${moeda(r0.juros)}</b></div>` : ''}
      ${r0.valor_nota ? `<div>Valor da nota fiscal: <b>${moeda(r0.valor_nota)}</b></div>` : ''}${o.os ? `<div>Ordem de serviço: <b>${esc(o.os)}</b></div>` : ''}${o.pedido ? `<div>Pedido: <b>${esc(o.pedido)}</b></div>` : ''}
      ${o.socio ? `<div>Sócio: <b>${esc(o.socio)}</b></div>` : ''}<div>Situação: <b>${o.situacao}</b></div></div>
    ${o.obs ? `<div class="rodape">${esc(o.obs)}</div>` : ''}
    ${o.itens.length ? `<div class="secao">Produtos</div><div class="tabela"><table><thead><tr><th class="num">Qtd</th><th>Produto</th><th class="num">Unitário</th><th class="num">Total</th></tr></thead><tbody>${o.itens.map(i => `<tr><td class="num">${fmtNum(i.quantidade,2)}</td><td>${esc(i.produto)}</td><td class="num">${fmtNum(i.valor_unitario)}</td><td class="num">${fmtNum(i.total)}</td></tr>`).join('')}</tbody></table></div>` : ''}
    <div class="secao">Parcelas e rateio</div>
    <div class="tabela"><table><thead><tr><th>Parcela</th><th>Vencimento</th><th>Fazenda</th><th>Centro de custo</th><th>Plano de contas</th><th class="num">Valor</th><th>${rec?'Recebido':'Pago'} em</th><th class="num">Valor ${rec?'recebido':'pago'}</th><th>Situação</th></tr></thead><tbody>
      ${linhas.map(l => `<tr class="clic" data-id="${l.id}"><td>${esc(l.parcela||'')}</td><td>${fD(l.vencimento)}</td><td>${esc(E.fazendas.find(f => f.id === l.fazenda_ref_id)?.nome || '')}</td><td>${esc(l.centro_custo||'')}</td><td>${esc(l.plano_conta||'')}</td>
        <td class="num">${fmtNum(l.valor)}</td><td>${fD(l.data_pagamento)}</td><td class="num">${l.status==='Efetivada'?fmtNum(l.valor_pago ?? l.valor):''}</td><td>${statusLanc(l)}</td></tr>`).join('')}</tbody></table></div>
    <div class="acoes"><button class="btn sec" id="of_x">Cancelar</button>${ehAdmin() ? '<button class="btn perigo" id="of_del">Excluir operação</button>' : ''}</div></div>`;
  document.body.appendChild(m);
  m.querySelector('#of_x').onclick = () => m.remove();
  m.querySelectorAll('tr.clic').forEach(t => t.onclick = () => { m.remove(); formLancFin(FIN.lancs.find(l => l.id === t.dataset.id)); });
  if (m.querySelector('#of_del')) m.querySelector('#of_del').onclick = async () => {
    if (!await confirma(`Excluir esta operação inteira (${o.rows.length} linha(s))? Não dá para desfazer.`)) return;
    const r = await sb.from('lancamentos_financeiros').delete().in('id', o.rows.map(x => x.id));
    if (r.error) return aviso('Erro: ' + r.error.message);
    m.remove(); aviso('Operação excluída'); await carregarFin(true); render(); };
}


// ---------- novo lançamento financeiro (igual ao padrão: rateio por fazenda/centro de custo/plano, descontos e juros, valor da nota, parcelas e produtos) ----------

  const num = v => { v = String(v ?? '').trim(); if (!v) return 0; if (v.includes(',')) v = v.replace(/\./g,'').replace(',', '.'); return Number(v) || 0; };
