// relatório de taxa de lotação por área, calculada sobre a área efetiva
async function telaLotacao(){
  const fid = E.fazenda.id;
  const [{data:areas}, {data:mods}, {data:ma}, lotes] = await Promise.all([
    sb.from('areas').select('*').eq('fazenda_id', fid).eq('ativo', true),
    sb.from('modulos').select('id,nome').eq('fazenda_id', fid), sb.from('modulo_areas').select('modulo_id,area_id'), carregarLotes()]);
  const modDe = {}; (ma||[]).forEach(x => { const mm = (mods||[]).find(m => m.id === x.modulo_id); if (mm) modDe[x.area_id] = mm.nome; });
  const linhas = (areas||[]).map(a => { const ls = lotes.filter(l => l.area_id === a.id && l.quantidade > 0);
    const cab = ls.reduce((s,l) => s + l.quantidade, 0), kg = ls.reduce((s,l) => s + l.quantidade*Number(l.peso_medio||0), 0);
    const ha = Number(a.hectares) || 0, pct = Number(a.area_efetiva_pct ?? 100) || 100, haE = ha * pct / 100;
    return {a, mod:modDe[a.id] || '', tipo:a.tipo_uso || '', ha, pct, haE, cab, kg, ua:kg/450}; });
  const tipos = [...new Set(linhas.map(l => l.tipo).filter(Boolean))].sort();
  $('#corpo').innerHTML = `<div class="topo"><button class="voltar" id="volta">←</button><h2>Taxa de lotação</h2><button class="btn" id="aval">📐 Avaliar taxa de lotação</button><button class="btn sec" id="csv">Exportar planilha</button></div>
    <div class="filtros"><select id="l_mod"><option value="">Todos os módulos</option>${[...new Set(linhas.map(l => l.mod).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'pt',{numeric:true})).map(m => `<option>${esc(m)}</option>`).join('')}</select>
      <select id="l_tipo"><option value="">Todos os tipos de uso</option>${tipos.map(t => `<option ${t==='Pastagem'?'selected':''}>${esc(t)}</option>`).join('')}</select>
      <label class="chk" style="margin:0;flex:none;width:auto;gap:5px"><input type="checkbox" id="l_oc" style="width:auto"> Só áreas com gado</label>
      <input id="l_b" placeholder="Pesquisar área"></div>
    <div class="tabela"><table><thead><tr><th>Módulo</th><th>Área</th><th class="num">Área total (ha)</th><th class="num">Efetiva (%)</th><th class="num">Área efetiva (ha)</th>
      <th class="num">Cabeças</th><th class="num">Peso médio (kg)</th><th class="num">UA</th><th class="num">UA/ha efetiva</th><th class="num">kg/ha efetiva</th><th class="num">UA/ha total</th></tr></thead><tbody id="l_tb"></tbody></table></div>
    <div class="rodape" id="l_rod"></div>
    <div class="rodape">UA = 450 kg de peso vivo (peso projetado). A lotação é calculada sobre a área efetiva; "UA/ha total" mostra a mesma conta sobre a área inteira, para comparar.</div>`;
  $('#volta').onclick = () => ir('inicio');
  $('#aval').onclick = () => ir('avalotacao');
  let rowsCSV = [];
  const n = (v, d=2) => fmtNum(v, d);
  const desenhar = () => {
    const fm = $('#l_mod').value, ft = $('#l_tipo').value, oc = $('#l_oc').checked, b = semAcento($('#l_b').value.trim());
    const fil = linhas.filter(l => (!fm || l.mod === fm) && (!ft || l.tipo === ft) && (!oc || l.cab) && (!b || semAcento(l.a.codigo + ' ' + (l.a.nome||'')).includes(b)))
      .sort((x, y) => x.mod.localeCompare(y.mod, 'pt', {numeric:true}) || x.a.codigo.localeCompare(y.a.codigo, 'pt', {numeric:true}));
    $('#l_tb').innerHTML = fil.map(l => `<tr><td>${esc(l.mod || '–')}</td><td>${esc(l.a.codigo)}</td><td class="num">${n(l.ha)}</td><td class="num" style="${l.pct < 100 ? 'color:#c62828;font-weight:700' : ''}">${n(l.pct,0)}</td><td class="num">${n(l.haE)}</td>
      <td class="num">${l.cab ? fmtNum(l.cab,0) : '–'}</td><td class="num">${l.cab ? fmtNum(l.kg/l.cab,0) : '–'}</td><td class="num">${l.cab ? n(l.ua,1) : '–'}</td>
      <td class="num"><b>${l.cab && l.haE ? n(l.ua/l.haE) : '–'}</b></td><td class="num">${l.cab && l.haE ? fmtNum(l.kg/l.haE,0) : '–'}</td><td class="num">${l.cab && l.ha ? n(l.ua/l.ha) : '–'}</td></tr>`).join('')

    rowsCSV = fil.map(l => [l.mod, l.a.codigo, n(l.ha), n(l.pct,0), n(l.haE), l.cab, l.cab ? fmtNum(l.kg/l.cab,0) : '', l.cab ? n(l.ua,1) : '', l.cab && l.haE ? n(l.ua/l.haE) : '', l.cab && l.haE ? fmtNum(l.kg/l.haE,0) : '', l.cab && l.ha ? n(l.ua/l.ha) : '']);
  };

  desenhar();
}

const idade = n => { if (!n) return ''; const d = new Date(n+'T12:00:00'), h = new Date(); let m = (h.getFullYear()-d.getFullYear())*12 + h.getMonth()-d.getMonth(); if (h.getDate() < d.getDate()) m--; if (m < 0) m = 0; return (m >= 12 ? Math.floor(m/12)+'a' : '') + (m%12) + 'm'; };
const OPS_IND = {'Pesagem':{peso:1,obr:1}, 'Localização':{area:1}, 'Vacinação e sanidade':{proc:1}, 'Identificação eletrônica':{chip:1},
  'Troca de brinco':{brinco:1}, 'Morte':{causa:1, saida:1}, 'Venda':{peso:1, saida:1}, 'Abate para consumo':{peso:1, saida:1},
  'Transferência - Saída':{saida:1}, 'Exclusão':{saida:1}};
let cacheBase = null;
async function baseFazenda(){
  if (cacheBase && cacheBase.fid === E.fazenda.id) return cacheBase;
  const fid = E.fazenda.id;
  const [{data:areas}, {data:cats}, {data:procs}] = await Promise.all([
    sb.from('areas').select('id,codigo').eq('fazenda_id', fid).eq('ativo', true).order('codigo'),
    sb.from('categorias_manejo').select('id,nome,sexo,gmd_projetado,ativo').eq('fazenda_id', fid).order('nome'),
    sb.from('produtos').select('id,nome,dose_animal,carencia_dias,local_padrao_id').eq('fazenda_id', fid).eq('tipo_uso', 'Medicamentos e Vacinas').eq('ativo', true).order('nome')]);
  cacheBase = {fid, areas:areas||[], cats:cats||[], procs:(procs||[]).map(p => ({nome:p.nome, produto_id:p.id, dose:p.dose_animal, local_id:p.local_padrao_id, carencia_dias:p.carencia_dias})), areaPor:Object.fromEntries((areas||[]).map(a => [a.id, a.codigo])), catPor:Object.fromEntries((cats||[]).map(c => [c.id, c.nome])), gmdPor:Object.fromEntries((cats||[]).map(c => [c.id, Number(c.gmd_projetado)||0]))};
  cacheBase.cats = cacheBase.cats.filter(c => c.ativo !== false);
  return cacheBase;
}
// peso projetado: último peso + GMD da categoria em que o animal estava, dia a dia (troca de categoria muda o GMD a partir da data da troca)
function pesoProjetado(a, evCat, gmdPor, ate){
  if (!a.peso_atual || !a.data_peso) return null;
  ate = ate || hojeISO();
  const ev = (evCat || []).filter(e => e.categoria_id).sort((x,y) => x.data.localeCompare(y.data));
  let cat = ([...ev].reverse().find(e => e.data <= a.data_peso) || {}).categoria_id || (ev.find(e => e.data > a.data_peso) ? null : a.categoria_id) || a.categoria_id;
  let d = a.data_peso, p = Number(a.peso_atual);
  const dias = (x, y) => Math.max(0, (new Date(y) - new Date(x)) / 864e5);
  for (const e of ev.filter(e => e.data > a.data_peso && e.data <= ate)) { p += (gmdPor[cat] || 0) * dias(d, e.data); d = e.data; cat = e.categoria_id; }
  p += (gmdPor[cat] || 0) * dias(d, ate);
  return Math.round(p * 10) / 10;
}
const opcoes = (lista, sel, txt='nome') => '<option value="">— escolha —</option>' + lista.map(x => `<option value="${x.id}" ${x.id===sel?'selected':''}>${esc(x[txt])}</option>`).join('');

async function buscarAnimal(cod, fid){
  fid = fid || E.fazenda.id;
  const c = String(cod||'').trim().toUpperCase().replace(/[^A-Z0-9\-]/g,''); if (!c) return null;
  const d = c.replace(/\D/g,'');
  if (!navigator.onLine) return animalLocal(c, fid);
  let {data, error} = await sb.from('animais').select('*').eq('fazenda_id', fid).eq('ativo', true).or(`brinco.eq.${c},chip.eq.${c}` + (d && d !== c ? `,chip.eq.${d}` : '')).limit(2);
  if (error && ehRede({error})) return animalLocal(c, fid);
  if (!data?.length && d.length >= 12) ({data} = await sb.from('animais').select('*').eq('fazenda_id', fid).eq('ativo', true).like('chip', '%' + d.slice(-12)).limit(2));
  return (data||[])[0] || null;
}

    if (r.error) return erro(r.error.message.replace(/^.*?: /,''));

    let nota = '';
    const opL = {'Morte':'Morte', 'Abate para consumo':'Abate para consumo', 'Exclusão':'Ajuste de estoque - Saída', 'Venda':'Venda', 'Transferência - Saída':'Transferência entre fazendas - Saída'}[op];

}

// ---------- Leitor de chip (bastão) ----------
const soDig = s => String(s||'').replace(/\D/g,'');
const limpaCod = s => String(s||'').trim().toUpperCase().replace(/[^A-Z0-9\-]/g,'');
let LEITOR = null;
async function conectarBastao(cb){
  if (LEITOR) { LEITOR.cb = cb; aviso('Bastão já conectado'); return; }
  if (!('serial' in navigator)) return aviso('Neste aparelho, use o bastão no modo teclado (Bluetooth HID): ele escreve o número no campo sozinho.');
  try {
    const port = await navigator.serial.requestPort(); await port.open({baudRate: 9600});
    const dec = new TextDecoderStream(); port.readable.pipeTo(dec.writable).catch(() => {});
    const rd = dec.readable.getReader(); LEITOR = {port, rd, cb}; let buf = '';
    (async () => { try { while (true) { const {value, done} = await rd.read(); if (done) break; buf += value;
      let i; while ((i = buf.search(/[\r\n]/)) >= 0) { const ln = buf.slice(0, i).trim(); buf = buf.slice(i+1); if (ln && LEITOR?.cb) LEITOR.cb(ln); } } } catch(e) {} LEITOR = null; })();
    aviso('Bastão conectado');
  } catch(e) { aviso('Bastão não conectado: ' + e.message); }
}
// liga um campo ao leitor: Enter ou Tab do bastão dispara a busca
function campoLeitor(inp, acao){
  inp.onkeydown = e => { if ((e.key === 'Enter' || e.key === 'Tab') && inp.value.trim()) { e.preventDefault(); acao(inp.value); } };
  if (LEITOR) LEITOR.cb = v => { inp.value = v; acao(v); };
}

// ajusta o estoque do rebanho (lote) quando um animal individual muda de área ou categoria
// peso do lote = média dos brincos pesados naquela data (lança uma Pesagem no lote; só se a pesagem for a mais recente)
async function pesoLoteBrincos(pares, d){
  let n = 0;
  for (const k of new Set(pares)) { const [area, cat] = String(k).split('|'); if (!area || !cat) continue;
    const {data} = await sb.from('animais').select('peso_atual').eq('area_id', area).eq('categoria_id', cat).eq('ativo', true).eq('data_peso', d).limit(5000);
    const ps = (data || []).map(x => Number(x.peso_atual)).filter(x => x > 0); if (!ps.length) continue;
    const {data:l} = await sb.from('lotes').select('quantidade,data_peso,fazenda_id').eq('area_id', area).eq('categoria_id', cat).maybeSingle();
    if (!l || l.quantidade < 1 || (l.data_peso && String(l.data_peso).slice(0,10) > d)) continue;
    const media = Math.round(ps.reduce((s, x) => s + x, 0) / ps.length * 10) / 10;
    const r = await sb.rpc('lancar_operacao', {p:{fazenda_id:l.fazenda_id, operacao:'Pesagem', data:d, area_id:area, categoria_id:cat, area_destino_id:'', categoria_destino_id:'', quantidade:null, peso_medio:String(media), causa_morte:'', observacao:`Média de ${ps.length} brinco(s) pesado(s)`}});
    if (!r.error) n++; }
  return n ? ` · peso de ${n} lote(s) atualizado` : '';
}
async function sincLote(a, areaNova, catNova, d){
  if (!a.area_id || !a.categoria_id) return '';
  const {data:l} = await sb.from('lotes').select('quantidade').eq('area_id', a.area_id).eq('categoria_id', a.categoria_id).maybeSingle();
  if (!l || l.quantidade < 1) return ' (lote da área não ajustado: sem saldo)';
  const base = {fazenda_id:a.fazenda_id, data:d, quantidade:1, peso_medio:'', causa_morte:'', observacao:'Manejo individual brinco '+a.brinco, area_destino_id:'', categoria_destino_id:''};
  let r = {error:null};
  if (areaNova && areaNova !== a.area_id) r = await sb.rpc('lancar_operacao', {p:{...base, operacao:'Movimentação', area_id:a.area_id, categoria_id:a.categoria_id, area_destino_id:areaNova}});
  const areaAt = areaNova || a.area_id;
  if (!r.error && catNova && catNova !== a.categoria_id) r = await sb.rpc('lancar_operacao', {p:{...base, operacao:'Mudança de categoria', area_id:areaAt, categoria_id:a.categoria_id, categoria_destino_id:catNova}});
  return r.error ? ' (lote não ajustado: ' + r.error.message.replace(/^.*?: /,'') + ')' : '';
}

      ${tem('peso') ? '<label>Peso (kg) *</label><input id="m_peso" type="number" inputmode="decimal" step="0.1" style="font-size:22px">' : ''}
      ${tem('dg') ? (a.sexo === 'F' ? '<label>Diagnóstico *</label><div style="display:flex;gap:8px"><button class="btn sec" id="dg_p" style="flex:1;min-height:50px">Prenhe</button><button class="btn sec" id="dg_v" style="flex:1;min-height:50px">Vazia</button></div>' : '<div class="rodape">Macho: diagnóstico não se aplica.</div>') : ''}
      ${tem('chip') ? `<label>Chip</label><input id="m_chip" inputmode="numeric" value="${esc(a.chip||'')}" placeholder="passe o bastão no chip novo">` : ''}
      <label>Observação</label><input id="m_obs">
      <div class="acoes"><button class="btn sec" id="m_ed">Editar cadastro</button><button class="btn sec" id="m_x">Pular</button><button class="btn" id="m_ok">Registrar</button></div></div>`;
    const pf = $('#m_peso');
    if (pf) { pf.focus(); pf.onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); if (soDig(pf.value).length > 6) { const v2 = pf.value; pf.value = ''; $('#m_cod').value = v2; ler(v2); } else registrar(); } }; }
    else $('#m_ok').focus();
    const marca = x => { dg = x; $('#dg_p').className = 'btn' + (x==='P'?'':' sec'); $('#dg_v').className = 'btn' + (x==='V'?' perigo':' sec'); };
    if ($('#dg_p')) { $('#dg_p').onclick = () => marca('P'); $('#dg_v').onclick = () => marca('V'); }
    $('#m_ed').onclick = () => formEditarAnimal(a, () => ler(a.brinco));
    $('#m_x').onclick = () => { atual = null; $('#m_ani').innerHTML = ''; $('#m_cod').value = ''; $('#m_cod').focus(); };
    $('#m_ok').onclick = registrar;
  };
  const registrar = async () => {
    const a = atual; if (!a) return;
    const tem = k => S.acoes.includes(k), d = S.data, obs = $('#m_obs').value.trim();
    const peso = $('#m_peso') ? $('#m_peso').value.replace(',','.') : '';
    if (!S.acoes.length) return aviso('Marque o que vai fazer nos animais');
    if (tem('peso') && !(Number(peso) > 0)) return aviso('Informe o peso');
    if (tem('area') && !S.area) return aviso('Escolha a área de destino lá em cima');
    if (tem('cat') && !S.cat) return aviso('Escolha a nova categoria lá em cima');
    if (tem('san') && !S.proc.trim()) return aviso('Informe a vacina ou procedimento lá em cima');
    if (tem('dg') && a.sexo === 'F' && !dg) return aviso('Toque em Prenhe ou Vazia');
    $('#m_ok').disabled = true;
    const feito = [], erros = []; let gmd = '';
    let naFila = false;
    const ind = async (op, extra) => { const r = await rpcF('lancar_individual', {p:{animal_id:a.id, operacao:op, data:d, observacao:obs, ...extra}}, op + ' ' + a.brinco); if (r.fila) { naFila = true; return true; } if (r.error) erros.push(op + ': ' + r.error.message.replace(/^.*?: /,'')); return !r.error; };
    if (tem('peso') && await ind('Pesagem', {peso})) {
      feito.push(fmtNum(peso,0) + ' kg');
      S.pes = S.pes || []; S.pes.push({k:((tem('area') && S.area) || a.area_id) + '|' + ((tem('cat') && S.cat) || a.categoria_id), d});
      if (a.peso_atual && a.data_peso) { const dias = (new Date(d) - new Date(a.data_peso)) / 864e5; if (dias > 0) gmd = fmtNum((peso - a.peso_atual)/dias, 3); }
    }
    const novaA = tem('area') && S.area !== a.area_id ? S.area : '', novaC = tem('cat') && S.cat !== a.categoria_id ? S.cat : '';
    if (novaA || novaC) {
      if (!novaA && !a.area_id) erros.push('Categoria: animal sem área, mude a área junto');
      else if (await ind('Localização', {area_id:novaA || a.area_id, categoria_id:novaC})) {
        feito.push([novaA ? '→ ' + B.areaPor[novaA] : '', novaC ? '→ ' + B.catPor[novaC] : ''].filter(Boolean).join(' ') + (navigator.onLine ? await sincLote(a, novaA, novaC, d) : ' (lote: ajuste quando tiver internet)'));
      }
    }
    if (tem('san') && await ind('Vacinação e sanidade', {procedimentos:S.proc.trim()})) {
      feito.push(S.proc.trim());
      const pr = B.procs.find(x => x.nome.toLowerCase() === S.proc.trim().toLowerCase());
      if (!pr) { /* nome digitado livre: registra no animal, sem baixa no estoque */ }
      else if (pr.produto_id && Number(pr.dose) > 0 && pr.local_id && navigator.onLine) {
        // baixa no estoque: um movimento por procedimento no dia, somando as doses
        S.baixas = S.baixas || {}; const k = pr.produto_id + '|' + d, bx = S.baixas[k];
        if (bx) { const nq = Math.round((bx.q + Number(pr.dose)) * 1000) / 1000; const r = await sb.from('movimentos_estoque').update({quantidade:-nq, observacao:`Manejo no curral: ${pr.nome} (${Math.round(nq/Number(pr.dose))} animais)`}).eq('id', bx.id); if (!r.error) bx.q = nq; }
        else { const r = await sb.from('movimentos_estoque').insert({fazenda_id:fid, data:d, tipo:'Consumo', produto_id:pr.produto_id, local_id:pr.local_id, quantidade:-Number(pr.dose), observacao:`Manejo no curral: ${pr.nome} (1 animal)`}).select('id').single(); if (!r.error) S.baixas[k] = {id:r.data.id, q:Number(pr.dose)}; }
      }
    }
    const repro = async (op, extra) => { const r = await rpcF('lancar_reprodutivo', {p:{fazenda_id:fid, operacao:op, data:d, brincos:[a.brinco], observacao:obs, ...extra}}, op + ' ' + a.brinco); if (r.fila) { naFila = true; return true; }
      if (r.error) erros.push(op + ': ' + r.error.message.replace(/^.*?: /,'')); else if (r.data?.erros?.length) erros.push(r.data.erros.join(', ')); return !r.error && !r.data?.erros?.length; };
    if (tem('ia')) { if (a.sexo !== 'F') erros.push('Inseminação: não é fêmea'); else if (await repro('Inseminação', {tipo_cobertura:S.tcob, reprodutor:S.repr})) feito.push(S.tcob + (S.repr ? ' ' + S.repr : '')); }
    if (tem('dg') && a.sexo === 'F' && await repro('Diagnóstico de gestação', {diagnostico: dg === 'P'})) feito.push(dg === 'P' ? 'Prenhe' : 'Vazia');
    const chipN = $('#m_chip') ? soDig($('#m_chip').value) || $('#m_chip').value.trim() : '';
    if (tem('chip') && chipN && chipN !== a.chip && await ind('Identificação eletrônica', {chip:chipN})) feito.push('chip ' + chipN);
    $('#m_ok').disabled = false;
    const hm = new Date().toTimeString().slice(0,5);
    S.feitos.unshift({h:hm, id:a.id, brinco:a.brinco, peso:tem('peso') ? peso : '', gmd, dg: tem('dg') && a.sexo === 'F' && feito.some(x => x === 'Prenhe' || x === 'Vazia') ? dg : '', feito:(naFila ? '⏳ sem internet, na fila · ' : '') + feito.join(' · '), erro:erros.join(' · ')});
    salvar(); desenhar();
    aviso(erros.length ? 'Atenção: ' + erros[0] : `${a.brinco} registrado`);
    atual = null; $('#m_ani').innerHTML = ''; $('#m_cod').value = ''; $('#m_cod').focus();
  };
  campoLeitor($('#m_cod'), ler);
  $('#m_bt').onclick = () => conectarBastao(v => { $('#m_cod').value = v; ler(v); });
  $('#m_limpa').onclick = async () => { if (!confirm('Encerrar o manejo e limpar a lista? Os lançamentos já gravados continuam no sistema e o peso dos lotes pesados é atualizado pela média dos brincos.')) return;
    let t = ''; if ((S.pes || []).length && navigator.onLine) { const porD = {}; S.pes.forEach(x => (porD[x.d] = porD[x.d] || []).push(x.k)); for (const d in porD) t += await pesoLoteBrincos(porD[d], d); }
    S.feitos = []; S.pes = []; salvar(); desenhar(); aviso('Manejo encerrado' + t); };
  $('#csv').onclick = () => baixarCSV('Manejo ' + fmtData(S.data+'T12:00:00'), ['Hora','Brinco','Peso (kg)','GMD','Feito','Erro'], S.feitos.map(f => [f.h, f.brinco, f.peso, f.gmd, f.feito, f.erro]));
  desenhar(); $('#m_cod').focus();
}

// ---------- Manejo de curral (sessão por etapas, igual à sessão de manejo do app de campo) ----------

    c:{forn:'', gta:'', area:'', cat:''}, procs:[], tcob:'IATF', repr:'', prot:'', dArea:'', dCat:'', lotes:[], currais:[], animais:[], pes:[]});
  S = S || novo(); S.v = S.v || {}; S.c = S.c || {};
  S.ops = (S.ops || []).filter(o => OPS_CUR.includes(o));
  const salvar = () => { try { localStorage.setItem(chave, JSON.stringify(S)); } catch(e) {} };
  const tem = o => S.ops.includes(o);
  const ir2 = et => { S.etapa = et; salvar(); desenha(); };
  const barra = (sub, volta) => { const h = `<div class="barraMenu" id="volta"><span>≡ Menu › 🐂 Manejo de curral${sub ? ' › ' + esc(sub) : ''}</span><span>◀ voltar</span></div>`;
    setTimeout(() => { const b = $('#volta'); if (b) b.onclick = volta; }, 0); return h; };
  const sairMenu = () => { E.grupo = null; ir('inicio'); };
  let pessoas = null;
  const carregaPessoas = async () => { if (pessoas) return pessoas; try { const {data} = await sb.from('pessoas').select('nome').order('nome').limit(3000); pessoas = [...new Set((data || []).map(p => p.nome).filter(Boolean))]; } catch(e) { pessoas = []; } return pessoas; };
  const linha = (...c) => `<div style="display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end">${c.join('')}</div>`;
  const campo = (rot, html, flex = 1, min = 160) => `<div style="flex:${flex};min-width:${min}px"><label>${rot}</label>${html}</div>`;

  // ===== 1. sessão =====
  const etSessao = async () => {

    $('#corpo').innerHTML = barra('Nova sessão', sairMenu) + `<div class="acoesTab"><button class="btn sec" id="c_hist">🕘 Sessões anteriores</button></div>
      <div class="tabela" style="padding:14px">
        ${linha(campo('Data *', `<input id="c_data" type="date" max="${hojeISO()}" value="${S.data}">`, 'none', 0), campo('Nome do registro *', `<input id="c_nome" value="${esc(S.nome)}">`, 2, 220))}
        <label>Operações * <span class="rodape">(marque as que vai fazer neste manejo)</span></label>
        <div class="grade" style="grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px">${OPS_CUR.map(o => `<label class="chk" style="margin:0;padding:10px 12px;border:1.5px solid ${tem(o) ? '#2e6b34' : 'var(--borda)'};border-radius:10px;background:${tem(o) ? '#eef4e6' : '#fff'}"><input type="checkbox" data-op="${o}" ${tem(o) ? 'checked' : ''}> ${o}</label>`).join('')}</div>
        <div id="c_extra"></div>
        <label>Detalhes</label><textarea id="c_det" rows="2">${esc(S.det)}</textarea>
        <div class="msg erro" id="c_err" style="display:none"></div>
        <div class="acoes">${S.animais.length ? '<button class="btn sec" id="c_cont">Voltar para os animais</button>' : ''}<button class="btn" id="c_av">Avançar</button></div></div>`;
    const extra = () => {
      let h = '';
      if (tem('Venda')) h += `<div class="secao" style="margin-top:14px">Venda</div>
        ${linha(campo('Tipo de venda *', `<select id="v_tipo"><option value="Abate" ${S.v.tipo === 'Abate' ? 'selected' : ''}>Abate</option><option value="Recria" ${S.v.tipo === 'Recria' ? 'selected' : ''}>Recria (animais vivos)</option></select>`, 'none', 0),
          campo('Cliente *', `<input id="v_cli" list="v_clil" value="${esc(S.v.cliente)}"><datalist id="v_clil">${pes.map(p => `<option value="${esc(p)}">`).join('')}</datalist>`, 2, 200),
          campo('Data de chegada', `<input id="v_che" type="date" value="${S.v.chegada || ''}">`, 'none', 0))}
        ${linha(campo('Número da GTA', `<input id="v_gta" value="${esc(S.v.gta)}">`, 1, 140), campo('Emissão da GTA', `<input id="v_gem" type="date" value="${S.v.gtaEm || ''}">`, 'none', 0), campo('Validade da GTA', `<input id="v_gval" type="date" value="${S.v.gtaVal || ''}">`, 'none', 0))}`;
      if (tem('Compra')) h += `<div class="secao" style="margin-top:14px">Compra</div>
        ${linha(campo('Fornecedor *', `<input id="k_for" list="k_forl" value="${esc(S.c.forn)}"><datalist id="k_forl">${pes.map(p => `<option value="${esc(p)}">`).join('')}</datalist>`, 2, 200), campo('Número da GTA', `<input id="k_gta" value="${esc(S.c.gta)}">`, 1, 140))}
        ${linha(campo('Área de entrada', `<select id="k_area">${opcoes(B.areas, S.c.area, 'codigo')}</select>`), campo('Categoria', `<select id="k_cat">${opcoes(B.cats, S.c.cat)}</select>`))}`;
      if (tem('Vacinação e sanidade')) h += `<div class="secao" style="margin-top:14px">Vacinas e procedimentos aplicados em cada animal *</div>
        <div class="grade" style="grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:6px">${B.procs.map(p => `<label class="chk" style="margin:0"><input type="checkbox" data-pr="${esc(p.nome)}" ${S.procs.includes(p.nome) ? 'checked' : ''}> ${esc(p.nome)}</label>`).join('') || '<span class="rodape">Nenhuma vacina cadastrada em Produtos.</span>'}</div>
        <label>Outro (digite)</label><input id="p_out" value="${esc(S.procs.filter(x => !B.procs.some(p => p.nome === x)).join(', '))}" placeholder="Ex.: Vermífugo, brucelose">`;
      if (tem('Inseminação')) h += `<div class="secao" style="margin-top:14px">Inseminação</div>
        ${linha(campo('Tipo de cobertura', `<select id="i_tcob">${['IATF','IA','Monta natural','Repasse'].map(t => `<option ${t === S.tcob ? 'selected' : ''}>${t}</option>`).join('')}</select>`, 'none', 0), campo('Touro / sêmen', `<input id="i_repr" value="${esc(S.repr)}">`, 2, 200))}`;
      if (tem('Protocolo reprodutivo')) h += `<div class="secao" style="margin-top:14px">Protocolo reprodutivo</div>${linha(campo('Protocolo / dia (ex.: D0 implante)', `<input id="pr_nome" value="${esc(S.prot)}">`, 2, 220))}`;
      if (tem('Desmama')) h += `<div class="secao" style="margin-top:14px">Desmama <span class="rodape">(opcional: os desmamados mudam de área e categoria)</span></div>
        ${linha(campo('Nova área', `<select id="d_area">${opcoes(B.areas, S.dArea, 'codigo')}</select>`), campo('Nova categoria', `<select id="d_cat">${opcoes(B.cats, S.dCat)}</select>`))}`;
      $('#c_extra').innerHTML = h;

      liga('v_tipo', v => S.v.tipo = v); liga('v_cli', v => S.v.cliente = v.trim()); liga('v_che', v => S.v.chegada = v); liga('v_gta', v => S.v.gta = v.trim()); liga('v_gem', v => S.v.gtaEm = v); liga('v_gval', v => S.v.gtaVal = v);
      liga('k_for', v => S.c.forn = v.trim()); liga('k_gta', v => S.c.gta = v.trim()); liga('k_area', v => S.c.area = v); liga('k_cat', v => S.c.cat = v);
      liga('i_tcob', v => S.tcob = v); liga('i_repr', v => S.repr = v.trim()); liga('pr_nome', v => S.prot = v.trim()); liga('d_area', v => S.dArea = v); liga('d_cat', v => S.dCat = v);
      const procs = () => { S.procs = [...document.querySelectorAll('[data-pr]:checked')].map(x => x.dataset.pr).concat(($('#p_out')?.value || '').split(',').map(x => x.trim()).filter(Boolean)); salvar(); };

    };
    document.querySelectorAll('[data-op]').forEach(c => c.onchange = () => { S.ops = OPS_CUR.filter(o => document.querySelector(`[data-op="${o}"]`).checked);

  // ===== 3. currais (apartação) =====
  const etCurrais = () => {
    const des = () => {
      $('#corpo').innerHTML = barra(S.nome + ' › Currais', () => ir2(S.ops.length === 1 && tem('Compra') ? 'sessao' : 'lotes')) + `<div class="tabela" style="padding:14px">
        <div class="rodape" style="margin-top:0">Configure a divisão dos currais para onde os animais serão apartados. Se escolher área ou categoria, o animal muda na hora em que for registrado.</div>
        ${S.currais.map((c, i) => `<div style="border:1.5px solid var(--borda);border-radius:12px;padding:10px 12px;margin-top:10px">
          <div style="display:flex;justify-content:space-between;align-items:center"><b>${i + 1}º curral</b>${S.currais.length > 1 ? `<button class="btn perigo peq" data-del="${i}">🗑</button>` : ''}</div>
          ${linha(campo('Nome do curral *', `<input data-cn="${i}" value="${esc(c.nome)}">`, 2, 180), campo('Mandar para a área', `<select data-ca="${i}">${opcoes(B.areas, c.area, 'codigo')}</select>`), campo('Nova categoria', `<select data-cc="${i}">${opcoes(B.cats, c.cat)}</select>`))}
          ${tem('Venda') ? `<label class="chk"><input type="checkbox" data-cv="${i}" ${c.venda ? 'checked' : ''}> Animais deste curral vão para a venda</label>` : ''}</div>`).join('')}
        <div class="acoes" style="justify-content:flex-start"><button class="btn sec" id="cu_novo">＋ Novo curral</button></div>
        <div class="acoes"><button class="btn" id="cu_ok">Salvar</button></div></div>`;
      document.querySelectorAll('[data-cn]').forEach(x => x.oninput = () => { S.currais[x.dataset.cn].nome = x.value; salvar(); });
      document.querySelectorAll('[data-ca]').forEach(x => x.onchange = () => { S.currais[x.dataset.ca].area = x.value; salvar(); });
      document.querySelectorAll('[data-cc]').forEach(x => x.onchange = () => { S.currais[x.dataset.cc].cat = x.value; salvar(); });
      document.querySelectorAll('[data-cv]').forEach(x => x.onchange = () => { S.currais[x.dataset.cv].venda = x.checked; salvar(); });
      document.querySelectorAll('[data-del]').forEach(x => x.onclick = () => { S.currais.splice(+x.dataset.del, 1); salvar(); des(); });
      $('#cu_novo').onclick = () => { S.currais.push({nome:'', venda:false, area:'', cat:''}); salvar(); des(); document.querySelector(`[data-cn="${S.currais.length - 1}"]`)?.focus(); };
      $('#cu_ok').onclick = () => { if (S.currais.some(c => !String(c.nome).trim())) return aviso('Dê nome a todos os currais'); ir2('animais'); };
    };
    des();
  };

  // ===== 4. animais =====
  const etAnimais = () => {
    const lotesTxt = () => { if (!S.lotes.length) return '';
      const cont = {}; S.animais.forEach(x => { const kk = x.area_id + '|' + x.categoria_id; cont[kk] = (cont[kk] || 0) + 1; });
      return S.lotes.map(l => `<span class="pill" style="margin:2px">${esc(l.area)} · ${esc(l.cat)}: <b>${cont[l.k] || 0}</b> de ${l.qtd}</span>`).join(''); };
    $('#corpo').innerHTML = barra(S.nome, sairMenu) + `<div class="tabela" style="padding:14px">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap"><div><div style="font-size:22px;font-weight:800">${esc(S.nome)}</div><div class="rodape" style="margin:0">${fD(S.data)} · ${esc(S.ops.join(', '))}</div></div>
        <div style="display:flex;gap:6px;flex-wrap:wrap"><button class="btn sec" id="a_cfg" title="Alterar a sessão">⚙️ Sessão</button>${tem('Apartação') ? '<button class="btn sec" id="a_cur">Currais</button>' : ''}<button class="btn sec" id="a_bt" title="Conectar bastão">📡 Bastão</button><button class="btn sec" id="a_res">👁 Resumo</button><button class="btn" id="a_fim">✓ Finalizar</button></div></div>
      <div style="margin-top:8px"><b>Animais na sessão: <span id="a_n">${S.animais.length}</span></b> <span id="a_lot">${lotesTxt()}</span></div>
      <label>Identificação eletrônica ou visual (brinco ou chip)</label><input id="a_cod" autocomplete="off" inputmode="numeric" style="font-size:22px">
      <div id="a_ani"></div></div>
      <div class="secao">Últimos registrados</div>
      <div class="tabela"><table><thead><tr><th>Hora</th><th>Brinco</th><th class="num">Peso</th><th class="num">GMD</th>${tem('Apartação') ? '<th>Curral</th>' : ''}<th>O que foi feito</th></tr></thead><tbody id="a_tb"></tbody></table></div>`;
    const tabela = () => {
      $('#a_n').textContent = S.animais.length; $('#a_lot').innerHTML = lotesTxt();
      $('#a_tb').innerHTML = S.animais.slice(0, 30).map(f => `<tr><td>${esc(f.h)}</td><td><b>${esc(f.brinco)}</b></td><td class="num">${fmtNum(f.peso, 1)}</td><td class="num">${f.gmd ?? ''}</td>${tem('Apartação') ? `<td>${esc(f.curral || '')}</td>` : ''}<td>${esc(f.feito)}${f.erro ? ` <span style="color:var(--vermelho)">${esc(f.erro)}</span>` : ''}</td></tr>`).join('') || `<tr><td colspan="6" class="vazio">Nenhum animal ainda</td></tr>`;
    };
    let atual = null, esc1 = {};
    const limpa = () => { atual = null; esc1 = {}; $('#a_ani').innerHTML = ''; $('#a_cod').value = ''; $('#a_cod').focus(); };
    const ler = async v => {
      const a = await buscarAnimal(v); atual = a; esc1 = {dg:null, esc:null, av:null, curral: S.currais.length === 1 ? 0 : null};
      if (!a) {
        $('#a_ani').innerHTML = `<div style="background:#f3b54a;border-radius:12px;padding:14px;margin-top:10px;text-align:center"><div style="font-weight:700;color:#4a3000">⚠️ Atenção! Animal não identificado: ${esc(limpaCod(v))}</div>
          ${podeEditar() ? '<button class="btn" id="a_cad" style="margin-top:10px;width:100%">Cadastrar novo animal</button>' : ''}</div>`;
        if ($('#a_cad')) $('#a_cad').onclick = () => { const c = limpaCod(v);
          formNovoAnimal(tem('Compra') ? 'Compra' : 'Cadastro', {...(soDig(c).length >= 12 ? {chip:soDig(c)} : {brinco:c}), area_id:S.c.area || '', categoria_id:S.c.cat || ''});
          const t = setInterval(() => { if (!document.querySelector('.modal')) { clearInterval(t); $('#a_cod').value = c; ler(c); } }, 400); };
        $('#a_cod').select(); return;
      }
      const ja = S.animais.find(f => f.id === a.id);
      const info = (r, v) => `<div><div class="rodape" style="margin:0;font-size:11.5px">${r}</div><div style="font-weight:700">${v || '–'}</div></div>`;
      const bts = (id, arr, sel) => `<div style="display:flex;gap:6px;flex-wrap:wrap" id="${id}">${arr.map(([v, t]) => `<button class="btn ${String(v) === String(sel) ? '' : 'sec'}" data-v="${v}" style="flex:1;min-width:60px;min-height:48px">${t}</button>`).join('')}</div>`;
      $('#a_ani').innerHTML = `<div style="border:2px solid var(--verde);border-radius:12px;padding:12px;margin-top:10px">
        <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;align-items:start">
          ${info('Id. visual', `<span style="font-size:20px">${esc(a.brinco)}</span>`)}${info('Id. eletrônica', esc(a.chip || ''))}${info('Sexo', a.sexo === 'M' ? 'Macho' : a.sexo === 'F' ? 'Fêmea' : '')}${info('Raça', esc(a.raca || ''))}
          ${info('Idade', a.data_nascimento ? idade(a.data_nascimento) : '')}${info('Categoria', esc(B.catPor[a.categoria_id] || ''))}${info('Área', esc(B.areaPor[a.area_id] || ''))}${info('Último peso', a.peso_atual ? fmtNum(a.peso_atual, 1) + ' kg' + (a.data_peso ? ' em ' + fD(a.data_peso) : '') : '')}
          ${a.situacao_reprodutiva ? info('Reprodução', esc(a.situacao_reprodutiva)) : ''}</div>
        <div style="text-align:right"><button class="btn sec peq" id="a_ed">✏️ Editar cadastro</button></div>
        ${ja ? '<div class="msg erro" style="display:block;background:#fff4e0;color:#8a5a00">Este animal já passou nesta sessão. Se registrar de novo, lança outra vez.</div>' : ''}
        ${tem('Pesagem') ? `<label>Peso (kg) *</label><input id="a_peso" type="number" inputmode="decimal" step="0.1" style="font-size:22px">
          <div style="display:flex;gap:8px;margin-top:8px"><div class="pill" style="flex:1;text-align:center;padding:10px;font-size:15px">GMD = <b id="a_gmd">–</b></div><div class="pill" style="flex:1;text-align:center;padding:10px;font-size:15px">Taxa de ganho (%) = <b id="a_tx">–</b></div></div>` : ''}
        ${tem('Apartação') ? `<label>Curral *</label>${bts('b_cur', S.currais.map((c, i) => [i, esc(c.nome)]), esc1.curral)}` : ''}
        ${tem('Diagnóstico de gestação') ? (a.sexo === 'F' ? `<label>Diagnóstico de gestação *</label>${bts('b_dg', [['P', 'Prenhe'], ['V', 'Vazia']], '')}` : '<div class="rodape">Diagnóstico: macho, não se aplica.</div>') : ''}
        ${tem('Avaliação reprodutiva') ? `<label>Avaliação reprodutiva</label>${bts('b_av', [['Apta', 'Apta'], ['Inapta', 'Inapta'], ['Descarte', 'Descarte']], '')}` : ''}
        ${tem('Medição de escore corporal') ? `<label>Escore corporal</label>${bts('b_esc', [1, 1.5, 2, 2.5, 3, 3.5, 4, 4.5, 5].map(x => [x, String(x).replace('.', ',')]), '')}` : ''}
        ${tem('Identificação eletrônica') ? `<label>Chip (identificação eletrônica)</label><input id="a_chip" inputmode="numeric" value="${esc(a.chip || '')}" placeholder="passe o bastão no chip">` : ''}
        ${tem('Vacinação e sanidade') ? `<label>Vacinas / procedimentos</label><div style="display:flex;gap:10px;flex-wrap:wrap">${S.procs.map(p => `<label class="chk" style="margin:0"><input type="checkbox" class="a_pr" value="${esc(p)}" checked> ${esc(p)}</label>`).join('')}</div>` : ''}
        ${tem('Inseminação') ? `<div class="rodape">Inseminação: ${esc(S.tcob)}${S.repr ? ' · ' + esc(S.repr) : ''}${a.sexo !== 'F' ? ' (não é fêmea)' : ''}</div>` : ''}
        ${tem('Protocolo reprodutivo') ? `<div class="rodape">Protocolo: ${esc(S.prot || '–')}</div>` : ''}
        ${tem('Desmama') ? `<div class="rodape">Desmama${S.dArea ? ' → ' + esc(B.areaPor[S.dArea]) : ''}${S.dCat ? ' → ' + esc(B.catPor[S.dCat]) : ''}</div>` : ''}
        ${tem('Venda') && !tem('Apartação') ? '<div class="rodape">Este animal entra na venda.</div>' : ''}
        <label>Tags / observação</label><input id="a_obs" placeholder="Ex.: manco, olho, refugo">
        <div class="acoes"><button class="btn sec" id="a_pul">Pular</button><button class="btn" id="a_ok" style="min-width:160px">Próximo</button></div></div>`;
      const grupo = (id, k) => { const g = $('#' + id); if (!g) return; g.querySelectorAll('[data-v]').forEach(b => b.onclick = () => { esc1[k] = b.dataset.v; g.querySelectorAll('[data-v]').forEach(x => x.className = 'btn' + (x === b ? '' : ' sec')); }); };
      grupo('b_cur', 'curral'); grupo('b_dg', 'dg'); grupo('b_av', 'av'); grupo('b_esc', 'esc');
      if (esc1.curral != null) $('#b_cur')?.querySelector(`[data-v="${esc1.curral}"]`)?.classList.remove('sec');
      const pf = $('#a_peso');
      if (pf) { pf.focus();
        pf.oninput = () => { const p = Number(pf.value.replace(',', '.')); let g = '–', t = '–';
          if (p > 0 && a.peso_atual) { t = fmtNum((p - a.peso_atual) / a.peso_atual * 100, 1); if (a.data_peso) { const d = (new Date(S.data) - new Date(a.data_peso)) / 864e5; if (d > 0) g = fmtNum((p - a.peso_atual) / d, 3); } }
          $('#a_gmd').textContent = g; $('#a_tx').textContent = t; };
        pf.onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); if (soDig(pf.value).length > 6) { const v2 = pf.value; pf.value = ''; $('#a_cod').value = v2; ler(v2); } else registrar(); } }; }
      else $('#a_ok').focus();
      $('#a_ed').onclick = () => formEditarAnimal(a, () => ler(a.brinco));
      $('#a_pul').onclick = limpa;
      $('#a_ok').onclick = registrar;
    };
    const registrar = async () => {
      const a = atual; if (!a) return;
      const d = S.data, obs = $('#a_obs').value.trim(), peso = $('#a_peso') ? $('#a_peso').value.replace(',', '.') : '';
      if (tem('Pesagem') && !(Number(peso) > 0)) return aviso('Informe o peso');
      if (tem('Apartação') && esc1.curral == null) return aviso('Escolha o curral');
      if (tem('Diagnóstico de gestação') && a.sexo === 'F' && !esc1.dg) return aviso('Toque em Prenhe ou Vazia');
      $('#a_ok').disabled = true;
      const feito = [], erros = []; let naFila = false, gmd = null, taxa = null;
      const ind = async (op, extra) => { const r = await rpcF('lancar_individual', {p:{animal_id:a.id, operacao:op, data:d, observacao:[obs, S.nome].filter(Boolean).join(' · '), ...extra}}, op + ' ' + a.brinco);
        if (r.fila) { naFila = true; return true; } if (r.error) erros.push(op + ': ' + r.error.message.replace(/^.*?: /, '')); return !r.error; };
      const repro = async (op, extra) => { const r = await rpcF('lancar_reprodutivo', {p:{fazenda_id:fid, operacao:op, data:d, brincos:[a.brinco], observacao:[obs, S.nome].filter(Boolean).join(' · '), ...extra}}, op + ' ' + a.brinco);
        if (r.fila) { naFila = true; return true; } if (r.error) erros.push(op + ': ' + r.error.message.replace(/^.*?: /, '')); else if (r.data?.erros?.length) erros.push(r.data.erros.join(', ')); return !r.error && !r.data?.erros?.length; };
      const cur = tem('Apartação') ? S.currais[esc1.curral] : null;
      let novaA = cur?.area || '', novaC = cur?.cat || '';
      if (tem('Desmama')) { novaA = novaA || S.dArea; novaC = novaC || S.dCat; }
      if (tem('Pesagem') && await ind('Pesagem', {peso})) {
        feito.push(fmtNum(peso, 1) + ' kg');
        S.pes.push((novaA || a.area_id) + '|' + (novaC || a.categoria_id));
        if (a.peso_atual) { taxa = fmtNum((peso - a.peso_atual) / a.peso_atual * 100, 1); if (a.data_peso) { const dias = (new Date(d) - new Date(a.data_peso)) / 864e5; if (dias > 0) gmd = fmtNum((peso - a.peso_atual) / dias, 3); } }
      }
      if (novaA === a.area_id) novaA = ''; if (novaC === a.categoria_id) novaC = '';
      // mudança de área / categoria fica guardada e só é lançada ao finalizar o manejo
      let mov = null;
      if (novaA || novaC) {
        if (!novaA && !a.area_id) erros.push('Categoria: animal sem área');
        else { mov = {area:novaA, cat:novaC}; feito.push([novaA ? '→ ' + B.areaPor[novaA] : '', novaC ? '→ ' + B.catPor[novaC] : ''].filter(Boolean).join(' ') + ' (ao finalizar)'); }
      }
      if (cur) { if (await ind('Apartação', {procedimentos:cur.nome})) feito.push('curral ' + cur.nome); }
      if (tem('Desmama') && await ind('Desmama', {})) feito.push('desmamado');
      if (tem('Vacinação e sanidade')) { const pr = [...document.querySelectorAll('.a_pr:checked')].map(x => x.value); if (pr.length && await ind('Vacinação e sanidade', {procedimentos:pr.join(', ')})) feito.push(pr.join(', ')); }
      if (tem('Medição de escore corporal') && esc1.esc && await ind('Escore corporal', {procedimentos:'Escore ' + String(esc1.esc).replace('.', ',')})) feito.push('escore ' + String(esc1.esc).replace('.', ','));
      if (tem('Avaliação reprodutiva') && esc1.av && await ind('Avaliação reprodutiva', {procedimentos:esc1.av})) feito.push(esc1.av);
      if (tem('Protocolo reprodutivo') && S.prot && await ind('Protocolo reprodutivo', {procedimentos:S.prot})) feito.push(S.prot);
      if (tem('Inseminação')) { if (a.sexo !== 'F') erros.push('Inseminação: não é fêmea'); else if (await repro('Inseminação', {tipo_cobertura:S.tcob, reprodutor:S.repr})) feito.push(S.tcob + (S.repr ? ' ' + S.repr : '')); }
      if (tem('Diagnóstico de gestação') && a.sexo === 'F' && await repro('Diagnóstico de gestação', {diagnostico:esc1.dg === 'P'})) feito.push(esc1.dg === 'P' ? 'Prenhe' : 'Vazia');
      const chipN = $('#a_chip') ? soDig($('#a_chip').value) || $('#a_chip').value.trim() : '';
      if (tem('Identificação eletrônica') && chipN && chipN !== a.chip && await ind('Identificação eletrônica', {chip:chipN})) feito.push('chip ' + chipN);
      if (tem('Venda') && (!tem('Apartação') || cur?.venda)) feito.push('vai para a venda');
      $('#a_ok').disabled = false;
      const reg = {h:new Date().toTimeString().slice(0, 5), id:a.id, brinco:a.brinco, chip:chipN || a.chip || '', sexo:a.sexo, area_id:a.area_id, categoria_id:a.categoria_id, ant:a.peso_atual,
        peso:tem('Pesagem') ? peso : '', gmd, taxa, curral:cur?.nome || '', mov, venda:tem('Venda') && (!tem('Apartação') || !!cur?.venda), dg:esc1.dg || '', esc:esc1.esc || '', av:esc1.av || '', obs,
        feito:(naFila ? '⏳ sem internet, na fila · ' : '') + feito.join(' · '), erro:erros.join(' · ')};
      S.animais = S.animais.filter(f => f.id !== a.id); S.animais.unshift(reg); salvar(); tabela();
      aviso(erros.length ? 'Atenção: ' + erros[0] : `${a.brinco} registrado`);
      limpa();
    };
    campoLeitor($('#a_cod'), ler);
    $('#a_bt').onclick = () => conectarBastao(v => { $('#a_cod').value = v; ler(v); });
    $('#a_cfg').onclick = () => ir2('sessao');
    if ($('#a_cur')) $('#a_cur').onclick = () => ir2('currais');
    $('#a_res').onclick = resumo;
    $('#a_fim').onclick = finalizar;
    tabela(); $('#a_cod').focus();
  };

  // ===== resumo =====
  const resumo = () => {
    const m = document.createElement('div'); m.className = 'modal';
    const ps = S.animais.filter(f => Number(f.peso) > 0), med = l => l.length ? fmtNum(l.reduce((s, f) => s + Number(f.peso), 0) / l.length, 1) : '–';
    const gs = S.animais.filter(f => f.gmd != null), gm = gs.length ? fmtNum(gs.reduce((s, f) => s + Number(String(f.gmd).replace(/\./g, '').replace(',', '.')), 0) / gs.length, 3) : '–';
    const porCur = tem('Apartação') ? S.currais.map(c => { const l = S.animais.filter(f => f.curral === c.nome); return `<tr><td><b>${esc(c.nome)}</b>${c.venda ? ' <span class="pill">venda</span>' : ''}</td><td class="num">${l.length}</td><td class="num">${med(l.filter(f => Number(f.peso) > 0))}</td></tr>`; }).join('') : '';
    m.innerHTML = `<div class="caixa" style="max-width:1000px;width:95vw"><h3>Resumo – ${esc(S.nome)}</h3>
      <div class="rodape" style="margin-top:0">${fD(S.data)} · ${esc(S.ops.join(', '))}</div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin:8px 0"><span class="pill">Animais: <b>${S.animais.length}</b></span>${ps.length ? `<span class="pill">Peso médio: <b>${med(ps)} kg</b></span>` : ''}${gs.length ? `<span class="pill">GMD médio: <b>${gm}</b></span>` : ''}
        ${S.animais.some(f => f.dg) ? `<span class="pill">Prenhes: <b>${S.animais.filter(f => f.dg === 'P').length}</b> · Vazias: <b>${S.animais.filter(f => f.dg === 'V').length}</b></span>` : ''}${tem('Venda') ? `<span class="pill">Para venda: <b>${S.animais.filter(f => f.venda).length}</b></span>` : ''}</div>
      ${porCur ? `<div class="tabela" style="margin-bottom:8px"><table><thead><tr><th>Curral</th><th class="num">Animais</th><th class="num">Peso médio</th></tr></thead><tbody>${porCur}</tbody></table></div>` : ''}
      <div class="tabela" style="max-height:48vh"><table><thead><tr><th>Hora</th><th>Brinco</th><th>Chip</th><th class="num">Peso</th><th class="num">GMD</th><th class="num">Ganho %</th>${tem('Apartação') ? '<th>Curral</th>' : ''}<th>Feito</th><th></th></tr></thead>
        <tbody>${S.animais.map((f, i) => `<tr><td>${esc(f.h)}</td><td><b>${esc(f.brinco)}</b></td><td>${esc(f.chip || '')}</td><td class="num">${fmtNum(f.peso, 1)}</td><td class="num">${f.gmd ?? ''}</td><td class="num">${f.taxa ?? ''}</td>${tem('Apartação') ? `<td>${esc(f.curral)}</td>` : ''}<td>${esc(f.feito)}${f.erro ? ` <span style="color:var(--vermelho)">${esc(f.erro)}</span>` : ''}</td><td><button class="btn sec peq" data-tira="${i}" title="Tirar da lista da sessão (o que já foi lançado continua no histórico do animal)">✕</button></td></tr>`).join('') || '<tr><td colspan="9" class="vazio">Nenhum animal</td></tr>'}</tbody></table></div>
      <div class="acoes"><button class="btn sec" id="r_csv">Exportar planilha</button><button class="btn sec" id="r_x">Fechar</button></div></div>`;
    document.body.appendChild(m);
    m.querySelector('#r_x').onclick = () => m.remove();
    m.querySelector('#r_csv').onclick = () => csv(S);
    m.querySelectorAll('[data-tira]').forEach(b => b.onclick = () => { if (!confirm('Tirar este animal da lista da sessão? O que já foi lançado no histórico dele continua.')) return; S.animais.splice(+b.dataset.tira, 1); salvar(); m.remove(); desenha(); resumo(); });
  };
  const csv = X => baixarCSV(X.nome + ' ' + fD(X.data), ['Hora','Brinco','Chip','Sexo','Peso (kg)','GMD','Ganho %','Curral','Venda','Diagnóstico','Escore','Avaliação','Tags','Feito','Erro'],

  // ===== finalizar =====
  const finalizar = async () => {
    if (!S.animais.length) { if (confirm('Nenhum animal registrado. Descartar esta sessão?')) { localStorage.removeItem(chave); S = novo(); desenha(); } return; }

      f.movOk = true; try { await sincLote({id:f.id, fazenda_id:fid, brinco:f.brinco, area_id:f.area_id, categoria_id:f.categoria_id}, f.mov.area || '', f.mov.cat || '', S.data); } catch(e) {}

    let t = ''; if (S.pes.length && navigator.onLine) t = await pesoLoteBrincos(S.pes, S.data);

    H.unshift({...S, fim:new Date().toISOString()}); try { localStorage.setItem(chH, JSON.stringify(H.slice(0, 40))); } catch(e) { try { localStorage.setItem(chH, JSON.stringify(H.slice(0, 10))); } catch(e2) {} }

      if (D?.itens?.length && !confirm(`Já existe uma ${tipo === 'Abate' ? 'venda para abate' : 'venda'} em andamento com ${D.itens.length} itens. Juntar os animais desta sessão nela?`)) D = null;
      D = D || {data:fin.data, contraparte:'', gta:'', doc:'', fd:'', ad:'', area_c:'', cat_c:'', sexo_c:'', raca_c:'', modo:(tipo === 'Abate' ? MODOS_CARC : MODOS_VIVO)[0], preco:'', carc:'', funr:'', outros:'', obs:'', gerar:true, pl_r:'', pl_d:'', cc:'', itens:[]};

      vend.forEach(f => { if (!D.itens.some(i => i.animal_id === f.id)) D.itens.push({k:'a', animal_id:f.id, brinco:f.brinco, peso_vivo:f.peso ? String(f.peso).replace('.', ',') : '', data_peso:f.peso ? fin.data : '', area_id:f.area_id, categoria_id:f.categoria_id, ant:f.ant}); });
      try { localStorage.setItem(kN, JSON.stringify(D)); } catch(e) {}

    if (fin.ops.includes('Compra')) return ir('neg_Compra');
    desenha();
  };

  // ===== sessões anteriores =====
  const historico = () => {
    let H = []; try { H = JSON.parse(localStorage.getItem(chH) || '[]'); } catch(e) {}

}

const NEG = {
  'Venda':{titulo:'Venda de animais vivos', pessoa:'Comprador', fin:'Receber', op:'Venda de animais'},
  'Abate':{titulo:'Venda para abate (frigorífico)', pessoa:'Frigorífico', fin:'Receber', op:'Venda de animais'},
  'Compra':{titulo:'Compra de animais', pessoa:'Vendedor', fin:'Pagar', op:'Compra de animais'},
  'Transferência':{titulo:'Transferência entre fazendas', pessoa:'', fin:null}};
const MODOS_VIVO = ['R$ por @ (peso vivo ÷ 30)','R$ por kg vivo','R$ por cabeça','Valor total'];
const MODOS_CARC = ['R$ por @ de carcaça (÷ 15)','R$ por kg de carcaça','R$ por cabeça','Valor total'];
const nBR = v => { v = String(v ?? '').trim(); if (!v) return 0; if (v.includes(',')) v = v.replace(/\./g,'').replace(',','.'); return Number(v) || 0; };
function calcNeg(D){
  const cab = D.itens.reduce((s,i) => s + (i.k === 'l' ? Number(i.quantidade) : 1), 0);
  const kg = D.itens.reduce((s,i) => s + (i.k === 'l' ? Number(i.quantidade) * nBR(i.peso_vivo) : nBR(i.peso_vivo)), 0);
  const carc = nBR(D.carc), preco = nBR(D.preco), m = D.modo || '';
  let bruto = 0;
  if (m.startsWith('R$ por @ (')) bruto = kg / 30 * preco;
  else if (m === 'R$ por kg vivo') bruto = kg * preco;
  else if (m.startsWith('R$ por @ de carcaça')) bruto = carc / 15 * preco;
  else if (m === 'R$ por kg de carcaça') bruto = carc * preco;
  else if (m === 'R$ por cabeça') bruto = cab * preco;
  else bruto = preco;
  const desc = bruto * nBR(D.funr) / 100 + nBR(D.outros);
  return {cab, kg, carc, bruto: Math.round(bruto*100)/100, desc: Math.round(desc*100)/100, liq: Math.round((bruto - desc)*100)/100};
}

// ---------- Fila sem internet (curral) ----------
const ehRede = r => !navigator.onLine || /fetch|network|Load failed|NetworkError|timeout/i.test(String(r?.error?.message || r?.message || ''));
const FILA = {
  ler(){ try { return JSON.parse(localStorage.getItem('fjk_fila') || '[]'); } catch(e) { return []; } },
  gravar(f){ try { localStorage.setItem('fjk_fila', JSON.stringify(f)); } catch(e) {} FILA.marca(); },
  por(item){ const f = FILA.ler(); f.push({...item, t:Date.now()}); FILA.gravar(f); },
  marca(){ const n = FILA.ler().length, b = document.getElementById('filaInd'); if (b) { b.style.display = n ? '' : 'none'; b.textContent = '⏳ ' + n; } },
  async enviar(){
    if (FILA._rodando || !navigator.onLine) return; const f = FILA.ler(); if (!f.length) return;
    FILA._rodando = true; const resto = []; let ok = 0, erros = [];
    for (const it of f) {
      let r;
      try { r = it.rpc ? await sb.rpc(it.rpc, it.args) : await sb.from(it.tabela).insert(it.linha); } catch(e) { r = {error:e}; }
      if (r.error && ehRede(r)) resto.push(it);
      else if (r.error) erros.push((it.desc || it.rpc) + ': ' + r.error.message.replace(/^.*?: /,''));
      else ok++;
    }
    FILA.gravar(resto.concat(FILA.ler().filter(x => !f.some(y => y.t === x.t))));
    FILA._rodando = false;
    if (ok) aviso(`${ok} lançamento(s) da fila enviados`);
    if (erros.length) alertaLista('Lançamentos da fila que não entraram', erros);
  }};
window.addEventListener('online', () => FILA.enviar());
setInterval(() => FILA.enviar(), 30000);
// chama a função do banco; sem internet guarda na fila
async function rpcF(nome, args, desc){
  let r; try { r = await sb.rpc(nome, args); } catch(e) { r = {error:e}; }
  if (r.error && ehRede(r)) { FILA.por({rpc:nome, args, desc}); return {fila:true}; }
  return r;
}

    localStorage.setItem('fjk_ani_' + fid, JSON.stringify(d)); } catch(e) {}
}
function animalLocal(cod, fid){
  try { const L = JSON.parse(localStorage.getItem('fjk_ani_' + (fid || E.fazenda.id)) || '[]'); const c = limpaCod(cod), d = soDig(c);

async function carenciaAnimal(a){

// ---------- Nota fiscal pelo arquivo XML ----------
function lerXmlNFe(txt){
  const x = new DOMParser().parseFromString(txt, 'application/xml');
  if (x.getElementsByTagName('parsererror').length) throw new Error('arquivo não é XML válido');
  const tg = (el, n) => el ? el.getElementsByTagNameNS('*', n)[0] || el.getElementsByTagName(n)[0] : null;
  const tx = (el, n) => tg(el, n)?.textContent?.trim() || '';
  const inf = tg(x, 'infNFe'); if (!inf) throw new Error('não é uma NF-e');
  const ide = tg(inf, 'ide'), emit = tg(inf, 'emit'), dest = tg(inf, 'dest'), tot = tg(inf, 'ICMSTot'), prot = tg(x, 'infProt');
  const chave = (tx(prot, 'chNFe') || (inf.getAttribute('Id') || '').replace(/^NFe/, '')).trim();
  const itens = [...inf.getElementsByTagNameNS('*', 'det')].map(d => { const p = tg(d, 'prod');
    return {codigo:tx(p,'cProd'), descricao:tx(p,'xProd'), ncm:tx(p,'NCM'), cfop:tx(p,'CFOP'), unidade_comercial:tx(p,'uCom'), quantidade_comercial:Number(tx(p,'qCom'))||0,
      valor_unitario:Number(tx(p,'vUnCom'))||0, valor_bruto:Number(tx(p,'vProd'))||0}; });
  const duplicatas = [...inf.getElementsByTagNameNS('*', 'dup')].map(d => ({numero:tx(d,'nDup'), data_vencimento:tx(d,'dVenc'), valor:Number(tx(d,'vDup'))||0}));
  const cst = tx(prot, 'cStat');
  return {chave, numero:tx(ide,'nNF'), serie:tx(ide,'serie'), data_emissao:tx(ide,'dhEmi') || tx(ide,'dEmi') || null, natureza_operacao:tx(ide,'natOp'),
    emitente_nome:tx(emit,'xNome'), emitente_doc:tx(emit,'CNPJ') || tx(emit,'CPF'), emitente_uf:tx(tg(emit,'enderEmit'),'UF'),
    destinatario_nome:tx(dest,'xNome'), destinatario_doc:tx(dest,'CNPJ') || tx(dest,'CPF'), valor_total:Number(tx(tot,'vNF'))||0,
    situacao_sefaz: cst === '100' ? 'Autorizada' : cst ? 'cStat ' + cst : 'Sem protocolo', completa:true, dados:{itens, duplicatas, origem:'xml'}};
}
function importarXmlNotas(depois){
  const inp = document.createElement('input'); inp.type = 'file'; inp.accept = '.xml,text/xml,application/xml'; inp.multiple = true;
  inp.onchange = async () => {
    const fz = finFaz(), ok = [], erros = [];
    for (const f of inp.files) {
      try { const n = lerXmlNFe(await f.text()); if (!n.chave) throw new Error('sem chave de acesso');
        const r = await sb.from('notas_fiscais').upsert({...n, fazenda_id:fz, status:'Nova'}, {onConflict:'fazenda_id,chave', ignoreDuplicates:true}).select('id');
        if (r.error) throw r.error; ok.push(r.data?.length ? n.numero : n.numero + ' (já existia)'); }
      catch(e) { erros.push(f.name + ': ' + e.message); }
    }
    alertaLista('Importação de XML', [`${ok.length} nota(s) importada(s)${ok.length ? ': ' + ok.join(', ') : ''}`, ...erros]);
    if (depois) depois();
  };
  inp.click();
}

// ---------- Conciliação bancária (extrato OFX) ----------
function lerOFX(txt){
  const g = (b, t) => { const m = b.match(new RegExp('<' + t + '>([^<\\r\\n]*)', 'i')); return m ? m[1].trim() : ''; };
  const dt = s => s ? `${s.slice(0,4)}-${s.slice(4,6)}-${s.slice(6,8)}` : '';
  const trs = txt.split(/<STMTTRN>/i).slice(1).map(b => ({fitid:g(b,'FITID'), data:dt(g(b,'DTPOSTED')), valor:Number(g(b,'TRNAMT').replace(',','.'))||0, desc:[g(b,'NAME'), g(b,'MEMO')].filter(Boolean).join(' – '), tipo:g(b,'TRNTYPE')}));
  const bal = txt.match(/<LEDGERBAL>[\s\S]*?<BALAMT>([^<\r\n]+)[\s\S]*?<DTASOF>([^<\r\n]+)/i);
  return {trs, saldo: bal ? Number(bal[1].replace(',','.')) : null, saldoData: bal ? dt(bal[2].trim()) : ''};
}

  const marcar = async i => { const passos = l.passos.map((p,j) => j === i ? {...p, feito:true, feito_em:hojeISO()} : p); const enc = passos.every(p => p.feito);

      if (r.error) { b.disabled = false; return aviso(r.error.message.replace(/^.*?: /,'')); }
      await marcar(i); aviso(`${r.data?.lancados || 0} inseminações lançadas` + (r.data?.erros?.length ? ` · ${r.data.erros.length} com problema` : ''));
      if (r.data?.erros?.length) alertaLista('Não lançadas', r.data.erros);
    } else if (p.dg) {
      m.remove(); const chave = 'fjk_man_' + E.fazenda.id; let S = null; try { S = JSON.parse(localStorage.getItem(chave)); } catch(e) {}
      S = {...(S || {feitos:[]}), data:hojeISO(), acoes:['dg']}; localStorage.setItem(chave, JSON.stringify(S)); await marcar(i);
      aviso('Manejo no curral aberto em modo diagnóstico'); ir('manejo'); return;
    } else await marcar(i);
    m.remove(); fichaIATF(l); telaIATF();
  });
}

  $('#corpo').innerHTML = `<div class="topo"><button class="voltar" id="volta">←</button><h2>Desempenho – ganho de peso</h2><button class="btn sec" id="csv">Exportar planilha</button></div>

    const por = {}; evs.forEach(e => (por[e.animal_id] = por[e.animal_id] || []).push(e));
    const G = {}, porArea = $('#g_por').value === 'area';
    Object.entries(por).forEach(([id, L]) => { const a = anis[id]; if (!a || L.length < 2) return; const p0 = L[0], p1 = L[L.length-1], d = (new Date(p1.data) - new Date(p0.data)) / 864e5; if (d < 7) return;
      const k = porArea ? a.area_id : a.categoria_id, g = G[k] = G[k] || {n:0, i:0, f:0, d:0, gm:0}; g.n++; g.i += +p0.peso; g.f += +p1.peso; g.d += d; g.gm += (p1.peso - p0.peso) / d; });
    rows = Object.entries(G).map(([k,g]) => ({nome:(porArea ? B.areaPor[k] : B.catPor[k]) || '(sem)', n:g.n, i:g.i/g.n, f:g.f/g.n, d:g.d/g.n, gmd:g.gm/g.n, arr:(g.f-g.i)/30})).sort((a,b) => b.gmd - a.gmd);

  calc();
}

// curva de peso (SVG) para a ficha do animal
function curvaPeso(pes){
  if (pes.length < 2) return '';
  const W = 520, H = 120, P = 24, xs = pes.map(p => new Date(p.data).getTime()), ys = pes.map(p => Number(p.peso));
  const x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys);
  const X = t => P + (x1 === x0 ? 0 : (t - x0) / (x1 - x0) * (W - 2*P)), Y = v => H - P - (y1 === y0 ? 0 : (v - y0) / (y1 - y0) * (H - 2*P));
  const pts = pes.map((p,i) => `${X(xs[i]).toFixed(1)},${Y(ys[i]).toFixed(1)}`).join(' ');
  return `<div class="secao">Curva de peso</div><svg viewBox="0 0 ${W} ${H}" style="width:100%;max-width:${W}px;background:#fff;border:1px solid var(--borda);border-radius:8px">
    <polyline points="${pts}" fill="none" stroke="#2f5d1e" stroke-width="2.5"/>${pes.map((p,i) => `<circle cx="${X(xs[i])}" cy="${Y(ys[i])}" r="3.5" fill="#4c8a2b"><title>${fD(p.data)}: ${fmtNum(p.peso,0)} kg</title></circle>`).join('')}
    <text x="${P}" y="14" font-size="11" fill="#6b7565">${fmtNum(y1,0)} kg</text><text x="${P}" y="${H-6}" font-size="11" fill="#6b7565">${fmtNum(y0,0)} kg · ${fD(pes[0].data)}</text><text x="${W-P}" y="${H-6}" font-size="11" fill="#6b7565" text-anchor="end">${fD(pes[pes.length-1].data)}</text></svg>`;
}

// ---------- Financeiro ----------
const finFaz = () => (E.fazendas.find(f => f.sede_financeiro) || E.fazenda).id;
const fD = v => v ? fmtData(v + 'T12:00:00') : '';
const moeda = v => (Number(v)||0).toLocaleString('pt-BR', {style:'currency', currency:'BRL'});
const OPS_FIN = {Pagar:['Pagamentos','Compra de produtos','Compra de animais','Transportes e fretes','Comissões'], Receber:['Recebimentos','Venda de animais','Venda de produtos']};
const FORMAS = ['PIX','Boleto','Transferência','Dinheiro','Cartão de crédito','Débito em conta','Cheque','Outros'];
let FIN = null;
async function todas(mk){ let out = [], i = 0; while (true) { const {data, error} = await mk().range(i, i+999); if (error) throw error; out = out.concat(data||[]); if (!data || data.length < 1000) break; i += 1000; } return out; }
async function carregarFin(forcar){
  if (FIN && !forcar && FIN.faz === finFaz()) return FIN;
  const fz = finFaz();
  const [contas, centros, planos, lancs, transf] = await Promise.all([
    todas(() => sb.from('contas_bancarias').select('*').eq('fazenda_id', fz).order('nome')),
    todas(() => sb.from('centros_custo').select('*').eq('fazenda_id', fz).order('nome')),
    todas(() => sb.from('plano_contas').select('*').eq('fazenda_id', fz).order('codigo')),
    todas(() => sb.from('lancamentos_financeiros').select('*').eq('fazenda_id', fz).order('vencimento').order('id')),
    todas(() => sb.from('transferencias_bancarias').select('*').eq('fazenda_id', fz).order('data'))]);
  const pessoas = await todas(() => sb.from('pessoas').select('id,nome,tipo,cpf_cnpj').eq('fazenda_id', fz).eq('ativo', true).order('nome')).catch(() => []);
  FIN = {faz:fz, contas, centros, planos, lancs, transf, pessoas};
  return FIN;
}
const nomeConta = id => FIN?.contas.find(c => c.id === id)?.nome || '';
const statusLanc = l => l.status === 'Efetivada' ? (l.tipo === 'Pagar' ? 'Pago' : 'Recebido') : l.status === 'Cancelada' ? 'Cancelada' : (l.vencimento < hojeISO() ? 'Vencida' : 'Em aberto');
const corStatus = s => ({Pago:'#e7f3df', Recebido:'#e7f3df', Vencida:'#fde8e6', Cancelada:'#eee'}[s] || '#fff4d6');
const grupoDoPlano = txt => { const cod = String(txt||'').split(' - ')[0].trim(); const p = FIN.planos.find(x => x.codigo === cod); return p ? p : null; };
// movimentos que entram no saldo de uma conta
function movimentosConta(c, ate){
  const lim = ate || hojeISO(), ini = c.data_saldo_inicial || '0000';
  const cartao = c.tipo === 'Cartão de crédito';
  const mv = [];
  FIN.lancs.forEach(l => {
    if (l.conta_id !== c.id || !l.data_pagamento || l.data_pagamento > lim || l.status === 'Cancelada') return;
    if (!cartao && (l.status !== 'Efetivada' || l.data_pagamento < ini)) return;
    const v = Number(l.valor_pago ?? l.valor) || 0;
    mv.push({data:l.data_pagamento, desc:l.pessoa, det:[l.plano_conta, l.observacao].filter(Boolean).join(' · '), op:l.operacao, valor:l.tipo === 'Receber' ? v : -v, lanc:l});
  });
  FIN.transf.forEach(t => {
    if (t.data > lim || t.data < ini) return;
    if (t.conta_origem_id === c.id) mv.push({data:t.data, desc:'Transferência para '+nomeConta(t.conta_destino_id), det:t.observacao||'', op:'Transferência', valor:-Number(t.valor), transf:t});
    if (t.conta_destino_id === c.id) mv.push({data:t.data, desc:'Transferência de '+nomeConta(t.conta_origem_id), det:t.observacao||'', op:'Transferência', valor:Number(t.valor), transf:t});
  });
  return mv.sort((a,b) => a.data < b.data ? -1 : a.data > b.data ? 1 : 0);
}
const saldoConta = (c, ate) => Number(c.saldo_inicial||0) + movimentosConta(c, ate).reduce((s,m) => s + m.valor, 0);

// junta as linhas de rateio da mesma parcela numa linha só (como no padrão: uma linha por parcela)
function parcelasFin(tipo){
  const g = new Map();
  FIN.lancs.filter(l => l.tipo === tipo).forEach(l => { const k = l.grupo ? l.grupo + '|' + l.parcela : l.id;
    if (!g.has(k)) g.set(k, {k, rows:[], ...l, valor:0, valor_pago:0}); const u = g.get(k); u.rows.push(l);
    u.valor += Number(l.valor)||0; if (l.status === 'Efetivada') u.valor_pago += Number(l.valor_pago ?? l.valor)||0; });
  return [...g.values()].map(u => { u.valor = Math.round(u.valor*100)/100; u.valor_pago = Math.round(u.valor_pago*100)/100;
    u.status = u.rows.every(r => r.status === 'Efetivada') ? 'Efetivada' : u.rows.some(r => r.status === 'Efetivada') ? 'Parcial' : u.rows[0].status;
    u.planos = [...new Set(u.rows.map(r => r.plano_conta).filter(Boolean))]; u.ccs = [...new Set(u.rows.flatMap(r => String(r.centro_custo||'').split(', ')).filter(Boolean))];
    u.fazs = [...new Set(u.rows.map(r => r.fazenda_ref_id).filter(Boolean))]; return u; });
}
const situacaoParc = u => u.status === 'Efetivada' ? (u.tipo === 'Pagar' ? 'Pago' : 'Recebido') : u.status === 'Parcial' ? 'Parcial' : u.status === 'Cancelada' ? 'Cancelada' : (u.vencimento < hojeISO() ? 'Vencida' : 'Em aberto');

// baixa de uma ou várias parcelas (com juros/multa e desconto); parcelas com rateio baixam todas as linhas
function formBaixa(us, tipo){
  us = us.filter(u => u && u.status !== 'Efetivada'); if (!us.length) return;
  const rec = tipo === 'Receber';
  const m = document.createElement('div'); m.className = 'modal';
  m.innerHTML = `<div class="caixa" style="max-width:900px"><h3>${rec ? 'Receber' : 'Pagar'} ${us.length} parcela(s)</h3>
    <div class="grade" style="grid-template-columns:repeat(3,1fr);gap:8px">
      <div><label>Data do ${rec ? 'recebimento' : 'pagamento'} *</label><input id="bx_d" type="date" value="${hojeISO()}"></div>
      <div><label>Conta bancária *</label><select id="bx_c"><option value="">—</option>${FIN.contas.filter(c => c.ativo).map(c => `<option value="${c.id}" ${c.id===us[0].conta_id?'selected':''}>${esc(c.nome)}</option>`).join('')}</select></div>
      <div><label>Forma de pagamento</label><select id="bx_f"><option value="">—</option>${FORMAS.map(f => `<option ${f===us[0].forma_pagamento?'selected':''}>${f}</option>`).join('')}</select></div></div>
    <div class="tabela" style="margin-top:8px"><table><thead><tr><th>Vencimento</th><th>${rec?'Cliente':'Fornecedor'}</th><th>Parcela</th><th class="num">Valor</th><th class="num">Juros/multa</th><th class="num">Desconto</th><th class="num">Valor ${rec?'recebido':'pago'}</th></tr></thead><tbody>
      ${us.map((u,i) => `<tr><td>${fD(u.vencimento)}</td><td>${esc(u.pessoa)}</td><td>${esc(u.parcela||'')}</td><td class="num">${fmtNum(u.valor)}</td>
        <td class="num"><input class="bj" data-i="${i}" inputmode="decimal" style="width:90px;text-align:right"></td><td class="num"><input class="bd" data-i="${i}" inputmode="decimal" style="width:90px;text-align:right"></td>
        <td class="num"><input class="bv" data-i="${i}" inputmode="decimal" style="width:110px;text-align:right" value="${fmtNum(u.valor)}"></td></tr>`).join('')}</tbody>
      <tfoot><tr><td colspan="6"><b>Total</b></td><td class="num" id="bx_t"></td></tr></tfoot></table></div>
    <div class="msg erro" id="bx_e" style="display:none"></div>
    <div class="acoes"><button class="btn sec" id="bx_x">Cancelar</button><button class="btn" id="bx_ok">Confirmar</button></div></div>`;
  document.body.appendChild(m);
  const q = s => m.querySelector(s), nb = v => { v = String(v ?? '').trim(); if (!v) return 0; if (v.includes(',')) v = v.replace(/\./g,'').replace(',', '.'); return Number(v) || 0; };
  const r2 = v => Math.round(v*100)/100;
  const tot = () => { q('#bx_t').textContent = fmtNum([...m.querySelectorAll('.bv')].reduce((s,i) => s + nb(i.value), 0)); };
  m.querySelectorAll('.bj,.bd').forEach(i => i.oninput = () => { const k = +i.dataset.i; m.querySelector(`.bv[data-i="${k}"]`).value = fmtNum(r2(us[k].valor + nb(m.querySelector(`.bj[data-i="${k}"]`).value) - nb(m.querySelector(`.bd[data-i="${k}"]`).value))); tot(); });
  m.querySelectorAll('.bv').forEach(i => i.oninput = tot); tot();
  q('#bx_x').onclick = () => m.remove();
  q('#bx_ok').onclick = async () => {
    const d = q('#bx_d').value, c = q('#bx_c').value, f = q('#bx_f').value || null, er = t => { q('#bx_e').textContent = t; q('#bx_e').style.display = 'block'; };
    if (!d) return er('Informe a data'); if (!c) return er('Escolha a conta bancária');
    q('#bx_ok').disabled = true; const agora = new Date().toISOString();
    for (const [i, u] of us.entries()) {
      const vp = nb(m.querySelector(`.bv[data-i="${i}"]`).value), jur = nb(m.querySelector(`.bj[data-i="${i}"]`).value), des = nb(m.querySelector(`.bd[data-i="${i}"]`).value);
      const abertas = u.rows.filter(r => r.status !== 'Efetivada'), base = abertas.reduce((s,r) => s + Number(r.valor), 0) || 1; let resto = vp;
      for (const [k, r] of abertas.entries()) { const v = k === abertas.length - 1 ? r2(resto) : r2(vp * Number(r.valor) / base); resto -= v;
        const res = await sb.from('lancamentos_financeiros').update({status:'Efetivada', data_pagamento:d, conta_id:c, forma_pagamento:f || r.forma_pagamento, valor_pago:v,
          ...(jur ? {juros:r2((Number(r.juros)||0) + jur * Number(r.valor) / base)} : {}), ...(des ? {desconto:r2((Number(r.desconto)||0) + des * Number(r.valor) / base)} : {}), atualizado_em:agora}).eq('id', r.id);
        if (res.error) { q('#bx_ok').disabled = false; return er(res.error.message); } }
    }
    m.remove(); aviso(`${us.length} parcela(s) ${rec ? 'recebida(s)' : 'paga(s)'}`); await carregarFin(true); render();
  };
}

// ---------- compras e pagamentos / vendas e recebimentos: lista das operações completas ----------
function operacoesFin(tipo){
  const g = new Map();
  FIN.lancs.filter(l => l.tipo === tipo).forEach(l => { const k = l.grupo || [l.operacao, l.pessoa, l.documento, l.data_emissao, String(l.parcela||'').split('/')[1] || '1'].join('|');
    if (!g.has(k)) g.set(k, {k, rows:[]}); g.get(k).rows.push(l); });
  return [...g.values()].map(o => { const r0 = o.rows[0], vs = o.rows.map(r => r.vencimento).filter(Boolean).sort();
    const pagas = o.rows.filter(r => r.status === 'Efetivada').length;
    return {...o, data:r0.data_emissao || vs[0], venc1:vs[0], operacao:r0.operacao, pessoa:r0.pessoa, documento:r0.documento, pedido:r0.numero_pedido, os:r0.ordem_servico, socio:r0.socio,
      valor:Math.round(o.rows.reduce((s,r) => s + Number(r.valor||0), 0)*100)/100, situacao:pagas === o.rows.length ? 'Concluída' : pagas ? 'Parcial' : 'Pendente',

  const gerarPar = () => { const n = Math.max(1, Math.min(120, parseInt(q('#n_npar').value) || 1)), v0 = q('#n_ven').value, dias = parseInt(q('#n_dias').value) || 0, mes = q('#n_mes').checked, vf = vfin();
    const base = Math.floor(vf / n * 100) / 100; let html = '';
    for (let i = 0; i < n; i++) { let d = v0;

        if (mes) { x = new Date(d0); x.setMonth(d0.getMonth() + i); if (x.getDate() !== d0.getDate()) x.setDate(0); } else x = new Date(d0.getTime() + dias * i * 864e5);
        d = new Date(x - x.getTimezoneOffset()*60000).toISOString().slice(0,10); }
      const v = i === n - 1 ? r2(vf - base * (n - 1)) : base;
      html += `<tr><td>${i+1}/${n}</td><td><input type="date" class="p_d" value="${d}"></td><td class="num"><input class="p_v" inputmode="decimal" style="width:120px;text-align:right" value="${bv(v)}"></td>

    q('#n_par').innerHTML = html;
    q('#n_par').querySelectorAll('tr').forEach(tr => { const ck = tr.querySelector('.p_pg'); ck.onchange = () => { tr.querySelector('.p_dp').style.display = tr.querySelector('.p_ct').style.display = ck.checked ? '' : 'none'; if (ck.checked && !tr.querySelector('.p_ct').value) tr.querySelector('.p_ct').value = q('#n_conta').value; }; });
